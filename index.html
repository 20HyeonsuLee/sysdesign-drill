<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="설계 꼬리질문">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)">
<title>시스템 설계 꼬리질문</title>
<style>
:root{
  --bg:#f6f6f3; --card:#fff; --text:#1f2328; --muted:#6b7280; --line:#e3e3df;
  --accent:#2457d6; --accent-weak:#e3ebfd; --ok:#167a3e; --ok-weak:#ddf5e5;
  --bad:#b42318; --bad-weak:#fde4e1; --mid:#a15c07; --mid-weak:#fdf0d5;
  --code-bg:#f2f2ef; --box-bg:#fbfbf9;
  --k-tx:#7c4dcc; --k-read:#2457d6; --k-check:#6b7280; --k-update:#167a3e; --k-call:#c2410c; --k-respond:#0f766e; --k-stop:#6b7280;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c; --card:#1d2027; --text:#e7e7e7; --muted:#9aa1ad; --line:#2f343e;
    --accent:#7aa2ff; --accent-weak:#1f2d4d; --ok:#5fd38d; --ok-weak:#163323;
    --bad:#ff8a80; --bad-weak:#3d1d1b; --mid:#f5b94a; --mid-weak:#3a2e14;
    --code-bg:#242832; --box-bg:#1a1d23;
    --k-tx:#b69cff; --k-read:#7aa2ff; --k-check:#9aa1ad; --k-update:#5fd38d; --k-call:#fb923c; --k-respond:#5eead4; --k-stop:#9aa1ad;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c; --card:#1d2027; --text:#e7e7e7; --muted:#9aa1ad; --line:#2f343e;
  --accent:#7aa2ff; --accent-weak:#1f2d4d; --ok:#5fd38d; --ok-weak:#163323;
  --bad:#ff8a80; --bad-weak:#3d1d1b; --mid:#f5b94a; --mid-weak:#3a2e14;
  --code-bg:#242832; --box-bg:#1a1d23;
  --k-tx:#b69cff; --k-read:#7aa2ff; --k-check:#9aa1ad; --k-update:#5fd38d; --k-call:#fb923c; --k-respond:#5eead4; --k-stop:#9aa1ad;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.mono,.trace td.mono{font-family:"SF Mono",Menlo,Consolas,"D2Coding",monospace;font-size:12.5px}
.wrap{max-width:920px;margin:0 auto;padding:16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
header.top h1{font-size:16px;margin:0;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:3px 10px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#0d1b3a}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-size:14px}
@media (hover:hover){.btn:hover:not(:disabled){border-color:var(--accent)}}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1b3a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary,:root:not([data-theme="light"]) .seg button.on{color:#0d1b3a}}
.btn.ghost{background:none}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font-size:18px;margin:26px 0 10px}
h3{font-size:15px;margin:0}
h3.sub{margin:24px 0 10px;font-size:16px;font-weight:700;letter-spacing:-.01em}
h3.sub.first{margin-top:2px}
p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.intro p{margin:4px 0}
.pcard p{margin:6px 0 10px}
h3.axis{margin:18px 0 8px;font-size:13px;color:var(--muted);font-weight:600}

/* 단계 */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.step{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted)}
.steps.big .step{font-size:13px;padding:5px 12px}
.step.solved{border-color:var(--ok);color:var(--ok);background:var(--ok-weak)}
.step.gaveup{border-color:var(--mid);color:var(--mid);background:var(--mid-weak)}
.step.open{color:var(--text)}
.step.locked{opacity:.5}
.step.cur{outline:2px solid var(--accent);outline-offset:1px}
details.ctx{margin-bottom:12px;color:var(--muted)}
details.ctx summary{cursor:pointer;font-size:13px}
details.ctx p{font-size:14px}

/* 문제 카드 */
.interviewer{display:flex;gap:10px;align-items:baseline;background:var(--accent-weak);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.interviewer .who{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.ask{margin:10px 0 0;padding-left:18px}
.ask li{margin:6px 0;line-height:1.6}
.meta{margin-top:10px}
ul.rules{margin:0;padding-left:20px}
ul.rules li{margin:2px 0}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.test{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--box-bg)}
.test b{font-size:13.5px;margin-right:4px}
.tid{font-size:11px;color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:999px;background:var(--mid-weak);color:var(--mid);margin-left:4px;white-space:nowrap}
details.help{margin:12px 0 0;font-size:13.5px}
details.help summary{cursor:pointer;color:var(--accent)}
details.help ul{padding-left:20px;margin:6px 0}
details.help li{margin:3px 0}

/* 블록 편집기 */
.editor{border:1px dashed var(--line);border-radius:12px;padding:10px;background:var(--box-bg)}
.blist{display:flex;flex-direction:column;gap:6px}
.blk{display:flex;align-items:flex-start;gap:6px;border:1px solid var(--line);border-left:4px solid var(--k-check);border-radius:8px;background:var(--card);padding:6px 8px}
.blk .body{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;min-width:0}
.blk .body b{font-size:13.5px;margin-right:2px}
.blk .lbl{font-size:12.5px;color:var(--muted)}
.blk .sep{flex-basis:100%;height:0}
.blk .muted{font-size:12px}
.k-begin,.k-commit{border-left-color:var(--k-tx)!important}
.k-read{border-left-color:var(--k-read)!important}
.k-check{border-left-color:var(--k-check)!important}
.k-update{border-left-color:var(--k-update)!important}
.k-call{border-left-color:var(--k-call)!important}
.k-respond{border-left-color:var(--k-respond)!important}
.k-stop,.k-ack{border-left-color:var(--k-stop)!important}
.k-insert,.k-delete{border-left-color:var(--k-update)!important}
.k-count{border-left-color:var(--k-read)!important}
.k-if{border-left-color:var(--k-check)!important}
.k-publish,.k-cget,.k-cset,.k-cdel,.k-cincr{border-left-color:var(--k-call)!important}
.tools{display:flex;gap:2px;flex-shrink:0}
.ib{background:none;border:1px solid transparent;border-radius:6px;padding:0 6px;font-size:13px;color:var(--muted);line-height:22px}
@media (hover:hover){.ib:hover:not(:disabled){border-color:var(--line);color:var(--text)}.ib.del:hover{color:var(--bad)}}
.ib:disabled{opacity:.3}
select{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:2px 4px;font-size:13px;max-width:100%}
select.need{border-color:var(--bad);color:var(--bad)}
select.narrow{min-width:40px}
.branches{margin:6px 0 2px 14px;padding-left:10px;border-left:2px solid var(--k-call);display:flex;flex-direction:column;gap:8px}
.brlabel{font-size:12.5px;font-weight:700;color:var(--k-call);margin-bottom:4px}
.addrow{display:flex;align-items:center;gap:8px}
select.adder{border-style:dashed;color:var(--muted);background:none}
.actions{margin-top:14px}
.msg{margin-top:8px}
.warn{background:var(--bad-weak);color:var(--bad);border-radius:8px;padding:8px 10px;font-size:13.5px}

/* 결과 */
.result{margin-top:12px}
.score{padding:8px 12px;border-radius:10px;margin-bottom:8px}
.score.ok{background:var(--ok-weak);color:var(--ok)}
.score.bad{background:var(--bad-weak);color:var(--bad)}
.score .muted{color:var(--muted)}
.tres{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:6px}
.tres.fail{border-color:var(--bad)}
.tres summary{cursor:pointer;list-style:none}
.tres summary::-webkit-details-marker{display:none}
.thead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mark{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.mark.ok{background:var(--ok-weak);color:var(--ok)}
.mark.bad{background:var(--bad-weak);color:var(--bad)}
ul.viol{margin:6px 0;padding-left:20px;color:var(--bad);font-size:13.5px}
.cxlabel{margin:6px 0 4px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
table.trace{font-size:13px}
table.trace.timing{min-width:480px}
table.trace th,table.trace td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
table.trace th{font-size:12px;color:var(--muted);font-weight:600}
table.trace td.n{color:var(--muted);width:28px;font-variant-numeric:tabular-nums}
table.trace td.who{white-space:nowrap;font-weight:600}
table.trace tr.fault td{background:var(--mid-weak)}
table.trace tr.crash td,table.trace tr.err td{background:var(--bad-weak)}
table.trace tr.same td{color:var(--muted);font-style:italic}
table.trace tfoot td{font-weight:700;border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.chg{margin-top:3px;padding:3px 6px;border-radius:6px;background:var(--accent-weak);font-size:12px}
.chg div{line-height:1.45}
.chg .mono{font-size:12px}
details.start{margin:4px 0 6px}
details.start summary{cursor:pointer;color:var(--muted)}
.ptypes{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.ptype{font-size:11.5px;padding:0 8px;border-radius:999px;background:var(--accent-weak);color:var(--accent)}

/* 정량, 선택 */
.flowtext{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--box-bg);font-size:13.5px}
.ft{border-left:3px solid var(--k-check);padding:1px 8px;margin:2px 0}
.ft.br{border-left-color:transparent;color:var(--k-call);font-weight:700;font-size:12.5px}
.ft.d1{margin-left:16px}.ft.d2{margin-left:32px}.ft.d3{margin-left:48px}.ft.d4{margin-left:64px}
table.givens td{border-bottom:1px solid var(--line);padding:4px 6px;font-size:13.5px}
table.givens td.num{white-space:normal;text-align:right}
.qs{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.q{border-top:1px solid var(--line);padding-top:10px}
.qt{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.numin{width:130px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--card);text-align:right}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px}
.opt input{margin-top:5px}
.opt.right{border-color:var(--ok);background:var(--ok-weak)}
.explain{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--box-bg);border:1px solid var(--line)}
.essay textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);resize:vertical;margin-bottom:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.cmp>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--box-bg)}

/* 힌트, 해설 */
.hints .hint{display:flex;gap:8px;margin:8px 0;font-size:14px}
.hn{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--accent-weak);color:var(--accent);font-size:12px;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.hints .row{margin-top:8px}
.answer ul{padding-left:20px}
.answer li{margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.speak{background:var(--accent-weak);border-radius:10px;padding:10px 12px}
.next{margin:4px 0 30px}

/* 통계 */
table.stats th,table.stats td{border-bottom:1px solid var(--line);padding:6px;text-align:left;font-size:13.5px}
table.stats th{font-size:12px;color:var(--muted);font-weight:600}
.barcell{width:35%}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.verdict{white-space:nowrap}
.v-체화{color:var(--ok)}.v-약함{color:var(--bad)}.v-익히는{color:var(--mid)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:640px){
  .wrap{padding:12px 16px}
  .two,.cmp{grid-template-columns:1fr}
  .tests{grid-template-columns:1fr}
  .branches{margin-left:4px;padding-left:8px}
  .seg button{padding:3px 8px}
}

/* 블록 카드: 문장 + 칩 */
.blk .body{display:flex;flex-wrap:wrap;align-items:center;gap:5px;flex:1;min-width:0;line-height:1.5}
.fx{font-size:13.5px}
.w{font-size:13px;color:var(--muted)}
.clause{display:flex;flex-wrap:wrap;align-items:center;gap:5px;flex-basis:100%}
.chip{border:1px solid var(--accent);color:var(--accent);background:var(--accent-weak);border-radius:999px;padding:2px 10px;font-size:13.5px;min-height:28px;line-height:1.3;text-align:left;max-width:100%}
.chip.need{border-color:var(--bad);color:var(--bad);background:var(--bad-weak)}
.chip.op{min-width:34px;text-align:center}
.chip.add{border-style:dashed;color:var(--muted);background:none;border-color:var(--line)}
.chip.add.paste{color:var(--accent);border-color:var(--accent)}
.chip.mini{min-height:24px;padding:0 8px;font-size:12.5px}
.ib.more{font-size:18px;line-height:24px;padding:0 8px;flex-shrink:0}
.branch.empty{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.branch.empty .brlabel{margin:0}
.adds{display:inline-flex;gap:6px;flex-wrap:wrap}
.flowname{font-size:13px;font-weight:700;margin:14px 0 6px}

/* 선택판 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:72vh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding-bottom:env(safe-area-inset-bottom)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-head b{flex:1;font-size:14px}
.sheet-list{overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;font-size:15px}
.sheet-opt .sub{font-size:12.5px;color:var(--muted)}
.sheet-opt.cur{background:var(--accent-weak);color:var(--accent);font-weight:600}
.sheet-opt.danger{color:var(--bad)}
@media (hover:hover){.sheet-opt:hover{background:var(--box-bg)}}

/* 말로 먼저 설계 */
.draft{margin-top:14px}
.draftin{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);resize:vertical;font-size:14.5px}
.draft-text{white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--box-bg);font-size:14px}

/* 가독성: 문제 화면 배치 */
.wrap.wide{max-width:1280px}
.lv-work>.card{margin-bottom:12px}
.attempt{margin:-4px 0 10px;gap:10px}
details.fold{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
details.fold>summary{cursor:pointer;font-size:15px;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'▸';display:inline-block;width:16px;color:var(--muted);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>.tests,details.fold>.helplist{margin-top:10px}
.helplist{padding-left:18px;font-size:14px}
.helplist li{margin:6px 0}
.test .thd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.test .tags{margin:2px 0}
.test .tag{margin-left:0;margin-right:4px}
@media (min-width:1100px){
  .lv-grid{display:grid;grid-template-columns:minmax(380px,460px) minmax(0,1fr);gap:16px;align-items:start}
  .lv-info{position:sticky;top:62px;max-height:calc(100vh - 74px);overflow-y:auto;border-radius:14px}
  .lv-info .card{margin-bottom:0}
  .lv-info .tests{grid-template-columns:1fr}
  .refbar{display:none!important}
}
@media (max-width:1099px){
  .refbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.06)}
  .lv-work{padding-bottom:56px}
  .toast{bottom:76px}
}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 18px;font-size:14.5px}
.sheet-body .tests{grid-template-columns:1fr}

/* 결과 */
.passes{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 10px}
.passchip{font-size:12.5px;padding:1px 8px;border-radius:999px;background:var(--ok-weak);color:var(--ok);white-space:nowrap}
.whob{display:inline-block;padding:0 7px;border-radius:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.whob.c0{background:#e3ebfd;color:#1d4ed8}.whob.c1{background:#fde7d9;color:#b45309}.whob.c2{background:#e4f5e9;color:#15803d}
.whob.c3{background:#f1e6fd;color:#7c3aed}.whob.c4{background:#fde4ea;color:#be185d}.whob.c5{background:#e0f4f6;color:#0e7490}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .whob.c0{background:#1f2d4d;color:#9db8ff}:root:not([data-theme="light"]) .whob.c1{background:#3a2a17;color:#fdba74}:root:not([data-theme="light"]) .whob.c2{background:#163323;color:#86efac}:root:not([data-theme="light"]) .whob.c3{background:#2e2142;color:#c4b5fd}:root:not([data-theme="light"]) .whob.c4{background:#3d1d2a;color:#f9a8d4}:root:not([data-theme="light"]) .whob.c5{background:#14333a;color:#67e8f9}}

<body>
<div id="app"></div>
<noscript>자바스크립트가 필요하다.</noscript>
<script>
// ---- src/engine.js
/* 채점 엔진 v2
 * 블록 흐름(설계)을 작은 상태 기계로 돌린다. 행위자 실행 순서, 서버 다운 지점, 외부 호출과 메시지 발행 결과를
 * 모두 펼쳐 보고(BFS) 규칙 위반을 찾는다. BFS라서 처음 찾은 위반이 가장 짧은 반례다.
 *
 * 세계는 문제가 선언한다(problem.world). 엔진은 자원 종류별 동작만 안다.
 * - 서비스: DB를 하나씩 가진다. 흐름은 한 서비스에 속하고, 트랜잭션은 그 서비스 DB 안에서만 열린다.
 * - 테이블: 키별 행, 유니크 필드. MySQL InnoDB REPEATABLE READ를 단순화했다.
 *   일반 읽기: 트랜잭션 안이면 첫 일반 읽기 시점의 스냅샷(내가 쓴 값은 보임), 밖이면 최신 커밋 값.
 *   FOR UPDATE 읽기, 변경, 삭제, 삽입: 행 배타 잠금을 트랜잭션 끝까지 쥔다. 남이 쥐고 있으면 기다린다.
 *   트랜잭션 밖이면 문장이 끝날 때 바로 커밋되고 잠금도 풀린다. 삽입은 키와 유니크 값에도 잠금을 건다.
 *   중복 키 오류는 그 문장만 실패하고 트랜잭션은 이어진다(갈래 "중복이면").
 *   잠금 대기가 고리를 이루면 데드락이다. 마지막으로 기다리려던 쪽이 롤백되고 오류로 끝난다.
 *   갭 잠금, 잠금 대기 타임아웃은 없다.
 * - 외부 시스템: 연산별 결과 갈래와 장애 결과를 문제가 정의한다(run 함수).
 * - 메시지 큐(Kafka 단순화): 토픽은 파티션 n개. 파티션마다 소비자 하나가 차례로 처리한다.
 *   발행 결과는 성공, 실패(안 써짐), 타임아웃(써졌을 수도 안 써졌을 수도). 키가 없으면 어느 파티션이든 간다.
 *   소비 흐름은 메시지마다 돈다. 소비 확인 = 오프셋 커밋. 확인 없이 끝나도 다음 메시지로 넘어간다.
 *   소비자가 죽으면 마지막으로 커밋한 오프셋부터 다시 받는다.
 * - 캐시: 키-값. 읽기(있음/없음), 쓰기(항상, 없을 때만, 버전이 더 클 때만), 삭제, 카운터 증가. 연산 하나는 원자적이다.
 * - 복제본: 커밋된 쓰기가 커밋 순서대로 늦게 반영된다(복제 행위자가 한 건씩 반영).
 * - 배경 흐름: 요청이 다 끝난 뒤(after) 또는 요청과 함께(concurrent) 돈다. 테이블의 행마다 돌 수 있다(each).
 *   instances를 주면 같은 흐름을 서버 여러 대가 동시에 돈다(행위자 이름 뒤에 1, 2…).
 *   last는 요청이 끝나고 소비자가 받은 메시지를 다 처리한 뒤에 돈다. afterClock이면 시간 사건이 다 일어난 뒤에 남은 회차를 돈다.
 *   요청이 다 끝난 뒤 rounds회차(기본 3)를 더 돌고 끝난다. 요청이 도는 동안에도 preRounds회차(기본 rounds)까지만 돈다.
 * - 시간: 테스트가 정한 사건(시각이 지남, 캐시 키 만료)을 "시간" 행위자가 아무 때나 순서대로 한 번씩 일으킨다.
 * - 장애: 서버 다운(아무 블록 사이), 외부 호출과 발행의 장애 결과. 테스트마다 장애 예산이 있다.
 * - 갈래가 비어 있으면 다음 블록으로 넘어간다. "확인"이 어긋나면 실패로 끝난다(요청은 실패 응답,
 *   배경 흐름은 이 행 처리 끝, 소비 흐름은 이 메시지 처리 끝).
 */
(function (root) {
  'use strict';
  const SD = (root.SD = root.SD || {});
  SD.problems = SD.problems || [];

  const LIMIT = 250000;
  const RUNS = 3;
  const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  const same = (x, y) => JSON.stringify(x === undefined ? null : x) === JSON.stringify(y === undefined ? null : y);

  class FlowErr extends Error {}
  class Fresh extends Error {}

  const OP_TEXT = { eq: '=', ne: '≠', lt: '<', le: '≤', gt: '>', ge: '≥', exists: '있음', absent: '없음' };
  const UNARY = { exists: true, absent: true };
  function cmp(x, op, y) {
    switch (op) {
      case 'eq':
        return same(x, y);
      case 'ne':
        return !same(x, y);
      case 'lt':
        return x != null && y != null && x < y;
      case 'le':
        return x != null && y != null && x <= y;
      case 'gt':
        return x != null && y != null && x > y;
      case 'ge':
        return x != null && y != null && x >= y;
      case 'exists':
        return x != null;
      case 'absent':
        return x == null;
      default:
        throw new FlowErr(`비교 방법을 고르지 않았다`);
    }
  }

  // ---------- 세계 선언 ----------
  const MAIN = 'main';
  function tableSpec(P, t) {
    const x = P.world.tables && P.world.tables[t];
    if (!x) throw new FlowErr(`테이블을 고르지 않았다`);
    return x;
  }
  const tLabel = (P, t) => (P.world.tables && P.world.tables[t] && P.world.tables[t].label) || t;
  const svcOfTable = (P, t) => tableSpec(P, t).service || MAIN;
  function services(P) {
    const set = new Set([MAIN]);
    for (const t of Object.keys(P.world.tables || {})) set.add(P.world.tables[t].service || MAIN);
    return [...set];
  }
  function extOp(P, ext, op) {
    const e = P.world.exts && P.world.exts[ext];
    if (!e || !e.ops[op]) throw new FlowErr('외부 호출 연산을 고르지 않았다');
    return e.ops[op];
  }
  function topicSpec(P, name) {
    const T = P.world.topics && P.world.topics[name];
    if (!T) throw new FlowErr('토픽을 고르지 않았다');
    return T;
  }
  function cacheSpec(P, name) {
    const C = P.world.caches && P.world.caches[name];
    if (!C) throw new FlowErr('캐시를 고르지 않았다');
    return C;
  }
  const replicated = (P, svc) => {
    const r = P.world.replica;
    return r === true || (Array.isArray(r) && r.includes(svc));
  };

  // ---------- 블록 갈래 ----------
  function branchesOf(P, b) {
    switch (b.t) {
      case 'call': {
        try {
          return extOp(P, b.ext, b.op).outcomes.map(([n, label]) => ({ n, label }));
        } catch (e) {
          return [];
        }
      }
      case 'update':
      case 'delete':
        return [
          { n: 'ok', label: '1건이면' },
          { n: 'zero', label: '0건이면' },
        ];
      case 'insert':
        return [
          { n: 'ok', label: '들어가면' },
          { n: 'dup', label: '중복이면' },
        ];
      case 'if':
        return [
          { n: 'yes', label: '맞으면' },
          { n: 'no', label: '아니면' },
        ];
      case 'cget':
        return [
          { n: 'hit', label: '있으면' },
          { n: 'miss', label: '없으면' },
        ];
      case 'cset':
        return b.cond && b.cond !== 'always'
          ? [
              { n: 'ok', label: '쓰이면' },
              { n: 'rejected', label: '안 쓰이면' },
            ]
          : [];
      case 'publish':
        return [
          { n: 'ok', label: '발행되면' },
          { n: 'fail', label: '실패하면' },
          { n: 'timeout', label: '타임아웃이면' },
        ];
      default:
        return [];
    }
  }

  // ---------- 컴파일: 블록 트리 → 점프가 있는 명령 배열 ----------
  function compile(P, flow) {
    const code = [];
    const emit = (list) => {
      for (const b of list || []) {
        const brs = branchesOf(P, b);
        const ins = Object.assign({}, b);
        delete ins.br;
        code.push(ins);
        if (!brs.length) continue;
        ins.targets = {};
        const jumps = [];
        for (const br of brs) {
          ins.targets[br.n] = code.length;
          emit(b.br && b.br[br.n]);
          const j = { t: 'jmp', to: -1 };
          jumps.push(j);
          code.push(j);
        }
        for (const j of jumps) j.to = code.length;
      }
    };
    emit(flow);
    code.push({ t: 'end' });
    return code;
  }
  const skipJmp = (code, pc) => {
    while (code[pc] && code[pc].t === 'jmp') pc = code[pc].to;
    return pc;
  };

  // ---------- 값 ----------
  // '$me' 요청한 사용자, '$p.x' 요청 값, '$m.x' 받은 메시지, '$r.표.필드' 마지막으로 읽은 행,
  // '$n.표' 마지막으로 센 개수, '$c.캐시[.필드]' 마지막으로 읽은 캐시 값, '$cur' 배경 흐름이 처리 중인 행 키,
  // '$new[.접두]' 새 번호. 배열은 '-'로 잇는다. '$'로 시작하지 않으면 그대로.
  function val(tok, a, s, ctx, pure) {
    if (Array.isArray(tok)) return tok.map((x) => val(x, a, s, ctx, pure)).join('-');
    if (typeof tok !== 'string' || tok[0] !== '$') return tok === undefined ? null : tok;
    const parts = tok.slice(1).split('.');
    const head = parts.shift();
    let v;
    switch (head) {
      case 'me':
        if (a.user == null) throw new FlowErr('이 흐름에는 요청한 사용자(나)가 없다');
        return a.user;
      case 'cur':
        if (a.cur == null) throw new FlowErr('지금 처리 중인 행이 없다');
        return a.cur;
      case 'new':
        if (pure) throw new Fresh();
        s.seq += 1;
        return `${parts[0] || 'n'}${s.seq}`;
      case 'p':
        v = a.params || {};
        break;
      case 'm':
        if (!a.msg) throw new FlowErr('메시지를 받기 전이다');
        v = a.msg.payload;
        break;
      case 'r': {
        const t = parts.shift();
        if (!(t in a.reg)) throw new FlowErr(`읽지 않은 ${tLabel(ctx.P, t)} 값을 썼다`);
        v = a.reg[t];
        break;
      }
      case 'n': {
        const t = parts.shift();
        if (!(t in a.cnt)) throw new FlowErr(`세지 않은 ${tLabel(ctx.P, t)} 개수를 썼다`);
        return a.cnt[t];
      }
      case 'c': {
        const c = parts.shift();
        if (!(c in a.creg)) throw new FlowErr('읽지 않은 캐시 값을 썼다');
        v = a.creg[c];
        break;
      }
      case 'x': {
        const e = parts.shift();
        if (!a.xreg || !(e in a.xreg)) throw new FlowErr('외부 호출 결과 값을 받기 전에 썼다');
        v = a.xreg[e];
        break;
      }
      default:
        throw new FlowErr(`알 수 없는 값 ${tok}`);
    }
    for (const k of parts) {
      if (v == null) return null;
      v = v[k];
    }
    return v === undefined ? null : clone(v);
  }

  // 값 토큰을 사람이 읽는 이름으로. 단계(labels)와 문제(labels)에 적은 이름이 먼저다.
  function fieldLabel(P, t, f) {
    const spec = P.world.tables && P.world.tables[t];
    return (spec && spec.fields && spec.fields[f] && spec.fields[f].label) || f;
  }
  function tokText(P, level, tok) {
    const L = Object.assign({}, P.labels || {}, (level && level.labels) || {});
    if (typeof tok === 'string' && L[tok]) return L[tok];
    if (Array.isArray(tok)) return tok.map((x) => tokText(P, level, x)).join('-');
    if (tok === null || tok === undefined) return '없음';
    if (typeof tok !== 'string' || tok[0] !== '$') return String(tok);
    const parts = tok.slice(1).split('.');
    switch (parts[0]) {
      case 'me':
        return '나';
      case 'cur':
        return '처리 중인 행';
      case 'new':
        return '새 번호';
      case 'p':
        return (P.world.params && P.world.params[parts[1]]) || `요청의 ${parts[1]}`;
      case 'm':
        return `메시지의 ${(P.world.msgFields && P.world.msgFields[parts[1]]) || parts[1]}`;
      case 'r':
        return parts[2] ? `읽은 ${fieldLabel(P, parts[1], parts[2])}` : `읽은 ${tLabel(P, parts[1])}`;
      case 'n':
        return `센 ${tLabel(P, parts[1])} 개수`;
      case 'c':
        return parts[2] ? `캐시에서 읽은 ${parts[2]}` : '캐시에서 읽은 값';
      case 'x':
        return `${(P.world.exts && P.world.exts[parts[1]] && P.world.exts[parts[1]].label) || parts[1]}가 돌려준 값`;
      default:
        return tok;
    }
  }

  function fmtVal(v) {
    if (v == null) return '-';
    if (typeof v === 'object') {
      const ks = Object.keys(v).filter((k) => k[0] !== '$');
      return ks.map((k) => fmtVal(v[k])).join('/');
    }
    return String(v);
  }
  function fmtRow(P, t, row) {
    if (row == null) return '없음';
    const spec = P.world.tables[t];
    const fs = spec && spec.fields ? Object.keys(spec.fields) : Object.keys(row);
    return fs.map((f) => (row[f] == null ? '-' : row[f])).join('/');
  }

  // ---------- 행 보기 ----------
  function committedRow(s, svc, t, k) {
    const tb = s.db[svc][t];
    return tb && tb[k] !== undefined ? tb[k] : null;
  }
  function ownWrite(a, t, k) {
    return a.tx && a.tx.w[t] && k in a.tx.w[t] ? { v: a.tx.w[t][k] } : null;
  }
  function latest(s, a, svc, t, k) {
    const o = ownWrite(a, t, k);
    return o ? o.v : committedRow(s, svc, t, k);
  }
  function snapOf(s, a, svc) {
    if (!a.tx.snap) a.tx.snap = clone(s.db[svc]);
    return a.tx.snap;
  }
  function snapshot(s, a, svc, t, k) {
    const o = ownWrite(a, t, k);
    if (o) return o.v;
    const tb = snapOf(s, a, svc)[t];
    return tb && tb[k] !== undefined ? tb[k] : null;
  }
  function visibleRows(s, a, svc, t, snap) {
    const base = snap ? snapOf(s, a, svc)[t] || {} : s.db[svc][t] || {};
    const out = Object.assign({}, base);
    if (a.tx && a.tx.w[t]) for (const k of Object.keys(a.tx.w[t])) out[k] = a.tx.w[t][k];
    return out;
  }
  function matches(row, where, a, s, ctx) {
    if (row == null) return false;
    for (const c of where || []) {
      if (c.v === '*') continue;
      if (!cmp(row[c.f], c.op || 'eq', UNARY[c.op] ? null : val(c.v, a, s, ctx))) return false;
    }
    return true;
  }
  function applySet(row, set, a, s, ctx) {
    const nv = Object.assign({}, row);
    for (const f of Object.keys(set || {})) {
      const x = set[f];
      if (x === undefined || x === '*') continue;
      if (x && typeof x === 'object' && !Array.isArray(x)) {
        // base가 있으면 그 값(보통 앞서 읽은 값)에서 계산한다: 앱이 읽은 값으로 계산해 덮어쓰는 경우.
        // 없으면 행의 최신 값에서 더한다: SET x = x + d 한 문장.
        const d = val(x.add != null ? x.add : x.sub, a, s, ctx);
        const b = x.base != null ? val(x.base, a, s, ctx) : nv[f];
        const cur = b == null ? 0 : b;
        nv[f] = x.add != null ? cur + d : cur - d;
      } else nv[f] = val(x, a, s, ctx);
    }
    return nv;
  }

  // ---------- 쓰기, 잠금 ----------
  function writeRow(s, svc, t, k, row) {
    s.db[svc][t] = s.db[svc][t] || {};
    if (row === null) delete s.db[svc][t][k];
    else s.db[svc][t][k] = row;
    if (s.rep && s.rep[svc]) s.replog.push({ svc, t, k, row });
  }
  const rowLock = (svc, t, k) => `${svc}/${t}/${k}`;
  const uniqLock = (svc, t, f, v) => `${svc}/${t}#${f}=${JSON.stringify(v)}`;
  function takeLock(s, ctx, i, key) {
    if (s.locks[key] === i) return;
    s.locks[key] = i;
    if (ctx.lat) {
      const a = s.actors[i];
      a.lk = a.lk || {};
      a.lk[key] = a.t;
    }
  }
  // 트랜잭션 밖 문장은 그 문장 동안만 행을 잠근다.
  function stmtLock(ctx, a, svc, t, k, ms) {
    if (!ctx.lat) return;
    const rk = `${t}/${k}`;
    a.L = Math.max(a.L || 0, ms);
    a.Lk = a.Lk || {};
    a.Lk[rk] = Math.max(a.Lk[rk] || 0, ms);
  }
  function releaseLocks(s, ctx, i) {
    const a = s.actors[i];
    for (const k of Object.keys(s.locks)) {
      if (s.locks[k] !== i) continue;
      delete s.locks[k];
      if (ctx.lat && a.lk && a.lk[k] != null) {
        const held = a.t - a.lk[k];
        a.L = Math.max(a.L || 0, held);
        const rk = k.slice(k.indexOf('/') + 1);
        a.Lk = a.Lk || {};
        a.Lk[rk] = Math.max(a.Lk[rk] || 0, held);
      }
    }
    if (a.lk) a.lk = {};
  }
  function commitTx(s, ctx, i) {
    const a = s.actors[i];
    if (a.tx) for (const t of Object.keys(a.tx.w)) for (const k of Object.keys(a.tx.w[t])) writeRow(s, a.tx.svc, t, k, a.tx.w[t][k]);
    a.tx = null;
    releaseLocks(s, ctx, i);
  }
  function rollbackTx(s, ctx, i) {
    s.actors[i].tx = null;
    releaseLocks(s, ctx, i);
  }

  // 다음 명령이 쥐어야 하는 잠금. 값을 아직 못 정하면(읽기 전 등) null: 실행할 때 흐름 오류가 난다.
  function lockNeeds(s, i, ctx, ins) {
    const a = s.actors[i];
    if (!ins) return null;
    const pv = (tok) => val(tok, a, s, ctx, true);
    try {
      switch (ins.t) {
        case 'read':
          if (ins.lock !== 'update' || ins.src === 'replica') return null;
          return [rowLock(svcOfTable(ctx.P, ins.table), ins.table, pv(ins.key))];
        case 'update':
        case 'delete':
          return [rowLock(svcOfTable(ctx.P, ins.table), ins.table, pv(ins.key))];
        case 'insert': {
          const svc = svcOfTable(ctx.P, ins.table);
          const out = [];
          try {
            out.push(rowLock(svc, ins.table, pv(ins.key)));
          } catch (e) {
            if (!(e instanceof Fresh)) throw e;
          }
          for (const f of tableSpec(ctx.P, ins.table).unique || []) {
            try {
              const v = pv((ins.values || {})[f]);
              if (v != null) out.push(uniqLock(svc, ins.table, f, v));
            } catch (e) {
              if (!(e instanceof Fresh)) throw e;
            }
          }
          return out;
        }
        default:
          return null;
      }
    } catch (e) {
      if (e instanceof FlowErr || e instanceof Fresh) return null;
      throw e;
    }
  }
  function waitTarget(s, ctx, j) {
    const a = s.actors[j];
    if (a.st !== 'run' || a.kind === 'repl' || a.kind === 'clock') return -1;
    const need = lockNeeds(s, j, ctx, ctx.code[a.flow][a.pc]);
    if (!need) return -1;
    for (const k of need) {
      const h = s.locks[k];
      if (h != null && h !== j) return h;
    }
    return -1;
  }
  function deadlocked(s, ctx, i, h) {
    const seen = new Set();
    let x = h;
    while (x >= 0) {
      if (x === i) return true;
      if (seen.has(x)) return false;
      seen.add(x);
      x = waitTarget(s, ctx, x);
    }
    return false;
  }

  // ---------- 상태 ----------
  function flowSpecs(level) {
    const out = {};
    for (const f of level.flows) out[f.id] = f;
    return out;
  }
  function newActor(o) {
    return Object.assign({ pc: 0, st: 'run', tx: null, reg: {}, cnt: {}, creg: {}, xreg: {}, resp: null, respV: null, msg: null, params: {}, t: 0, c: 0 }, o);
  }
  function initState(P, level, test, ctx) {
    const W = P.world;
    const db = {};
    for (const svc of services(P)) db[svc] = {};
    for (const t of Object.keys(W.tables || {})) {
      const svc = W.tables[t].service || MAIN;
      db[svc][t] = clone((test.rows && test.rows[t]) || (W.rows && W.rows[t]) || {});
    }
    let rep = null;
    for (const svc of services(P)) {
      if (!replicated(P, svc)) continue;
      rep = rep || {};
      rep[svc] = clone((test.rep && test.rep[svc]) || db[svc]);
    }
    const ext = {};
    for (const e of Object.keys(W.exts || {})) ext[e] = clone((test.ext && test.ext[e]) || W.exts[e].init || {});
    const cache = {};
    for (const c of Object.keys(W.caches || {})) cache[c] = clone((test.cache && test.cache[c]) || W.caches[c].init || {});
    const topics = {};
    let mseq = 0;
    for (const name of Object.keys(W.topics || {})) {
      const T = W.topics[name];
      const parts = [];
      for (let p = 0; p < (T.partitions || 1); p++) parts.push([]);
      for (const m of (test.msgs && test.msgs[name]) || []) {
        mseq += 1;
        parts[m.part || 0].push({ id: `m${mseq}`, payload: clone(m.payload), pre: true });
      }
      topics[name] = { parts, committed: parts.map(() => 0) };
    }

    const FS = flowSpecs(level);
    const reqFlow = level.flows.find((f) => f.kind === 'req');
    const actors = (test.actors || []).map((x) => {
      const o = typeof x === 'string' ? { name: x } : x;
      return newActor({ name: o.name, user: o.user === undefined ? o.name : o.user, kind: 'req', flow: o.flow || (reqFlow && reqFlow.id), params: clone(o.params || {}), after: o.after || null, st: o.after ? 'wait' : 'run' });
    });
    for (const f of level.flows) {
      if (f.kind === 'bg') {
        if (test.noBg === true || (Array.isArray(test.noBg) && test.noBg.includes(f.id))) continue;
        const after = (f.schedule || 'after') !== 'concurrent';
        const n = (test.instances && test.instances[f.id]) || f.instances || 1;
        for (let k = 0; k < n; k++) {
          const name = n > 1 ? `${f.actor || f.id}${k + 1}` : f.actor || f.id;
          actors.push(newActor({ name, inst: n > 1 ? k + 1 : null, user: null, kind: 'bg', flow: f.id, st: after ? 'wait' : 'run', phase: after ? null : 'pre', run: 0, keys: null, iter: 0, cur: null }));
        }
      } else if (f.kind === 'consumer') {
        if (test.noConsumers) continue;
        const T = topicSpec(P, f.topic);
        const n = T.partitions || 1;
        for (let p = 0; p < n; p++) {
          actors.push(newActor({ name: n > 1 ? `${f.actor || 'C'}${p}` : f.actor || 'C', user: null, kind: 'consumer', flow: f.id, topic: f.topic, part: p, pos: 0, st: 'idle' }));
        }
      }
    }
    if (rep) actors.push(newActor({ name: '복제', user: null, kind: 'repl', flow: null, st: 'run' }));
    if (test.clock && test.clock.length) actors.push(newActor({ name: '시간', user: null, kind: 'clock', flow: null, st: 'run', ev: 0 }));

    const s = { db, rep, replog: [], locks: {}, ext, cache, topics, seq: 0, mseq, budget: test.budget || 0, actors, err: null, stat: {} };
    for (const a of actors) if (a.kind === 'bg' && a.st === 'run') startRound(s, { P, flowSpecs: FS }, a);
    return s;
  }

  function stat(s, ctx, key) {
    if (!ctx.P.world.stats) return;
    s.stat[key] = (s.stat[key] || 0) + 1;
  }
  function count(ctx, a, key) {
    if (!ctx.lat) return;
    a.n = a.n || {};
    a.n[key] = (a.n[key] || 0) + 1;
  }

  function label(ctx, a) {
    if (a.kind === 'bg') {
      const fs = ctx.flowSpecs[a.flow];
      const short = `${fs.short || fs.label}${a.inst ? ` ${a.inst}` : ''}`;
      if (a.phase === 'pre') return `${short} (요청 처리 중)`;
      return a.run ? `${short} ${a.run}회차` : `${short} (이어서)`;
    }
    return a.name;
  }

  function startRound(s, ctx, a) {
    const fs = ctx.flowSpecs[a.flow];
    a.pc = 0;
    a.tx = null;
    a.reg = {};
    a.cnt = {};
    a.creg = {};
    a.xreg = {};
    a.iter = 0;
    if (fs.each) {
      const svc = svcOfTable(ctx.P, fs.each);
      a.keys = Object.keys(s.db[svc][fs.each] || {}).sort();
      a.cur = a.keys.length ? a.keys[0] : null;
    } else {
      a.keys = null;
      a.cur = null;
    }
  }
  const roundsOf = (ctx, a) => {
    const o = ctx.test && ctx.test.rounds && ctx.test.rounds[a.flow];
    return o !== undefined ? o : ctx.flowSpecs[a.flow].rounds || RUNS;
  };
  function roundEnd(s, ctx, a) {
    const fs = ctx.flowSpecs[a.flow];
    // 요청이 도는 동안의 회차도 상한을 둔다(상태가 끝없이 늘지 않게). 다 돌면 요청이 끝날 때까지 쉰다.
    if (a.phase === 'pre') {
      a.pre = (a.pre || 0) + 1;
      if (a.pre >= (fs.preRounds || roundsOf(ctx, a))) {
        a.st = 'wait';
        a.phase = 'hold';
        a.tx = null;
        a.reg = {};
        a.cur = null;
        a.keys = null;
        return;
      }
      return startRound(s, ctx, a);
    }
    if (a.run >= roundsOf(ctx, a)) {
      a.st = 'done';
      a.tx = null;
      a.reg = {};
      a.cur = null;
      a.keys = null;
      return;
    }
    a.run += 1;
    startRound(s, ctx, a);
  }
  function endRun(s, ctx, i) {
    const a = s.actors[i];
    a.tx = null;
    a.reg = {};
    a.cnt = {};
    a.creg = {};
    a.xreg = {};
    if (a.kind === 'consumer') {
      a.msg = null;
      a.pos += 1;
      a.pc = 0;
      a.st = 'idle';
      return;
    }
    if (a.keys && a.iter + 1 < a.keys.length) {
      a.iter += 1;
      a.cur = a.keys[a.iter];
      a.pc = 0;
      return;
    }
    roundEnd(s, ctx, a);
  }

  const finished = (a) => a.st === 'done' || a.st === 'crash';
  function settle(s, ctx) {
    for (const a of s.actors) {
      if (a.kind === 'req' && a.st === 'wait' && a.after) {
        const t = s.actors.find((x) => x.name === a.after);
        if (!t || finished(t)) a.st = 'run';
      }
    }
    const reqDone = s.actors.every((a) => a.kind !== 'req' || finished(a));
    // schedule 'last': 요청이 끝나고 소비자가 받은 메시지를 다 처리한 뒤에 돈다.
    const consCaught = s.actors.every((a) => a.kind !== 'consumer' || finished(a) || (a.st === 'idle' && a.pos >= s.topics[a.topic].parts[a.part].length));
    const clockDone = s.actors.every((a) => a.kind !== 'clock' || finished(a));
    if (reqDone) {
      for (const a of s.actors) {
        if (a.kind !== 'bg') continue;
        const fs = ctx.flowSpecs[a.flow];
        if (fs.afterClock && !clockDone) continue;
        if (a.st === 'wait' && fs.schedule === 'last' && !consCaught) continue;
        if (a.st === 'wait') {
          a.st = 'run';
          a.phase = 'post';
          a.run = 1;
          startRound(s, ctx, a);
        } else if (a.phase === 'pre') {
          // 요청이 끝날 때 돌던 회차는 "이어서"로 마치고, 그 뒤에 rounds회차를 더 돈다.
          a.phase = 'post';
          a.run = 0;
        }
      }
    }
    const producersDone = s.actors.every((a) => a.kind === 'consumer' || a.kind === 'repl' || finished(a));
    if (producersDone) {
      const cons = s.actors.filter((a) => a.kind === 'consumer');
      const allCaught = cons.every((a) => finished(a) || (a.st === 'idle' && a.pos >= s.topics[a.topic].parts[a.part].length));
      if (allCaught) for (const a of cons) a.st = 'done';
      const repl = s.actors.find((a) => a.kind === 'repl');
      if (repl && allCaught && !s.replog.length && s.actors.every((a) => a.kind === 'repl' || finished(a))) repl.st = 'done';
    }
  }

  // ---------- 한 걸음 ----------
  function spend(ctx, a, key, conn) {
    if (!ctx.lat) return 0;
    const ms = typeof key === 'number' ? key : ctx.lat[key] || 0;
    a.t += ms;
    if (conn) a.c += ms;
    return ms;
  }
  function abort(s, ctx, i, ev) {
    const a = s.actors[i];
    if (a.tx) {
      spend(ctx, a, 'rollback', true);
      rollbackTx(s, ctx, i);
      ev.text += ' (롤백)';
    }
    if (a.kind === 'req') {
      a.resp = 'fail';
      a.respClock = (s.clockLog || []).length;
      a.st = 'done';
      ev.text += ' → 실패 응답';
    } else {
      ev.text += a.kind === 'consumer' ? ' → 이 메시지 처리 끝' : ' → 이 행 처리 끝';
      endRun(s, ctx, i);
    }
  }
  function flowError(s, ctx, i, msg, ev) {
    s.err = `${label(ctx, s.actors[i])}: ${msg}`;
    ev.text = `흐름 오류: ${msg}`;
    ev.error = true;
  }
  function condText(ctx, ins) {
    return `${tokText(ctx.P, ctx.level, ins.a)} ${OP_TEXT[ins.op] || '?'}${UNARY[ins.op] ? '' : ` ${tokText(ctx.P, ctx.level, ins.b)}`}`;
  }

  function step(s0, i, ctx) {
    const a0 = s0.actors[i];
    if (a0.kind === 'repl') return replStep(s0, i, ctx);
    if (a0.kind === 'clock') return clockStep(s0, i, ctx);
    if (a0.kind === 'consumer' && a0.st === 'idle') return fetchStep(s0, i, ctx);
    if (a0.kind === 'bg' && a0.keys && a0.cur == null) return emptyRound(s0, i, ctx);
    const code = ctx.code[a0.flow];
    const ins = code[a0.pc];
    const need = lockNeeds(s0, i, ctx, ins);
    if (need) {
      let holder = -1;
      for (const k of need) {
        const h = s0.locks[k];
        if (h != null && h !== i) {
          holder = h;
          break;
        }
      }
      if (holder >= 0) {
        if (!deadlocked(s0, ctx, i, holder)) return null; // 잠금 대기
        return [deadlockStep(s0, i, ctx, ins)];
      }
    }
    if (ins.t === 'call') return callStep(s0, i, ctx, ins);
    if (ins.t === 'publish') return publishStep(s0, i, ctx, ins);

    const s = clone(s0);
    const a = s.actors[i];
    const ev = { who: label(ctx, a), id: ins.id, text: '', ms: 0, conn: false, bg: a.kind === 'bg' };
    try {
      exec(s, i, ctx, ins, ev);
    } catch (e) {
      if (!(e instanceof FlowErr)) throw e;
      flowError(s, ctx, i, e.message, ev);
    }
    if (a.st === 'run' && !s.err) a.pc = skipJmp(code, a.pc);
    settle(s, ctx);
    return [{ s, ev }];
  }

  function exec(s, i, ctx, ins, ev) {
    const P = ctx.P;
    const a = s.actors[i];
    const fs = ctx.flowSpecs[a.flow];
    const svc = fs.service || MAIN;
    const txBefore = !!a.tx;
    const go = (br) => {
      a.pc = ins.targets[br];
    };
    const useTable = (t) => {
      if (svcOfTable(P, t) !== svc) throw new FlowErr(`${tLabel(P, t)} 테이블은 다른 서비스의 DB라서 이 흐름에서 직접 다룰 수 없다`);
    };
    const v = (tok) => val(tok, a, s, ctx);

    switch (ins.t) {
      case 'begin':
        if (a.tx) throw new FlowErr('이미 열린 트랜잭션 안에서 다시 트랜잭션을 시작했다');
        a.tx = { svc, w: {}, snap: null };
        ev.text = '트랜잭션 시작';
        ev.ms = spend(ctx, a, 'begin', true);
        ev.conn = true;
        a.pc++;
        return;
      case 'commit':
        if (!a.tx) throw new FlowErr('열린 트랜잭션이 없는데 커밋했다');
        ev.ms = spend(ctx, a, 'commit', true);
        commitTx(s, ctx, i);
        ev.text = '커밋';
        ev.conn = true;
        a.pc++;
        return;
      case 'read': {
        const t = ins.table;
        useTable(t);
        const k = v(ins.key);
        const kl = `${tLabel(P, t)} ${k}`;
        let row;
        if (ins.src === 'replica') {
          if (!s.rep || !s.rep[svc]) throw new FlowErr('이 서비스에는 복제본이 없다');
          const tb = s.rep[svc][t] || {};
          row = tb[k] === undefined ? null : tb[k];
          ev.text = `${kl} 읽기 (복제본)`;
          ev.ms = spend(ctx, a, 'replica', false);
          stat(s, ctx, `read:rep:${t}`);
        } else {
          if (!ins.lock) throw new FlowErr('일반 읽기인지 FOR UPDATE인지 고르지 않았다');
          if (ins.lock === 'update') {
            if (a.tx) {
              takeLock(s, ctx, i, rowLock(svc, t, k));
              ev.text = `${kl} 읽기 FOR UPDATE (잠금 획득)`;
            } else ev.text = `${kl} 읽기 FOR UPDATE (트랜잭션 밖이라 문장이 끝나면 잠금 해제)`;
            row = latest(s, a, svc, t, k);
            if (!a.tx) stmtLock(ctx, a, svc, t, k, (ctx.lat && ctx.lat.db) || 0);
          } else if (a.tx) {
            row = snapshot(s, a, svc, t, k);
            ev.text = `${kl} 읽기 (일반, 트랜잭션 스냅샷)`;
          } else {
            row = latest(s, a, svc, t, k);
            ev.text = `${kl} 읽기 (일반)`;
          }
          ev.ms = spend(ctx, a, 'db', true);
          ev.conn = true;
          stat(s, ctx, `read:${t}`);
          count(ctx, a, 'db');
        }
        a.reg[t] = row == null ? null : Object.assign({ $key: k }, clone(row));
        ev.text += ` → ${fmtRow(P, t, row)}`;
        a.pc++;
        return;
      }
      case 'count': {
        const t = ins.table;
        useTable(t);
        const rows = visibleRows(s, a, svc, t, !!a.tx);
        const n = Object.keys(rows).filter((k) => matches(rows[k], ins.where, a, s, ctx)).length;
        a.cnt[t] = n;
        ev.text = `${ins.label || `${tLabel(P, t)} 개수 세기`}${a.tx ? ' (트랜잭션 스냅샷)' : ''} → ${n}`;
        ev.ms = spend(ctx, a, 'db', true);
        ev.conn = true;
        stat(s, ctx, `count:${t}`);
        count(ctx, a, 'db');
        a.pc++;
        return;
      }
      case 'check':
      case 'if': {
        const x = v(ins.a);
        const y = UNARY[ins.op] ? null : v(ins.b);
        const pass = cmp(x, ins.op, y);
        ev.conn = txBefore;
        const lit = typeof ins.b !== 'string' || ins.b[0] !== '$';
        const seen = UNARY[ins.op] || lit ? `읽은 값 ${fmtVal(x)}` : `${fmtVal(x)} 대 ${fmtVal(y)}`;
        if (ins.t === 'check') {
          ev.text = `확인: ${condText(ctx, ins)} → ${pass ? '통과' : `불일치 (${seen})`}`;
          if (pass) a.pc++;
          else abort(s, ctx, i, ev);
        } else {
          ev.text = `조건: ${condText(ctx, ins)} → ${pass ? '맞음' : `아님 (${seen})`}`;
          go(pass ? 'yes' : 'no');
        }
        return;
      }
      case 'update':
      case 'delete': {
        const t = ins.table;
        useTable(t);
        const k = v(ins.key);
        const kl = `${tLabel(P, t)} ${k}`;
        const cur = latest(s, a, svc, t, k);
        const ok = cur != null && matches(cur, ins.where, a, s, ctx);
        stat(s, ctx, `write:${t}`);
        if (ok && a.tx) takeLock(s, ctx, i, rowLock(svc, t, k));
        ev.ms = spend(ctx, a, 'db', true);
        ev.conn = true;
        count(ctx, a, 'db');
        const what = ins.t === 'update' ? '변경' : '삭제';
        if (!ok) {
          ev.text = `${kl} ${what}: ${cur == null ? '행이 없어' : '조건 불일치로'} 0건${cur == null ? '' : ` (현재 ${fmtRow(P, t, cur)})`}`;
          go('zero');
          return;
        }
        const nv = ins.t === 'update' ? applySet(cur, ins.set, a, s, ctx) : null;
        const shown = ins.t === 'update' ? ` → ${fmtRow(P, t, nv)}` : '';
        if (a.tx) {
          a.tx.w[t] = a.tx.w[t] || {};
          a.tx.w[t][k] = nv;
          ev.text = `${kl} ${what}${shown} (커밋 전)`;
        } else {
          writeRow(s, svc, t, k, nv);
          stmtLock(ctx, a, svc, t, k, ev.ms);
          ev.text = `${kl} ${what}${shown} (바로 커밋)`;
        }
        go('ok');
        return;
      }
      case 'insert': {
        const t = ins.table;
        useTable(t);
        const spec = tableSpec(P, t);
        const k = v(ins.key);
        const row = {};
        for (const f of Object.keys(spec.fields || {})) row[f] = null;
        for (const f of Object.keys(ins.values || {})) row[f] = v(ins.values[f]);
        const vis = visibleRows(s, a, svc, t, false);
        let dup = vis[k] != null ? '같은 키' : null;
        if (!dup) {
          for (const f of spec.unique || []) {
            if (row[f] == null) continue;
            if (Object.keys(vis).some((kk) => kk !== k && vis[kk] != null && same(vis[kk][f], row[f]))) {
              dup = `같은 ${(spec.fields && spec.fields[f] && spec.fields[f].label) || f}`;
              break;
            }
          }
        }
        stat(s, ctx, `write:${t}`);
        if (!dup && a.tx) {
          takeLock(s, ctx, i, rowLock(svc, t, k));
          for (const f of spec.unique || []) if (row[f] != null) takeLock(s, ctx, i, uniqLock(svc, t, f, row[f]));
        }
        ev.ms = spend(ctx, a, 'db', true);
        ev.conn = true;
        count(ctx, a, 'db');
        const kl = `${tLabel(P, t)} ${k}`;
        if (dup) {
          ev.text = `${kl} 넣기 → 중복 (${dup}가 이미 있다)`;
          go('dup');
          return;
        }
        if (a.tx) {
          a.tx.w[t] = a.tx.w[t] || {};
          a.tx.w[t][k] = row;
          ev.text = `${kl} 넣기 → ${fmtRow(P, t, row)} (커밋 전)`;
        } else {
          writeRow(s, svc, t, k, row);
          stmtLock(ctx, a, svc, t, k, ev.ms);
          ev.text = `${kl} 넣기 → ${fmtRow(P, t, row)} (바로 커밋)`;
        }
        go('ok');
        return;
      }
      case 'respond': {
        if (a.kind !== 'req') throw new FlowErr('요청 흐름에서만 응답할 수 있다');
        if (!ins.kind) throw new FlowErr('응답 종류를 고르지 않았다');
        const name = (ctx.P.respondLabels && ctx.P.respondLabels[ins.kind]) || { ok: '성공 응답', fail: '실패 응답', pending: '처리 중 응답' }[ins.kind] || `${ins.kind} 응답`;
        const rv = ins.v === undefined ? null : v(ins.v);
        const vt = ins.v === undefined ? '' : ` (${ins.vLabel || '값'}: ${fmtVal(rv)})`;
        if (ins.kind === 'fail') {
          if (a.tx) {
            ev.ms = spend(ctx, a, 'rollback', true);
            rollbackTx(s, ctx, i);
            ev.conn = true;
            ev.text = `${name}${vt} (열린 트랜잭션 롤백)`;
          } else ev.text = `${name}${vt}`;
        } else if (a.tx) {
          ev.ms = spend(ctx, a, 'commit', true);
          commitTx(s, ctx, i);
          ev.conn = true;
          ev.text = `${name}${vt} (열린 트랜잭션을 이때 커밋)`;
        } else ev.text = `${name}${vt}`;
        a.resp = ins.kind;
        a.respV = rv;
        a.respClock = (s.clockLog || []).length;
        a.st = 'done';
        return;
      }
      case 'ack': {
        if (a.kind !== 'consumer') throw new FlowErr('소비 흐름에서만 소비 확인을 할 수 있다');
        const T = s.topics[a.topic];
        T.committed[a.part] = Math.max(T.committed[a.part], a.pos + 1);
        ev.text = `소비 확인 (${a.msg.id}까지 오프셋 커밋)`;
        ev.ms = spend(ctx, a, 'ack', false);
        ev.conn = txBefore;
        a.pc++;
        return;
      }
      case 'cget': {
        const C = cacheSpec(P, ins.cache);
        const k = v(ins.key);
        const cur = s.cache[ins.cache][k];
        a.creg[ins.cache] = cur === undefined ? null : clone(cur);
        ev.text = `${C.label} ${k} 읽기 → ${cur === undefined ? '없음' : fmtVal(cur)}`;
        ev.ms = spend(ctx, a, 'cache', txBefore);
        count(ctx, a, 'cache');
        ev.conn = txBefore;
        stat(s, ctx, `cache:${ins.cache}`);
        go(cur === undefined ? 'miss' : 'hit');
        return;
      }
      case 'cset': {
        const C = cacheSpec(P, ins.cache);
        const k = v(ins.key);
        const nv = v(ins.v);
        const cur = s.cache[ins.cache][k];
        let ok = true;
        if (ins.cond === 'absent') ok = cur === undefined;
        else if (ins.cond === 'newer') {
          const vf = C.ver || 'ver';
          ok = cur === undefined || (nv != null && cur != null && nv[vf] != null && cur[vf] != null && nv[vf] > cur[vf]);
        }
        if (ok) s.cache[ins.cache][k] = nv;
        const how = { absent: ' (없을 때만)', newer: ' (버전이 더 클 때만)' }[ins.cond] || '';
        ev.text = `${C.label} ${k} 쓰기${how} ← ${fmtVal(nv)}${ok ? '' : ' → 안 쓰임'}`;
        ev.ms = spend(ctx, a, 'cache', txBefore);
        count(ctx, a, 'cache');
        ev.conn = txBefore;
        if (ins.targets) go(ok ? 'ok' : 'rejected');
        else a.pc++;
        return;
      }
      case 'cincr': {
        const C = cacheSpec(P, ins.cache);
        const k = v(ins.key);
        const by = ins.by === undefined ? 1 : v(ins.by);
        const cur = s.cache[ins.cache][k];
        const nv = (typeof cur === 'number' ? cur : 0) + by;
        s.cache[ins.cache][k] = nv;
        a.creg[ins.cache] = nv;
        ev.text = `${C.label} ${k} ${by >= 0 ? `${by} 증가` : `${-by} 감소`} → ${nv}`;
        ev.ms = spend(ctx, a, 'cache', txBefore);
        count(ctx, a, 'cache');
        ev.conn = txBefore;
        stat(s, ctx, `cache:${ins.cache}`);
        a.pc++;
        return;
      }
      case 'cdel': {
        const C = cacheSpec(P, ins.cache);
        const k = v(ins.key);
        delete s.cache[ins.cache][k];
        ev.text = `${C.label} ${k} 삭제`;
        ev.ms = spend(ctx, a, 'cache', txBefore);
        count(ctx, a, 'cache');
        ev.conn = txBefore;
        a.pc++;
        return;
      }
      case 'stop':
      case 'end': {
        if (a.kind === 'req') throw new FlowErr('응답 없이 흐름이 끝났다');
        const what = a.kind === 'consumer' ? '이 메시지 처리 끝' : a.keys ? '이 행 처리 끝' : '이번 회차 끝';
        if (a.tx) {
          ev.ms = spend(ctx, a, 'commit', true);
          commitTx(s, ctx, i);
          ev.conn = true;
          ev.text = `${what} (열린 트랜잭션 커밋)`;
        } else ev.text = what;
        endRun(s, ctx, i);
        return;
      }
      default:
        throw new FlowErr(`알 수 없는 블록 ${ins.t}`);
    }
  }

  function deadlockStep(s0, i, ctx, ins) {
    const s = clone(s0);
    const a = s.actors[i];
    const ev = { who: label(ctx, a), id: ins.id, text: '데드락: 서로의 잠금을 기다려서 이 트랜잭션이 희생됐다', deadlock: true, bg: a.kind === 'bg' };
    abort(s, ctx, i, ev);
    settle(s, ctx);
    return { s, ev };
  }

  function faultList(ctx, keys) {
    for (const k of keys) if (ctx.faults[k]) return ctx.faults[k];
    return [];
  }

  function callStep(s0, i, ctx, ins) {
    const P = ctx.P;
    const code = ctx.code[s0.actors[i].flow];
    let spec;
    try {
      spec = extOp(P, ins.ext, ins.op);
    } catch (e) {
      const s = clone(s0);
      const ev = { who: label(ctx, s.actors[i]), id: ins.id, text: '' };
      flowError(s, ctx, i, e.message, ev);
      return [{ s, ev }];
    }
    const E = P.world.exts[ins.ext];
    const outs = [null];
    if (s0.budget > 0) for (const f of faultList(ctx, [`${ins.ext}.${ins.op}`, ins.op, `${ins.ext}.*`])) outs.push(f);
    return outs.map((fault) => {
      const s = clone(s0);
      const a = s.actors[i];
      const ev = { who: label(ctx, a), id: ins.id, text: '', ms: 0, conn: !!a.tx, fault: fault != null, bg: a.kind === 'bg' };
      try {
        if (ins.key === undefined) throw new FlowErr(`${E.keyLabel || '요청 번호'} 방식을 고르지 않았다`);
        const key = val(ins.key, a, s, ctx);
        if (fault != null) s.budget -= 1;
        const r = spec.run({ st: s.ext[ins.ext], key, a, fault, val: (t) => val(t, a, s, ctx) });
        const bl = (spec.outcomes.find((o) => o[0] === r.vis) || [null, r.vis])[1];
        ev.text = `${E.label} ${spec.label} (${E.keyLabel || '요청 번호'} ${key}) → ${(spec.visLabels && spec.visLabels[r.vis]) || bl}${r.note ? ` (${r.note})` : ''}`;
        ev.ms = spend(ctx, a, ctx.lat && ctx.lat[`${ins.ext}.${ins.op}`] != null ? `${ins.ext}.${ins.op}` : ins.op, !!a.tx);
        count(ctx, a, `${ins.ext}.${ins.op}`);
        stat(s, ctx, `call:${ins.ext}.${ins.op}`);
        if (r.value !== undefined) {
          a.xreg = a.xreg || {};
          a.xreg[ins.ext] = clone(r.value);
        }
        if (!(r.vis in ins.targets)) throw new FlowErr(`외부 결과 ${r.vis}에 해당하는 갈래가 없다`);
        a.pc = skipJmp(code, ins.targets[r.vis]);
      } catch (e) {
        if (!(e instanceof FlowErr)) throw e;
        flowError(s, ctx, i, e.message, ev);
      }
      settle(s, ctx);
      return { s, ev };
    });
  }

  function partOf(T, kv) {
    if (T.partitionOf) return T.partitionOf(kv);
    let h = 0;
    for (const ch of String(kv)) h = (h * 31 + ch.charCodeAt(0)) % 9973;
    return h % (T.partitions || 1);
  }

  function publishStep(s0, i, ctx, ins) {
    const P = ctx.P;
    const code = ctx.code[s0.actors[i].flow];
    const out = [];
    let T;
    try {
      T = topicSpec(P, ins.topic);
    } catch (e) {
      const s = clone(s0);
      const ev = { who: label(ctx, s.actors[i]), id: ins.id, text: '' };
      flowError(s, ctx, i, e.message, ev);
      return [{ s, ev }];
    }
    const n = T.partitions || 1;
    const outs = [null];
    if (s0.budget > 0) for (const f of faultList(ctx, [`publish:${ins.topic}`, 'publish'])) outs.push(f);
    for (const fault of outs) {
      const base = clone(s0);
      const a0 = base.actors[i];
      let payload;
      let parts;
      try {
        payload = {};
        for (const f of Object.keys(ins.payload || {})) payload[f] = val(ins.payload[f], a0, base, ctx);
        parts = ins.pkey ? [partOf(T, payload[ins.pkey])] : [...Array(n).keys()];
      } catch (e) {
        if (!(e instanceof FlowErr)) throw e;
        const ev = { who: label(ctx, a0), id: ins.id, text: '' };
        flowError(base, ctx, i, e.message, ev);
        out.push({ s: base, ev });
        continue;
      }
      const written = fault == null || fault === 'timeout_applied';
      const vis = fault == null ? 'ok' : fault === 'fail' ? 'fail' : 'timeout';
      for (const p of written ? parts : [null]) {
        const s = clone(base);
        const a = s.actors[i];
        if (fault != null) s.budget -= 1;
        let id = null;
        if (p != null) {
          s.mseq += 1;
          id = `m${s.mseq}`;
          s.topics[ins.topic].parts[p].push({ id, payload: clone(payload) });
        }
        const where = id ? ` ${id}${n > 1 ? ` → 파티션 ${p}` : ''}` : '';
        const note = vis === 'timeout' ? (written ? ' (실제로는 써짐)' : ' (실제로는 안 써짐)') : vis === 'fail' ? ' (안 써짐)' : '';
        const ev = {
          who: label(ctx, a),
          id: ins.id,
          text: `${T.label} 발행${where} (${fmtVal(payload)}) → ${{ ok: '성공', fail: '실패', timeout: '타임아웃' }[vis]}${note}`,
          ms: 0,
          conn: !!a.tx,
          fault: fault != null,
          bg: a.kind === 'bg',
        };
        ev.ms = spend(ctx, a, 'publish', !!a.tx);
        count(ctx, a, 'publish');
        a.pc = skipJmp(code, ins.targets[vis]);
        settle(s, ctx);
        out.push({ s, ev });
      }
    }
    return out;
  }

  function fetchStep(s0, i, ctx) {
    const a0 = s0.actors[i];
    const part = s0.topics[a0.topic].parts[a0.part];
    if (a0.pos >= part.length) return null;
    const s = clone(s0);
    const a = s.actors[i];
    const T = ctx.P.world.topics[a.topic];
    a.msg = clone(part[a.pos]);
    a.st = 'run';
    a.pc = 0;
    a.reg = {};
    a.cnt = {};
    a.creg = {};
    a.xreg = {};
    const ev = { who: label(ctx, a), text: `${T.label}${(T.partitions || 1) > 1 ? ` 파티션 ${a.part}` : ''} 메시지 ${a.msg.id} 받음 (${fmtVal(a.msg.payload)})` };
    ev.ms = spend(ctx, a, 'fetch', false);
    a.pc = skipJmp(ctx.code[a.flow], 0);
    settle(s, ctx);
    return [{ s, ev }];
  }

  function emptyRound(s0, i, ctx) {
    const s = clone(s0);
    const a = s.actors[i];
    const ev = { who: label(ctx, a), text: '처리할 행이 없다', bg: true };
    roundEnd(s, ctx, a);
    settle(s, ctx);
    return [{ s, ev }];
  }

  // 시간: 테스트가 정한 사건(시각이 지남, 키 만료 등)을 아무 때나 한 번씩 순서대로 일으킨다. 장애가 아니다.
  function clockStep(s0, i, ctx) {
    const evs = ctx.test.clock || [];
    const a0 = s0.actors[i];
    if (a0.ev >= evs.length) return null;
    const e0 = evs[a0.ev];
    if (e0.after) {
      const t = s0.actors.find((x) => x.name === e0.after);
      if (t && !finished(t)) return null;
    }
    const s = clone(s0);
    const a = s.actors[i];
    const e = evs[a.ev];
    s.clockLog = (s.clockLog || []).concat([e.label || a.ev]);
    if (e.table) {
      const svc = svcOfTable(ctx.P, e.table);
      const cur = committedRow(s, svc, e.table, e.key);
      writeRow(s, svc, e.table, e.key, e.set === null ? null : Object.assign({}, cur || {}, e.set));
    }
    if (e.cache) {
      if (e.v === undefined) delete s.cache[e.cache][e.key];
      else s.cache[e.cache][e.key] = clone(e.v);
    }
    a.ev += 1;
    if (a.ev >= evs.length) a.st = 'done';
    const ev = { who: '시간', text: e.label || '시간이 지남' };
    settle(s, ctx);
    return [{ s, ev }];
  }

  function replStep(s0, i, ctx) {
    if (!s0.replog.length) return null;
    const s = clone(s0);
    const e = s.replog.shift();
    s.rep[e.svc][e.t] = s.rep[e.svc][e.t] || {};
    if (e.row === null) delete s.rep[e.svc][e.t][e.k];
    else s.rep[e.svc][e.t][e.k] = e.row;
    const ev = { who: '복제', text: `복제본에 반영: ${tLabel(ctx.P, e.t)} ${e.k} → ${fmtRow(ctx.P, e.t, e.row)}` };
    settle(s, ctx);
    return [{ s, ev }];
  }

  function crash(s0, i, ctx) {
    const s = clone(s0);
    const a = s.actors[i];
    const ev = { who: label(ctx, a), text: '', fault: true, crash: true, bg: a.kind === 'bg' };
    const hadTx = !!a.tx;
    rollbackTx(s, ctx, i);
    s.budget -= 1;
    const rb = hadTx ? ', 열린 트랜잭션 롤백' : '';
    if (a.kind === 'req') {
      a.st = 'crash';
      ev.text = `서버 다운: 응답 없음${rb}`;
    } else if (a.kind === 'bg') {
      const fs = ctx.flowSpecs[a.flow];
      ev.text = `${fs.short || fs.label} 다운${rb}: 다음 회차에 다시`;
      a.reg = {};
      roundEnd(s, ctx, a);
    } else {
      const T = s.topics[a.topic];
      ev.text = `소비자 다운${rb}: 커밋한 오프셋부터 다시 받는다`;
      a.pos = T.committed[a.part];
      a.st = 'idle';
      a.msg = null;
      a.reg = {};
      a.cnt = {};
      a.creg = {};
    a.xreg = {};
      a.pc = 0;
    }
    settle(s, ctx);
    return { s, ev };
  }

  // 정상 걸음을 장애보다 먼저 넣는다. 길이가 같은 반례라면 장애가 적은 쪽이 먼저 나오는 경향이 생긴다.
  function successors(s, ctx) {
    const steps = [];
    const faults = [];
    s.actors.forEach((a, i) => {
      const live = a.st === 'run' || (a.kind === 'consumer' && a.st === 'idle');
      if (!live) return;
      const r = step(s, i, ctx);
      if (r) for (const x of r) (x.ev.fault ? faults : steps).push(x);
      if (a.st === 'run' && a.kind !== 'repl' && a.kind !== 'clock' && s.budget > 0 && ctx.crash.has(a.name)) faults.push(crash(s, i, ctx));
    });
    return steps.concat(faults);
  }

  const isTerminal = (s) => !!s.err || s.actors.every(finished);

  function finalView(s, ctx) {
    const P = ctx.P;
    const init = initState(P, ctx.level, ctx.test, ctx);
    const rowsOf = (db, t) => (db[svcOfTable(P, t)] && db[svcOfTable(P, t)][t]) || {};
    return {
      db: s.db,
      initialDb: init.db,
      rep: s.rep,
      ext: s.ext,
      cache: s.cache,
      topics: s.topics,
      stat: s.stat,
      used: (ctx.test.budget || 0) - s.budget,
      clock: s.clockLog || [],
      test: ctx.test,
      reqs: s.actors.filter((a) => a.kind === 'req').map((a) => ({ name: a.name, user: a.user, flow: a.flow, params: a.params, resp: a.resp, respV: a.respV, respClock: a.respClock || 0, st: a.st })),
      actors: s.actors.map((a) => ({ name: a.name, kind: a.kind, st: a.st })),
      rows: (t) => rowsOf(s.db, t),
      row: (t, k) => {
        const r = rowsOf(s.db, t)[k];
        return r === undefined ? null : r;
      },
      initialRows: (t) => rowsOf(init.db, t),
      initialRow: (t, k) => {
        const r = rowsOf(init.db, t)[k];
        return r === undefined ? null : r;
      },
      msgs: (topic) => {
        const T = s.topics[topic];
        const out = [];
        T.parts.forEach((list, p) => list.forEach((m, k) => out.push(Object.assign({ part: p, committed: k < T.committed[p] }, m))));
        return out;
      },
    };
  }

  // ---------- 상태 표시 ----------
  function fmtWorld(P, s) {
    const out = [];
    if (P.fmtWorld) return P.fmtWorld(s);
    for (const svc of Object.keys(s.db)) {
      for (const t of Object.keys(s.db[svc])) {
        const spec = P.world.tables[t];
        if (spec && spec.hidden) continue;
        const tb = s.db[svc][t];
        for (const k of Object.keys(tb)) out.push([`${tLabel(P, t)} ${k}`, fmtRow(P, t, tb[k])]);
        if (spec && spec.showEmpty && !Object.keys(tb).length) out.push([tLabel(P, t), '비어 있음']);
      }
    }
    if (s.rep) {
      for (const svc of Object.keys(s.rep)) {
        for (const t of Object.keys(s.rep[svc])) {
          const tb = s.rep[svc][t];
          for (const k of Object.keys(tb)) out.push([`${tLabel(P, t)} ${k} (복제본)`, fmtRow(P, t, tb[k])]);
        }
      }
    }
    for (const e of Object.keys(s.ext)) {
      const E = P.world.exts[e];
      out.push([E.label, E.fmt ? E.fmt(s.ext[e]) : fmtVal(s.ext[e]) || '-']);
    }
    for (const c of Object.keys(s.cache)) {
      const C = P.world.caches[c];
      const ks = Object.keys(s.cache[c]);
      if (!ks.length) out.push([C.label, '비어 있음']);
      for (const k of ks) out.push([`${C.label} ${k}`, fmtVal(s.cache[c][k])]);
    }
    for (const name of Object.keys(s.topics)) {
      const T = P.world.topics[name];
      const X = s.topics[name];
      X.parts.forEach((list, p) => {
        const lab = `${T.label}${X.parts.length > 1 ? ` P${p}` : ''}`;
        out.push([lab, list.length ? list.map((m, k) => `${m.id}${k < X.committed[p] ? '✓' : ''}`).join(' ') : '비어 있음']);
      });
    }
    return out;
  }
  function diffWorld(prev, cur) {
    const pm = new Map(prev);
    const cm = new Map(cur);
    const out = [];
    for (const [k, v] of cur) if (pm.get(k) !== v) out.push([k, v]);
    for (const [k, v] of prev) if (!cm.has(k) && v !== '비어 있음') out.push([k, '없음']);
    return out;
  }

  function makeTrace(nodes, qi, ctx) {
    const chain = [];
    for (let k = qi; k !== -1; k = nodes[k].p) chain.push(nodes[k]);
    chain.reverse();
    const rows = [];
    let prev = fmtWorld(ctx.P, chain[0].s);
    for (let k = 1; k < chain.length; k++) {
      const n = chain[k];
      const all = fmtWorld(ctx.P, n.s);
      rows.push(Object.assign({}, n.ev, { chg: diffWorld(prev, all), all }));

  const retryUnknown = (key) => [
    U('SENDING', { status: 'UNKNOWN' }),
    QUERY(key, {
      sent: [SENT()],
      none: [SEND(key, { ok: [SENT()], timeout: [UNKNOWN()] })],
      timeout: [UNKNOWN()],
    }),
    STOP(),
  ];

  // 받은 사람별 받은 횟수(recv)와 대행사가 받은 메시지 번호(ids). 같은 번호로 다시 보내도 거르지 않는다.

        ],
        visLabels: { ok: '접수', timeout: '타임아웃' },
        faults: ['timeout_applied', 'timeout_lost'],

          const deliver = () => {
            st.recv[a.cur] = (st.recv[a.cur] || 0) + 1;
            st.ids[key] = a.cur;
          };

            deliver();
            return { vis: 'ok', note: again ? '같은 번호지만 대행사는 거르지 않고 또 보냄' : undefined };

            deliver();

          }
          return { vis: 'timeout', note: '실제로는 안 보냄' };

  function invariants(f) {
    const out = [];
    const recv = f.ext.agency.recv;
    const rows = f.rows('target');
    const keys = Object.keys(f.initialRows('target')).sort();
    const missed = [];
    for (const k of keys) {
      const r = rows[k];
      const n = recv[k] || 0;
      if (r.agree !== 'Y') {
        if (n > 0) out.push(`수신을 거부한 ${k}에게 메시지가 갔다`);
        continue;
      }
      if (n > 1) out.push(`${k}에게 같은 메시지가 ${n}번 갔다 (중복 발송)`);
      if (r.status === 'SENT' && n === 0) out.push(`${k}의 행은 SENT인데 실제로는 메시지가 가지 않았다`);
      if (n > 0 && r.status === 'READY') out.push(`이미 받은 ${k}의 행이 READY로 남아 다음 실행 때 또 보낼 대상이 됐다`);
      if (n === 0) missed.push(k);
    }
    if (f.used === 0) {
      if (missed.length) out.push(`장애가 없었는데 ${missed.join(', ')}에게 메시지가 가지 않았다`);
      const notDone = keys.filter((k) => rows[k].agree === 'Y' && rows[k].status !== 'SENT' && (recv[k] || 0) > 0);
      if (notDone.length) out.push(`장애가 없었는데 받은 ${notDone.join(', ')}의 행이 SENT가 아니다`);

      out.push(`장애 ${f.used}번에 ${missed.length}명(${missed.join(', ')})에게 메시지가 가지 않았다. 놓쳐도 되는 건 장애가 난 순간 처리 중이던 사람뿐이다`);

    return out;
  }

  // 복구 흐름 블록 ($cur = 처리 중인 충전 기록)
  const R = {
    begin: () => ({ t: 'begin' }),

    mark: (st, from, zero) => ({ t: 'update', table: 'charge', key: '$cur', set: { st }, where: from ? [{ f: 'st', op: 'eq', v: from }] : [], br: { zero: zero || [] } }),
    addMoney: () => ({ t: 'update', table: 'wallet', key: '$r.charge.user', set: { bal: { add: '$r.charge.amt' } }, where: [] }),

      if (prev.params.rid === cur.params.rid && cur.resp !== prev.resp) out.push(`${prev.name}가 ${RESP[prev.resp]} 응답을 받은 뒤 같은 번호로 다시 보낸 ${cur.name}는 ${RESP[cur.resp]} 응답을 받았다`);

      for (const rid of rids) {

        if (!rs.length) continue;
        if (!rs.some((r) => r.resp === 'ok')) out.push(`장애가 없었는데 ${rid} 충전에 성공 응답이 없다`);

      }
    }

/* 문제: 중고거래 1:1 채팅
 * 유형: 연결 끊김 사이 실시간 전달 유실(L1)과 중복 표시(L2)
 * 세계: 메시지 테이블 하나 + 구매자 기기(외부 시스템). 기기의 화면 처리 방식은 밀어 주기 연산 종류로 고른다.
 */
(function (root) {
  'use strict';
  const SD = (root.SD = root.SD || {});
  SD.problems = SD.problems || [];

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const MID = (k) => String(k).split('-')[0];

  // ---------------------------------------------------------------- 구매자 기기
  // 상태: scr(화면에 붙은 번호 목록), off(연결이 끊긴 시점의 연결 구간), late(재접속 흐름이 요청이 끝난 뒤에야 처음 붙인 번호)
  // 연결 구간: 요청 쪽은 하나('req'), 재접속 흐름은 회차마다 새 구간이다(회차가 시작되면 다시 접속한 것).
  const epoch = (a) => (a.kind === 'bg' ? `${a.name}:${a.phase === 'pre' ? 'p' : a.run}` : 'req');
  // 같은 번호는 화면에 두 번까지만 기록한다(세 번째부터는 같은 위반이라 상태를 늘리지 않는다).
  function place(st, key, a, mode) {
    const id = String(key);
    const n = st.scr.filter((x) => x === id).length;
    let show = true;
    let why = '';
    if (mode === 'once' && n > 0) {
      show = false;
      why = '받은 적 있는 번호라 거름';
    } else if (mode === 'last' && st.scr.length && st.scr[st.scr.length - 1] === id) {
      show = false;
      why = '화면 끝과 같은 번호라 거름';
    } else if (mode === 'after' && st.scr.length && !(id > st.scr.reduce((m, x) => (x > m ? x : m)))) {
      show = false;
      why = '화면 끝 번호보다 작거나 같아서 안 붙임';
    }
    if (!show) return why;
    const first = !st.scr.some((x) => MID(x) === MID(id));
    if (n < 2) st.scr.push(id);
    // 요청이 다 끝난 뒤 새로 시작한 회차(run >= 1)에서 처음 붙인 것만 늦게 뜬 것으로 본다. 요청과 겹친 회차는 바로 뜬 것이다.
    if (first && a.kind === 'bg' && a.phase === 'post' && a.run >= 1 && !st.late.includes(MID(id))) st.late.push(MID(id));
    return n > 0 ? '화면에 또 붙임' : '화면에 붙임';
  }
  function pushOp(label, mode) {
    return {
      label,
      outcomes: [
        ['ok', '전달되면'],
        ['offline', '연결이 끊겨 있으면'],
        ['timeout', '타임아웃이면'],
      ],
      visLabels: { ok: '전달됨', offline: '연결 끊김', timeout: '타임아웃' },
      faults: ['offline', 'timeout_applied', 'timeout_lost'],
      run({ st, key, a, fault }) {
        const e = epoch(a);
        const notes = [];
        if (st.off && a.kind === 'bg' && st.off !== e) {
          st.off = null;
          notes.push('기기가 다시 접속함');
        }
        if (st.off) return { vis: 'offline', note: '아직 연결이 끊겨 있다' };
        if (fault === 'offline') {
          st.off = e;
          notes.push('기기 연결이 끊김');
          return { vis: 'offline', note: notes.join(' 뒤 ') };
        }

/* 문제: 택배 배송 상태 추적
 * 유형: 이벤트 순서 역전으로 최신 상태 덮임 (C10)
 * L1 순서 역전(파티션, 늦게 도착), L2 처리 못 하는 메시지와 재전달
 */
(function (root) {
  'use strict';
  const SD = (root.SD = root.SD || {});
  SD.problems = SD.problems || [];

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const STS = ['접수', '집하', '배송 중', '배송 완료'];
  const ST = STS.map((x) => [x]);

  // ---------------------------------------------------------------- 블록
  const PAYLOAD = { inv: '$p.inv', shop: '$p.shop', st: '$p.st', seq: '$p.seq' };
  const resp = (kind) => ({ t: 'respond', kind });
  const pub = (pkey) => ({ t: 'publish', label: '배송 이벤트', topic: 'track', payload: clone(PAYLOAD), pkey, br: { fail: [resp('fail')], timeout: [resp('fail')] } });
  const REQ = (pkey) => [pub(pkey), resp('ok')];

  const KEY = '$m.inv';
  const SET = { st: '$m.st', seq: '$m.seq' };
  const upd = (where, br) => Object.assign({ t: 'update', table: 'parcel', key: KEY, set: clone(SET), where: where || [] }, br ? { br } : {});
  const SEQ_LT = [{ f: 'seq', op: 'lt', v: '$m.seq' }];
  const NOT_DONE = [{ f: 'st', op: 'ne', v: '배송 완료' }];
  const read = (lock) => ({ t: 'read', table: 'parcel', key: KEY, lock });
  const ACK = { t: 'ack' };
  const STOP = { t: 'stop' };
  const checkSeq = { t: 'check', a: '$r.parcel.seq', op: 'lt', b: '$m.seq' };
  const ifAbsent = (yes, no) => ({ t: 'if', a: '$r.parcel', op: 'absent', br: { yes: yes || [], no: no || [] } });

  const SIDE_VALUES = { inv: '$m.inv', st: '$m.st', seq: '$m.seq' };
  const SIDE = {
    pair: { label: '미처리 이벤트 넣기 (키: 송장번호+순번)', table: 'side', key: ['$m.inv', '$m.seq'], values: SIDE_VALUES },
    inv: { label: '미처리 이벤트 넣기 (키: 송장번호)', table: 'side', key: '$m.inv', values: SIDE_VALUES },
    fresh: { label: '미처리 이벤트 넣기 (키: 새 번호)', table: 'side', key: '$new.u', values: SIDE_VALUES },
  };
  const park = (k) => Object.assign({ t: 'insert' }, clone(SIDE[k]), { br: { dup: [] } });

  // L1 모범 답
  const L1_COND = { name: '송장 키 + 순번 조건부 변경', req: REQ('inv'), cons: [upd(SEQ_LT), ACK] };
  const L1_READ = { name: '송장 키 + 순번 확인 뒤 변경', req: REQ('inv'), cons: [read('none'), checkSeq, upd([]), ACK] };

  // L2 모범 답 (L3, L4의 기준 설계)
  // 행은 한 번 생기면 지워지지 않는다. 그래서 "있음"을 본 뒤의 조건부 변경 0건은 옛 이벤트라는 뜻이다.
  const L2_CONS = [read('none'), ifAbsent([park('pair'), ACK, STOP]), upd(SEQ_LT), ACK];
  const L2_CONS_RETRY = [upd(SEQ_LT, { zero: [read('none'), ifAbsent([park('pair')], [upd(SEQ_LT)])] }), ACK];
  const parkFirst = (k, ackFirst) => (ackFirst ? [ACK, read('none'), ifAbsent([park(k), STOP]), upd(SEQ_LT)] : [read('none'), ifAbsent([park(k), ACK, STOP]), upd(SEQ_LT), ACK]);

  // ---------------------------------------------------------------- 불변식
  function invariants(f, level) {
    const out = [];
    const L2 = level.id === 'L2';
    const evs = f.reqs.filter((r) => r.resp === 'ok').map((r) => r.params);
    const side = Object.values(f.rows('side'));
    const invs = new Set([...evs.map((e) => e.inv), ...Object.keys(f.rows('parcel'))]);
    for (const inv of [...invs].sort()) {
      const row = f.row('parcel', inv);
      const init = f.initialRow('parcel', inv);
      const mine = evs.filter((e) => e.inv === inv);
      if (row && row.seq !== 0 && !(init && init.seq === row.seq)) {
        const src = mine.find((e) => e.seq === row.seq);
        if (!src || src.st !== row.st) out.push(`송장 ${inv} 화면의 상태(${row.st})와 순번(${row.seq})이 서로 다른 이벤트에서 왔다`);
      }
      for (const e of mine) {
        const applied = row && row.seq >= e.seq;
        const parked = side.some((h) => h.inv === inv && h.seq === e.seq);
        if (applied || parked) continue;
        const ev = `이벤트(${e.st}, 순번 ${e.seq})`;
        if (!row) out.push(`등록되지 않은 송장 ${inv}의 ${ev}가 미처리 이벤트에 없다. 조용히 버려졌다`);
        else if (!L2) out.push(`송장 ${inv} 최종 화면: ${row.st}(순번 ${row.seq}). 더 나중에 일어난 ${ev}가 반영되지 않았다`);
        else out.push(`송장 ${inv} 최종 화면: ${row.st}(순번 ${row.seq}). 더 나중에 일어난 ${ev}가 화면에도 미처리 이벤트에도 없다`);
      }
    }
    if (L2) {
      const seen = {};
      for (const h of side) {
        const k = `${h.inv}-${h.seq}`;
        seen[k] = seen[k] || { h, n: 0 };
        seen[k].n += 1;
      }
      for (const k of Object.keys(seen).sort()) {
        const { h, n } = seen[k];
        if (n > 1) out.push(`미처리 이벤트에 같은 이벤트(${h.inv}, ${h.st}, 순번 ${h.seq})가 ${n}번 들어갔다`);
        if (f.initialRow('parcel', h.inv)) out.push(`처음부터 등록된 송장 ${h.inv}의 이벤트(${h.st}, 순번 ${h.seq})가 미처리 이벤트에 들어갔다. 처리할 수 있었거나 버려도 되는 이벤트다`);
      }
    }
    if (f.used === 0) for (const r of f.reqs) if (r.resp !== 'ok') out.push(`장애가 없었는데 택배사 요청 ${r.name}에 성공 응답이 나가지 않았다`);
    return out;
  }

  // ---------------------------------------------------------------- 테스트 도우미
  const ev = (name, inv, st, seq, after) => Object.assign({ name, params: { inv, shop: 'S1', st, seq } }, after ? { after } : {});
  const REG = (inv) => [{ label: `쇼핑몰이 송장 ${inv}을 등록함`, table: 'parcel', key: inv, set: { st: '접수', seq: 0 } }];
  const NONE = { parcel: {} };

  // ---------------------------------------------------------------- 팔레트
  const REQ_PAL = {
    blocks: ['publish', 'respond'],
    publishes: [
      {
        label: '배송 이벤트',
        topic: 'track',
        payload: PAYLOAD,
        pkeys: [
          ['inv', '송장번호'],
          ['shop', '고객사'],
          [null, '없음 (아무 파티션)'],
        ],
      },
    ],
    respond: [
      ['ok', '성공'],
      ['fail', '실패'],
    ],
  };
  const SEQ_OPS = ['lt', 'le', 'eq', 'ne', 'gt', 'ge'];
  function consPal(l2) {
    const p = {
      blocks: ['begin', 'commit', 'read', 'check', 'if', 'update', 'ack', 'stop'],
      tables: { parcel: { keys: [['$m.inv', '메시지의 송장번호']], read: ['none', 'update'] } },
      conds: [
        { a: '$r.parcel.seq', label: '읽은 순번', ops: SEQ_OPS, b: [['$m.seq', '메시지의 순번']] },
        { a: '$r.parcel.st', label: '읽은 상태', ops: ['eq', 'ne'], b: ST },
      ],
      set: { parcel: { st: [['$m.st', '메시지의 상태']], seq: [['$m.seq', '메시지의 순번']] } },
      where: { parcel: { seq: { ops: ['lt', 'le', 'ne'], v: [['$m.seq', '메시지의 순번']] }, st: { ops: ['eq', 'ne'], v: ST } } },
    };
    if (l2) {
      p.blocks = ['begin', 'commit', 'read', 'check', 'if', 'update', 'insert', 'ack', 'stop'];
      p.conds.unshift({ a: '$r.parcel', label: '읽은 배송 상태 행', ops: ['exists', 'absent'] });
      p.inserts = [SIDE.pair, SIDE.inv, SIDE.fresh];
    }
    return p;
  }

  // 소비자 처리 시간: 소비자(C0, C1)가 쓴 시간의 합. 메시지는 하나다.
  const consT = (m) => Object.keys(m.by || {}).filter((k) => /^C\d*$/.test(k)).reduce((s, k) => s + (m.by[k].T || 0), 0);
  const LAT = { begin: 0, db: 5, commit: 5, rollback: 5, publish: 10 };
  const PROFILE = { actors: [{ name: 'A', params: { inv: 'P1', shop: 'S1', st: '집하', seq: 1 } }] };
