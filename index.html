    save();
    document.documentElement.setAttribute('data-theme', next);
  }

  function render() {
    clearInterval(render.tick);
    const m = location.hash.match(/^#\/p\/([^/]+)(?:\/(L\d))?/);
    app.replaceChildren();
    if (m) {
      const P = PROBLEMS.find((p) => p.id === m[1]);
      if (P) return renderProblem(P, m[2]);
    }
    renderHome();
    window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- 홈
  function levelState(P, L, idx) {
    const r = lvRec(P.id, L.id);
    if (r.solvedAt) return 'solved';
    if (r.gaveUp) return 'gaveup';
    if (idx === 0) return 'open';
    const prev = lvRec(P.id, P.levels[idx - 1].id);
    return prev.solvedAt || prev.gaveUp ? 'open' : 'locked';
  }

  function tagStats() {
    const st = {};
    const add = (tag, ok, recent) => {
      const s = st[tag] || (st[tag] = { ok: 0, n: 0, rok: 0, rn: 0 });
      s.n++;
      if (ok) s.ok++;
      if (recent) {
        s.rn++;
        if (ok) s.rok++;
      }
    };
    for (const P of PROBLEMS) {
      const ats = (store.probs[P.id] && store.probs[P.id].attempts) || [];
      ats.forEach((at, ai) => {
        const recent = ai === ats.length - 1;
        for (const L of P.levels) {
          const r = at.lv[L.id];
          if (!r || !r.subs.length) continue;
          const first = r.subs[0];
          if (L.kind === 'flow') for (const t of L.tests) for (const tag of t.tags) add(tag, first.res[t.id], recent);
          else for (const q of L.questions) add(q.tag, first.res[q.id], recent);
        }
      });
    }
    return st;
  }

  function renderHome() {
    app.appendChild(header('시스템 설계 꼬리질문'));
    const wrap = h('main', { class: 'wrap' });
    wrap.appendChild(
      h(
        'section',
        { class: 'intro' },
        h('p', null, '면접관이 상황을 주고 꼬리질문을 이어 간다. 설계는 블록으로 쌓고, 채점은 숨은 장애 시나리오로 한다. 동시 요청의 실행 순서, 서버가 죽는 지점, 외부 호출과 메시지의 결과를 모두 펼쳐 보고 규칙이 깨지는 실행을 찾아 반례로 보여 준다.'),
        h('p', { class: 'muted small' }, '문제 → 고민(힌트 잠금) → 힌트 → 해설. 숙달 지표는 실패 유형별 첫 제출 통과율이다.'),
      ),
    );
    const allLv = PROBLEMS.reduce((n, P) => n + P.levels.length, 0);
    const doneLv = PROBLEMS.reduce((n, P) => n + P.levels.filter((L, i) => ['solved', 'gaveup'].includes(levelState(P, L, i))).length, 0);
    wrap.appendChild(h('div', { class: 'row h2row' }, h('h2', null, `문제 ${PROBLEMS.length}개`), h('span', { class: 'sp' }), h('span', { class: 'muted small' }, `단계 ${doneLv}/${allLv} 끝냄`)));
    let lastAxis = null;
    const groups = ['정합성', '트래픽', '데이터', '기타'];
    const sorted = PROBLEMS.slice().sort((a, b) => groups.indexOf(axisOf(a)) - groups.indexOf(axisOf(b)) || (a.order || 999) - (b.order || 999));
    for (const P of sorted) {
      if (axisOf(P) !== lastAxis) {
        lastAxis = axisOf(P);
        wrap.appendChild(h('h3', { class: 'axis' }, lastAxis));
      }
      const states = P.levels.map((L, i) => levelState(P, L, i));
      const firstOpen = P.levels.findIndex((L, i) => states[i] === 'open');
      const target = P.levels[firstOpen >= 0 ? firstOpen : 0].id;
      const doneN = states.filter((x) => x === 'solved' || x === 'gaveup').length;
      const status = doneN === 0 ? '시작 전' : doneN === P.levels.length ? '다 풂' : `${P.levels[firstOpen >= 0 ? firstOpen : 0].id} 차례`;
      wrap.appendChild(
        h(
          'button',
          { class: 'card pcard', type: 'button', onclick: () => go(`#/p/${P.id}/${target}`) },
          h('div', { class: 'prow' }, h('span', { class: 'ptitle' }, P.title), h('span', { class: 'dots', title: P.levels.map((L, i) => `${L.id} ${L.title}`).join('\n') }, states.map((x) => h('i', { class: `dot ${x}` }))), h('span', { class: `pstatus ${doneN === P.levels.length ? 'ok' : ''}` }, status)),
          P.types ? h('div', { class: 'ptypes' }, P.types.map((t) => h('span', { class: 'ptype' }, t))) : null,
          h('p', { class: 'psum' }, P.summary),
        ),
      );
    }

    // 숙달
    const st = tagStats();
    const tags = Object.keys(st).sort((a, b) => st[a].ok / st[a].n - st[b].ok / st[b].n);
    wrap.appendChild(h('h2', null, '실패 유형별 숙달'));
    if (!tags.length) wrap.appendChild(h('p', { class: 'muted' }, '아직 제출 기록이 없다. 단계마다 첫 제출의 테스트 결과가 유형별로 쌓인다.'));
    else
      wrap.appendChild(
        h(
          'div',
          { class: 'card' },
          h(
            'table',
            { class: 'stats' },
            h('thead', null, h('tr', null, h('th', null, '유형'), h('th', null, '첫 제출 통과'), h('th', null, ''), h('th', null, '최근 회차'), h('th', null, '판정'))),
            h(
              'tbody',
              null,
              tags.map((t) => {
                const s = st[t];
                const r = s.ok / s.n;
                const verdict = s.n < 5 ? '표본 부족' : r >= 0.8 ? '체화' : r >= 0.5 ? '익히는 중' : '약함';
                return h(
                  'tr',
                  null,
                  h('td', null, t),
                  h('td', { class: 'num' }, `${s.ok}/${s.n}`),
                  h('td', { class: 'barcell' }, h('div', { class: 'bar' }, h('i', { style: `width:${Math.round(r * 100)}%` }))),
                  h('td', { class: 'num' }, s.rn ? `${s.rok}/${s.rn}` : '-'),
                  h('td', { class: `verdict v-${verdict}` }, verdict),
                );
              }),
            ),
          ),
          h('p', { class: 'muted small' }, '체화 = 테스트 5개 이상, 첫 제출 통과율 80% 이상. "처음부터 다시 풀기"로 회차를 늘리면 최근 회차 열에서 변화를 본다.'),
        ),
      );

    wrap.appendChild(h('h2', null, '설정'));
    wrap.appendChild(
      h(
        'div',
        { class: 'card' },
        h(
          'div',
          { class: 'row' },
          h('span', null, '힌트와 포기 잠금'),
          sel(
            [0, 5, 10, 15, 20].map((m) => [m, m ? `${m}분` : '없음']),
            settings().lockMin,
            (v) => {
              settings().lockMin = Number(v);
              save();
            },
          ),
          h('span', { class: 'muted small' }, '단계를 처음 연 뒤 이 시간 동안은 혼자 고민한다.'),
        ),
        h(
          'div',
          { class: 'row', style: 'margin-top:10px' },
          h('span', null, '모드'),
          h('span', { class: 'muted small' }, '입문: 테스트 목록과 반례를 바로 보여 준다. 중급: 테스트를 숨기고 반례는 힌트 잠금이 풀린 뒤에 본다.'),
        ),
      ),
    );
    app.appendChild(wrap);
  }
  // confirm()은 브라우저 대화상자를 띄우므로 쓰지 않는다. 같은 버튼을 4초 안에 두 번 눌러야 실행.
  function armed(key, msg) {
    if (armed.key === key) {
      armed.key = null;
      return true;
    }
    armed.key = key;
    toast(msg);
    setTimeout(() => {
      if (armed.key === key) armed.key = null;
    }, 4000);
    return false;
  }
  function toast(msg) {
    const t = h('div', { class: 'toast' }, msg);
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  // ---------------------------------------------------------------- 문제 화면
  function renderProblem(P, lid) {
    const idx = Math.max(0, P.levels.findIndex((L) => L.id === lid));
    const L = P.levels[idx];
    const state = levelState(P, L, idx);
    app.appendChild(header(P.title, true, L.kind !== 'choice'));
    const wrap = h('main', { class: `wrap ${L.kind !== 'choice' ? 'wide' : ''}` });
    wrap.appendChild(
      h(
        'nav',
        { class: 'steps big' },
        P.levels.map((X, i) => {
          const s = levelState(P, X, i);
          return h('button', { class: `step ${s} ${i === idx ? 'cur' : ''}`, disabled: s === 'locked', onclick: () => go(`#/p/${P.id}/${X.id}`) }, `${X.id} ${X.title}`);
        }),
      ),
    );
    wrap.appendChild(
      h(
        'details',
        { class: 'ctx', open: idx === 0 ? true : null },
        h('summary', null, '상황'),
        P.context.map((p) => h('p', null, p)),
        P.model && P.model.length ? [h('p', { class: 'small' }, h('b', null, '채점 세계에서 단순화한 것')), h('ul', { class: 'small' }, P.model.map((x) => h('li', null, x)))] : null,
      ),
    );

    wrap.appendChild(
      h(
        'div',
        { class: 'row small attempt' },
        h('span', { class: 'muted' }, `${attempts(P.id).length}회차 풀이`),
        h(
          'button',
          {
            class: 'btn sm ghost',
            type: 'button',
            onclick: () => {
              if (!armed(`reset-${P.id}`, '한 번 더 누르면 새 회차를 시작한다. 이전 기록은 숙달 통계에 남는다.')) return;
              attempts(P.id).push({ startedAt: Date.now(), lv: {} });
              save();
              go(`#/p/${P.id}/L1`);
            },
          },
          '처음부터 다시 풀기',
        ),
      ),
    );
    if (state === 'locked') {
      wrap.appendChild(h('div', { class: 'card' }, h('p', null, '앞 단계를 통과하거나 해설을 열면 열린다.')));
      app.appendChild(wrap);
      return;
    }
    const r = lvRec(P.id, L.id);
    if (!r.openedAt) {
      r.openedAt = Date.now();
      if (L.kind === 'flow') r.flows = initialFlows(P, L);
      save();
    }
    if (L.kind === 'flow' && !r.flows) r.flows = initialFlows(P, L);

    const card = h('section', { class: 'card level' });
    card.appendChild(h('div', { class: 'interviewer' }, h('span', { class: 'who' }, '면접관'), h('span', null, `“${L.interviewer}”`)));
    card.appendChild(h('ul', { class: 'ask' }, L.ask.map((p) => h('li', null, p))));
    card.appendChild(
      h(
        'div',
        { class: 'meta row small' },
        h('span', { class: 'pill', 'data-live': 'elapsed' }, ''),
        L.kind === 'flow' && r.draftAt ? h('span', { class: 'pill' }, `설계 ${fmtTime(r.draftAt - r.openedAt)}`) : null,
        L.kind === 'flow' && r.draftAt ? h('span', { class: 'pill', 'data-live': 'xfer' }, '') : null,
        h('span', { class: 'pill' }, `제출 ${r.subs.length}`),
        h('span', { class: 'pill' }, `힌트 ${r.hints}/${L.hints.length}${r.cx ? ' + 반례' : ''}`),
        r.solvedAt ? h('span', { class: 'pill ok' }, r.subs.length && r.subs[0].pass ? '첫 제출 통과' : '통과') : null,
        r.gaveUp && !r.solvedAt ? h('span', { class: 'pill bad' }, '해설 열람') : null,
      ),
    );

    // 흐름, 정량 단계는 넓은 화면에서 왼쪽(문제, 규칙)과 오른쪽(풀이)으로 나눈다.
    const split = L.kind !== 'choice';
    const workCard = h('section', { class: 'card work' });
    if (L.kind === 'flow') renderFlowLevel(P, L, r, card, workCard);
    else if (L.kind === 'quant') renderQuantLevel(P, L, r, card, workCard);
    else renderChoiceLevel(P, L, r, card, wrap);
    const work = h('div', { class: 'lv-work' });
    if (workCard.childNodes.length) work.appendChild(workCard);
    renderHints(P, L, r, work);
    renderAnswer(P, L, r, work);
    if ((r.solvedAt || r.gaveUp) && idx < P.levels.length - 1) {
      work.appendChild(h('div', { class: 'row next' }, h('button', { class: 'btn primary', onclick: () => go(`#/p/${P.id}/${P.levels[idx + 1].id}`) }, `다음 꼬리질문: ${P.levels[idx + 1].id} ${P.levels[idx + 1].title} →`)));
    }
    if (split) wrap.appendChild(h('div', { class: 'lv-grid' }, h('div', { class: 'lv-info' }, card), work));
    else wrap.append(card, work);
    if (split) app.appendChild(refBar(P, L));
    app.appendChild(wrap);

    const tick = () => {
      const el = document.querySelector('[data-live=elapsed]');
      if (el) el.textContent = `경과 ${fmtTime((r.solvedAt || Date.now()) - r.openedAt)}`;
      const xf = document.querySelector('[data-live=xfer]');
      if (xf && r.draftAt) xf.textContent = `옮기기 ${fmtTime((r.solvedAt || Date.now()) - r.draftAt)}`;
      const left = lockLeft(r);
      document.querySelectorAll('[data-live=lock]').forEach((x) => {
        x.textContent = left > 0 ? `${fmtTime(left)} 뒤 열림` : '';
      });
      if (left <= 0 && document.querySelector('[data-lockwait]')) render();
    };
    tick();
    render.tick = setInterval(tick, 1000);
  }

  // 이어받는 단계가 있으면 그 단계에서 통과한(없으면 편집 중인) 흐름 중 같은 이름의 흐름으로 시작한다.
  function initialFlows(P, L) {
    const f = {};
    for (const fs of L.flows) f[fs.id] = [];
    if (L.inherit) {
      const pr = lvRec(P.id, L.inherit);
      const src = pr.passedFlows || pr.flows;
      const ids = L.inheritFlows || L.flows.map((x) => x.id);
      if (src) for (const id of ids) if (src[id]) f[id] = withIds(clone(src[id]));
    }
    if (L.start) for (const id of Object.keys(L.start)) if (!f[id] || !f[id].length) f[id] = withIds(clone(L.start[id]));
    return f;
  }

  const lockLeft = (r) => (r.solvedAt ? 0 : r.openedAt + settings().lockMin * 60000 - Date.now());

  // 좁은 화면에서 풀다가 규칙, 테스트를 다시 보는 아래 고정 바
  function refBar(P, L) {
    const items =
      L.kind === 'flow'
        ? [
            ['규칙', () => openPanel('지켜야 할 규칙', rulesNode(L))],
            ['테스트', () => openPanel(`테스트 ${L.tests.length}개`, testsNode(L))],
            ['블록 설명', () => openPanel('블록이 하는 일', h('ul', { class: 'helplist' }, helpItems(P, L)))],
          ]
        : [
            ['주어진 값', () => openPanel('주어진 값', h('table', { class: 'givens' }, h('tbody', null, L.givens.map(([k, v]) => h('tr', null, h('td', null, k), h('td', { class: 'num' }, v))))))],
            ['계산 규칙', () => openPanel('계산 규칙', h('ul', { class: 'rules' }, L.rulesText.map((x) => h('li', null, x))))],
          ];
    return h('nav', { class: 'refbar', 'aria-label': '참고' }, items.map(([label, fn]) => h('button', { class: 'btn sm', type: 'button', onclick: fn }, label)));
  }

  // ---------------------------------------------------------------- 흐름 단계
  const HELP = {
    begin: ['트랜잭션 시작 / 커밋', '그 사이의 변경은 커밋 때 한꺼번에 반영된다. 응답할 때 트랜잭션이 열려 있으면 성공과 처리 중 응답은 커밋, 실패 응답은 롤백한다. 트랜잭션은 흐름이 속한 서비스의 DB 안에서만 열린다.'],
    read: ['읽기', '일반 읽기는 잠그지 않는다. 트랜잭션 안이면 그 트랜잭션의 첫 일반 읽기 시점 스냅샷을 본다. FOR UPDATE는 행을 잠그고(트랜잭션 끝까지) 최신 커밋 값을 본다. 트랜잭션 밖의 FOR UPDATE는 문장이 끝나면 잠금이 풀린다.'],
    replica: ['복제본에서 읽기', '원본에 커밋된 쓰기는 복제본에 늦게 반영된다. 언제 반영되는지는 정해져 있지 않다.'],
    count: ['개수 세기', '조건에 맞는 행 수를 센다. 일반 읽기처럼 잠그지 않는다.'],
    check: ['확인', '읽은 값을 비교한다. 다르면 실패로 끝난다(요청은 실패 응답, 열린 트랜잭션은 롤백).'],
    if: ['조건 갈래', '조건이 맞는지에 따라 갈래가 나뉜다. 갈래가 비어 있으면 다음 블록으로 넘어간다.'],
    update: ['변경', 'UPDATE 한 문장. 행을 잠그고 최신 커밋 값으로 조건을 본다. 1건, 0건 갈래가 있고 비워 두면 다음 블록으로 넘어간다. 트랜잭션 밖이면 바로 커밋된다.'],
    delete: ['삭제', 'DELETE 한 문장. 변경과 같이 잠그고 1건, 0건 갈래가 있다.'],
    insert: ['넣기', 'INSERT 한 문장. 같은 키나 유니크 값이 이미 있으면 "중복이면" 갈래로 간다. 그 문장만 실패하고 트랜잭션은 이어진다. 다른 트랜잭션이 같은 값을 넣고 아직 커밋하지 않았으면 그 결과를 기다린다.'],
    call: ['외부 호출', '결과마다 갈래가 있다. 갈래가 비어 있으면 호출 다음 블록으로 넘어간다. 타임아웃이면 상대가 실제로 처리했는지 알 수 없다.'],
    publish: ['메시지 발행', '메시지를 토픽에 쓴다. DB 트랜잭션과 묶이지 않는다(롤백돼도 이미 나간 메시지는 그대로다). 결과는 성공, 실패, 타임아웃이고 타임아웃이면 실제로 써졌는지 모른다. 파티션 키를 고르면 같은 키는 같은 파티션으로 가서 순서가 지켜진다. 키가 없으면 아무 파티션으로나 간다.'],
    ack: ['소비 확인', '지금 메시지까지 처리했다고 브로커에 알린다(오프셋 커밋). 소비자가 죽으면 마지막으로 확인한 다음 메시지부터 다시 받는다. 확인 없이 끝나도 다음 메시지로 넘어간다.'],
    cget: ['캐시 읽기, 쓰기, 삭제', '캐시 연산 하나는 원자적이다. 쓰기는 항상 쓰거나, 없을 때만 쓰거나, 버전이 더 클 때만 쓴다. 조건부 쓰기는 쓰였는지에 따라 갈래가 나뉜다.'],
    cincr: ['캐시 카운터 증가', '키의 숫자를 원자적으로 더하고 더한 뒤의 값을 돌려준다. 키가 없으면 0에서 시작한다.'],
    respond: ['응답', '요청 흐름의 끝. 모든 갈래는 응답으로 끝나야 한다.'],
  };
  function helpItems(P, L) {
    const used = new Set();
    let replica = false;
    for (const id of Object.keys(L.palette || {})) {
      const pal = palFor(P, L, id);
      for (const t of pal.blocks || []) used.add(t === 'commit' ? 'begin' : t === 'cset' || t === 'cdel' ? 'cget' : t);
      if ((pal.blocks || []).includes('cincr')) used.add('cincr');
      for (const t of Object.keys(pal.tables || {})) if ((pal.tables[t].read || []).includes('replica')) replica = true;
    }
    const out = [];
    for (const k of Object.keys(HELP)) {
      if (k === 'replica' ? !replica : !used.has(k)) continue;
      out.push(h('li', null, h('b', null, HELP[k][0]), `: ${HELP[k][1]}`));
    }
    if (L.tests.some((x) => x.clock && x.clock.length)) out.push(h('li', null, h('b', null, '시간'), ': 테스트에 따라 "시각이 지남" 같은 사건이 아무 때나 끼어든다. 요청과 배경 흐름 사이 어느 지점에서든 일어날 수 있다.'));
    for (const f of L.flows) {
      if (f.kind === 'bg') {
        const when = { after: '요청이 모두 끝나거나 죽은 뒤에 돈다', concurrent: '요청과 함께 돈다', last: '요청이 끝나고 받은 메시지를 다 처리한 뒤에 돈다' }[f.schedule || 'after'];
        const rounds = f.rounds || E.RUNS;
        const pre = (f.schedule || 'after') === 'concurrent' ? ` 요청이 도는 동안은 ${f.preRounds || rounds}회차까지 돌고, 요청이 끝나면 돌던 회차를 마친 뒤 ${rounds}회차를 더 돈다.` : ` ${rounds}회차까지 본다.`;
        out.push(h('li', null, h('b', null, f.label), `: ${when}. ${f.each ? `${tl(P, f.each)} 행마다 처음부터 돌고(처리 중인 행 = "이 행"), ` : ''}회차마다 다시 돈다.${pre} "여기서 끝"이나 확인 불일치를 만나면 ${f.each ? '그 행' : '그 회차'} 처리를 마친다.`));
      }
      if (f.kind === 'consumer') out.push(h('li', null, h('b', null, f.label), ': 메시지마다 처음부터 돈다. 파티션마다 소비자가 하나씩 있고 파티션 안에서는 차례로 처리한다.'));
    }
    out.push(h('li', null, h('b', null, '서버 다운'), ': 아무 블록 사이에서나 날 수 있다. 열린 트랜잭션은 롤백되고, 다운된 요청은 응답을 받지 못한다.'));
    for (const x of L.notes || []) out.push(h('li', null, x));
    return out;
  }

  function rulesNode(L) {
    return h('ul', { class: 'rules' }, L.rules.map((x) => h('li', null, x)));
  }
  function testsNode(L) {
    if (hidden()) return h('p', { class: 'muted' }, `숨은 테스트 ${L.tests.length}개로 채점한다. 어떤 장애가 일어나는지는 직접 따져야 한다.`);
    return h(
      'div',
      { class: 'tests' },
      L.tests.map((t) => h('div', { class: 'test' }, h('div', { class: 'thd' }, h('span', { class: 'tid' }, t.id), h('b', null, t.name)), h('div', { class: 'tags' }, t.tags.map((g) => h('span', { class: 'tag' }, g))), h('div', { class: 'muted small' }, t.desc))),
    );
  }
  function tagSummary(L) {
    const n = {};
    for (const t of L.tests) for (const g of t.tags) n[g] = (n[g] || 0) + 1;
    return Object.keys(n).map((g) => `${g} ${n[g]}`).join(', ');
  }

  function renderFlowLevel(P, L, r, card, work) {
    card.appendChild(h('h3', { class: 'sub' }, '지켜야 할 규칙'));
    card.appendChild(rulesNode(L));
    card.appendChild(
      h(
        'details',
        { class: 'fold', open: wideScreen() && !hidden() ? true : null },
        h('summary', null, h('b', null, `테스트 ${L.tests.length}개`), hidden() ? null : h('span', { class: 'muted small' }, ` ${tagSummary(L)}`)),
        testsNode(L),
      ),
    );
    card.appendChild(h('details', { class: 'fold' }, h('summary', null, h('b', null, '블록이 하는 일')), h('ul', { class: 'helplist' }, helpItems(P, L))));
    card = work;

    // 1. 말로 먼저 설계한다. 다 적어야 블록 편집기가 열린다(이 기능 전에 시작한 단계는 건너뛴다).
    const gate = !r.draftAt && !r.solvedAt && !r.gaveUp && !r.subs.length;
    const dbox = h('div', { class: 'draft' });
    if (gate) {
      dbox.appendChild(h('h3', { class: 'sub first' }, '1. 말로 먼저 설계하기'));
      dbox.appendChild(h('p', { class: 'muted small' }, '면접에서 말하듯 3~5줄로 적는다. 무엇을 어떤 순서로 하고, 트랜잭션은 어디서 끊고, 장애가 나면 어떻게 되는지. 다 적으면 블록으로 옮겨 채점한다. 여기까지 걸린 시간이 설계 시간으로 남는다.'));
      const btn = h(
        'button',
        {
          class: 'btn primary',
          type: 'button',
          disabled: (r.draft || '').trim().length < 10 ? true : null,
          onclick: () => {
            r.draftAt = Date.now();
            save();
            render();
          },
        },
        '다 적었다, 블록으로 옮기기',
      );
      dbox.appendChild(
        h(
          'textarea',
          {
            rows: 5,
            class: 'draftin',
            placeholder: '예: 먼저 …를 하고, …이면 …한다. 서버가 …에서 죽으면 …',
            oninput: (e) => {
              r.draft = e.target.value;
              btn.disabled = r.draft.trim().length < 10;
              save();
            },
          },
          r.draft || '',
        ),
      );
      dbox.appendChild(h('div', { class: 'row actions' }, btn, h('span', { class: 'muted small' }, '블록 편집기는 이 단계가 끝나야 열린다.')));
      card.appendChild(dbox);
      return;
    }
    if (r.draft) {
      dbox.appendChild(h('h3', { class: 'sub first' }, '1. 내가 말로 한 설계'));
      dbox.appendChild(h('div', { class: 'draft-text' }, r.draft));
      card.appendChild(dbox);
    }

    const onChange = () => save();
    card.appendChild(h('h3', { class: `sub ${r.draft ? '' : 'first'}` }, r.draft ? '2. 블록으로 옮겨 채점하기' : '블록으로 설계하기'));
    if (hidden()) card.appendChild(h('p', { class: 'muted small' }, '중급: 이 문제의 모든 단계 재료를 함께 보여 준다. 쓰지 않을 재료도 섞여 있다.'));
    for (const fs of L.flows) {
      card.appendChild(h('div', { class: 'flowname' }, fs.label));
      card.appendChild(editor(P, L, r.flows[fs.id] || (r.flows[fs.id] = []), fs.id, palFor(P, L, fs.id), onChange));
    }

    const msg = h('div', { class: 'msg' });
    const resultBox = h('div', { class: 'result' });
    card.appendChild(
      h(
        'div',
        { class: 'row actions' },
        h(
          'button',
          {
            class: 'btn primary',
            onclick: () => {
              const errs = [];
              for (const fs of L.flows) if (fs.kind === 'req' && !(r.flows[fs.id] || []).length) errs.push(`${fs.label}이 비어 있다.`);
              for (const fs of L.flows) lint(P, L, r.flows[fs.id], fs.id, errs);
              if (errs.length) {
                msg.replaceChildren(h('div', { class: 'warn' }, [...new Set(errs)].map((e) => h('div', null, e))));
                return;
              }
              msg.replaceChildren(h('span', { class: 'muted' }, '채점 중… 실행 순서와 장애 지점을 펼치는 중'));
              setTimeout(() => {
                const t0 = performance.now();
                const res = E.runLevel(P, L, r.flows);
                const ms = Math.round(performance.now() - t0);
                const pass = res.every((x) => x.result.pass === true);
                const sub = { at: Date.now(), pass, res: {} };
                for (const x of res) sub.res[x.test.id] = x.result.pass === true;
                r.subs.push(sub);
                r.last = {
                  ms,
                  results: res.map((x) => ({ id: x.test.id, pass: x.result.pass, limit: !!x.result.limit, violations: x.result.violations || [], trace: x.result.trace || null, states: x.result.states })),
                };
                if (pass && !r.solvedAt) r.solvedAt = Date.now();
                if (pass) r.passedFlows = clone(r.flows);
                save();
                render();
              }, 30);
            },
          },
          '채점',
        ),
        h(
          'button',
          {
            class: 'btn ghost',
            onclick: () => {
              if (!armed(`flow-${P.id}-${L.id}`, '한 번 더 누르면 편집한 블록을 지우고 처음 상태로 돌린다.')) return;
              r.flows = initialFlows(P, L);
              save();
              render();
            },
          },
          '편집 초기화',
        ),
      ),
    );
    card.appendChild(msg);
    card.appendChild(resultBox);
    if (r.last) resultBox.appendChild(flowResult(L, r));
  }

  function flowResult(L, r) {
    const res = r.last.results;
    const passN = res.filter((x) => x.pass === true).length;
    const box = h('div', null);
    box.appendChild(
      h(
        'div',
        { class: `score ${passN === res.length ? 'ok' : 'bad'}` },
        h('b', null, `테스트 ${passN}/${res.length} 통과`),
        h('span', { class: 'muted small' }, `, 실행 ${res.reduce((a, x) => a + (x.states || 0), 0).toLocaleString()}개 상태를 ${r.last.ms}ms에 탐색`),
      ),
    );
    const showCx = !hidden() || r.cx || r.solvedAt || r.gaveUp;
    let firstFail = true;
    // 통과한 테스트는 한 줄로 모으고, 실패한 것만 펼친다.
    const passes = [];
    const passRow = h('div', { class: 'passes' });
    box.appendChild(passRow);
    res.forEach((x, k) => {
      const t = L.tests.find((tt) => tt.id === x.id);
      if (!t) return;
      const name = hidden() && !(r.solvedAt || r.gaveUp) ? `숨은 테스트 #${k + 1}` : `${t.id} ${t.name}`;
      const head = h(
        'div',
        { class: 'thead' },
        h('span', { class: `mark ${x.pass ? 'ok' : 'bad'}` }, x.pass ? '✓' : x.limit ? '!' : '✗'),
        h('b', null, name),
        !hidden() || r.solvedAt || r.gaveUp ? t.tags.map((g) => h('span', { class: 'tag' }, g)) : null,
      );
      if (x.pass) {
        passes.push(h('span', { class: 'passchip' }, `✓ ${hidden() && !(r.solvedAt || r.gaveUp) ? `#${k + 1}` : t.id}`));
        return;
      }
      const body = [];
      if (x.limit) body.push(h('div', { class: 'warn' }, '탐색 한도를 넘었다. 흐름을 줄여 보라.'));
      body.push(h('ul', { class: 'viol' }, x.violations.map((v) => h('li', null, v))));
      if (x.trace && x.trace.rows) {
        if (showCx) body.push(h('div', { class: 'cxlabel small muted' }, '반례: 규칙이 깨지는 가장 짧은 실행'), traceTable(x.trace));
        else body.push(h('div', { class: 'muted small' }, '반례는 힌트 잠금이 풀린 뒤 힌트 칸에서 볼 수 있다.'));
      }
      // 실패가 많으면 화면이 길어진다. 첫 실패만 펼친다.
      box.appendChild(h('details', { class: 'tres fail', open: firstFail ? true : null }, h('summary', null, head), body));
      firstFail = false;
    });
    if (passes.length) passRow.append(h('span', { class: 'muted small' }, '통과'), ...passes);
    else passRow.remove();
    return box;
  }

  // ---------------------------------------------------------------- 정량 단계
  function baseFlows(P, L) {
    const from = P.levels.find((x) => x.id === (L.from || 'L2'));
    const rf = lvRec(P.id, from.id);
    if (rf.passedFlows) return { from, flows: rf.passedFlows, mine: true };
    return { from, flows: from.answer.flows[0], mine: false };
  }
  function metrics(P, L) {
    const b = baseFlows(P, L);
    const prof = E.profile(P, b.from, b.flows, L.lat, L.profile) || { T: 0, C: 0, L: 0, n: {}, trace: null };
    const w = E.worst(P, b.from, b.flows, L.worstLat || L.lat, L.profile);
    return Object.assign({}, prof, { W: w ? w.W : 0, prof, worst: w, base: b });
  }
  const near = (x, want) => (want === 0 ? Math.abs(x) < 0.5 : Math.abs(x - want) / Math.abs(want) <= 0.1);

  function renderQuantLevel(P, L, r, card, work) {
    const m = metrics(P, L);
    card.appendChild(h('h3', { class: 'sub' }, m.base.mine ? `기준 설계: 내가 ${m.base.from.id}에서 통과시킨 흐름` : `기준 설계: ${m.base.from.id} 모범 답 (${m.base.from.id}를 통과하지 않아서)`));
    const shown = L.showFlows || m.base.from.flows.filter((f) => f.kind !== 'bg').map((f) => f.id);
    for (const id of shown) {
      const fs = flowSpec(m.base.from, id);
      if (shown.length > 1) card.appendChild(h('div', { class: 'small muted' }, fs.label));
      card.appendChild(flowText(P, m.base.from, m.base.flows[id] || [], id));
    }
    card.appendChild(h('h3', { class: 'sub' }, '주어진 값'));
    card.appendChild(h('table', { class: 'givens' }, h('tbody', null, L.givens.map(([k, v]) => h('tr', null, h('td', null, k), h('td', { class: 'num' }, v))))));
    card.appendChild(h('h3', { class: 'sub' }, '계산 규칙'));
    card.appendChild(h('ul', { class: 'rules' }, L.rulesText.map((x) => h('li', null, x))));

    card = work;
    card.appendChild(h('h3', { class: 'sub first' }, '문항'));
    const last = r.subs.length ? r.subs[r.subs.length - 1].res : null;
    const done = r.solvedAt || r.gaveUp;
    const qs = h('div', { class: 'qs' });
    for (const q of L.questions) {
      const mark = last ? h('span', { class: `mark ${last[q.id] ? 'ok' : 'bad'}` }, last[q.id] ? '✓' : '✗') : null;
      let input;
      if (q.type === 'num') {
        input = h('div', { class: 'row' }, h('input', { type: 'text', inputmode: 'decimal', class: 'numin', value: r.answers[q.id] || '', oninput: (e) => { r.answers[q.id] = e.target.value; save(); } }), h('span', { class: 'muted' }, q.unit));
      } else {
        input = h(
          'div',
          { class: 'opts' },
          q.options.map((o, oi) =>
            h('label', { class: 'opt' }, h('input', { type: 'radio', name: q.id, checked: String(r.answers[q.id]) === String(oi) ? true : null, onchange: () => { r.answers[q.id] = oi; save(); } }), h('span', null, o)),
          ),
        );
      }
      const ans = done ? h('div', { class: 'small muted' }, `정답: ${q.type === 'num' ? `${+q.answer(m).toFixed(2)} ${q.unit} (±10%)` : q.options[q.answer(m)]}`) : null;
      qs.appendChild(h('div', { class: 'q' }, h('div', { class: 'qt' }, mark, h('span', null, q.text)), input, ans));
    }
    card.appendChild(qs);
    card.appendChild(
      h(
        'div',
        { class: 'row actions' },
        h(
          'button',
          {
            class: 'btn primary',
            onclick: () => {
              const res = {};
              for (const q of L.questions) {
                const want = q.answer(m);
                const got = r.answers[q.id];
                if (q.type === 'num') {
                  const x = parseFloat(String(got == null ? '' : got).replace(/,/g, ''));
                  res[q.id] = Number.isFinite(x) && near(x, want);
                } else res[q.id] = got != null && Number(got) === want;
              }
              const pass = Object.values(res).every(Boolean);
              r.subs.push({ at: Date.now(), pass, res });
              if (pass && !r.solvedAt) r.solvedAt = Date.now();
              save();
              render();
            },
          },
          '채점',
        ),
        h('span', { class: 'muted small' }, '수치는 ±10% 안이면 정답'),
      ),
    );
    if (done && m.prof.trace) {
      card.appendChild(h('h3', { class: 'sub' }, '풀이: 정상 경로 점유 시간'));
      card.appendChild(traceTable(m.prof.trace, { timing: true }));
      const lk = Object.keys(m.Lk || {});
      card.appendChild(h('p', { class: 'small' }, `스레드 점유 T = ${m.T}ms, 커넥션 점유 C = ${m.C}ms`));
      if (lk.length) card.appendChild(h('p', { class: 'small' }, `행 잠금 점유: ${lk.map((k) => `${k} ${m.Lk[k]}ms`).join(', ')}`));
      if (L.worstLat && m.worst) {
        card.appendChild(h('h3', { class: 'sub' }, '풀이: 가장 오래 걸리는 갈래 (외부 호출 = 타임아웃)'));
        card.appendChild(traceTable(m.worst.trace, { timing: true }));
      }
    }
    if (L.essay) card.appendChild(essay(L, r));
  }

  function essay(L, r) {
    const box = h('div', { class: 'essay' });
    box.appendChild(h('h3', { class: 'sub' }, `말로 답하기: ${L.essay.text}`));
    const can = r.solvedAt || r.gaveUp;
    const cmpBtn = h(
      'button',
      {
        class: 'btn sm',
        disabled: !can || !(r.essay || '').trim() ? true : null,
        onclick: () => {
          r.essayOpen = true;
          save();
          render();
        },
      },
      can ? '모범 답과 비교' : '모범 답과 비교 (단계를 통과하면 열림)',
    );
    box.appendChild(
      h(
        'textarea',
        {
          rows: 4,
          placeholder: '면접에서 말하듯 적는다. 채점하지 않고 모범 답과 나란히 비교한다.',
          oninput: (e) => {
            r.essay = e.target.value;
            cmpBtn.disabled = !can || !r.essay.trim();
            save();
          },
        },
        r.essay || '',
      ),
    );
    if (!r.essayOpen) {
      box.appendChild(cmpBtn);
    } else {
      box.appendChild(h('div', { class: 'cmp' }, h('div', null, h('div', { class: 'small muted' }, '내 답'), h('p', null, r.essay || '')), h('div', null, h('div', { class: 'small muted' }, '모범 답'), h('p', null, L.essay.model))));
      box.appendChild(
        h(
          'div',
          { class: 'row small' },
          h('span', { class: 'muted' }, '스스로 판정:'),
          ['다 들어감', '일부', '빠짐'].map((x) =>
            h(
              'button',
              {
                class: `btn sm ${r.self === x ? 'primary' : 'ghost'}`,
                onclick: () => {
                  r.self = x;
                  save();
                  render();
                },
              },
              x,
            ),
          ),
        ),
      );
    }
    return box;
  }

  // ---------------------------------------------------------------- 선택 단계
  function renderChoiceLevel(P, L, r, card) {
    const last = r.subs.length ? r.subs[r.subs.length - 1].res : null;
    const done = r.solvedAt || r.gaveUp;
    const qs = h('div', { class: 'qs' });
    for (const q of L.questions) {
      const ok = last && last[q.id];
      qs.appendChild(
        h(
          'div',
          { class: 'q' },
          h('div', { class: 'qt' }, last ? h('span', { class: `mark ${ok ? 'ok' : 'bad'}` }, ok ? '✓' : '✗') : null, h('span', null, q.text)),
          h(
            'div',
            { class: 'opts' },
            q.options.map((o, oi) =>
              h(
                'label',
                { class: `opt ${done && oi === q.answer ? 'right' : ''}` },
                h('input', { type: 'radio', name: q.id, checked: String(r.answers[q.id]) === String(oi) ? true : null, onchange: () => { r.answers[q.id] = oi; save(); } }),
                h('span', null, o),
              ),
            ),
          ),
          ok || done ? h('div', { class: 'explain small' }, q.explain) : null,
        ),
      );
    }
    card.appendChild(qs);
    card.appendChild(
      h(
        'div',
        { class: 'row actions' },
        h(
          'button',
          {
            class: 'btn primary',
            onclick: () => {
              const res = {};
              for (const q of L.questions) res[q.id] = r.answers[q.id] != null && Number(r.answers[q.id]) === q.answer;
              const pass = Object.values(res).every(Boolean);
              r.subs.push({ at: Date.now(), pass, res });
              if (pass && !r.solvedAt) r.solvedAt = Date.now();
              save();
              render();
            },
          },
          '채점',
        ),
      ),
    );
  }

  // ---------------------------------------------------------------- 힌트, 해설
  function renderHints(P, L, r, wrap) {
    const left = lockLeft(r);
    const box = h('section', { class: 'card hints' }, h('div', { class: 'row' }, h('h3', null, '힌트'), h('span', { class: 'muted small', 'data-live': 'lock' }, '')));
    if (left > 0) box.setAttribute('data-lockwait', '1');
    for (let k = 0; k < r.hints; k++) box.appendChild(h('div', { class: 'hint' }, h('span', { class: 'hn' }, k + 1), h('span', null, L.hints[k])));
    const row = h('div', { class: 'row' });
    if (r.hints < L.hints.length) {
      row.appendChild(
        h(
          'button',
          {
            class: 'btn sm',
            disabled: left > 0 ? true : null,
            onclick: () => {
              r.hints++;
              save();
              render();
            },
          },
          `힌트 ${r.hints + 1} 열기`,
        ),
      );
    }
    if (L.kind === 'flow' && hidden() && !r.cx && r.last && r.last.results.some((x) => x.pass === false)) {
      row.appendChild(
        h(
          'button',
          {
            class: 'btn sm',
            disabled: left > 0 ? true : null,
            onclick: () => {
              r.cx = true;
              save();
              render();
            },
          },
          '반례 보기',
        ),
      );
    }
    if (!r.solvedAt && !r.gaveUp) {
      row.appendChild(
        h(
          'button',
          {
            class: 'btn sm ghost',
            disabled: left > 0 ? true : null,
            onclick: () => {
              if (!armed(`giveup-${P.id}-${L.id}`, '한 번 더 누르면 해설을 연다. 이 단계는 통과가 아닌 해설 열람으로 기록된다.')) return;
              r.gaveUp = true;
              save();
              render();
            },
          },
          '포기하고 해설 보기',
        ),
      );
    }
    if (row.childNodes.length) box.appendChild(row);
    wrap.appendChild(box);
  }

  function renderAnswer(P, L, r, wrap) {
    if (!(r.solvedAt || r.gaveUp)) return;
    const box = h('section', { class: 'card answer' }, h('h3', null, '해설'));
    if (L.kind === 'flow') {
      const A = L.answer;
      for (const f of A.flows) {
        box.appendChild(h('div', { class: 'small muted' }, `모범 답: ${f.name}`));
        const fl = L.flows.filter((fs) => f[fs.id] && f[fs.id].length);
        box.appendChild(h('div', { class: fl.length > 1 ? 'two' : '' }, fl.map((fs) => h('div', null, h('div', { class: 'small' }, fs.label), flowText(P, L, f[fs.id], fs.id)))));
      }
      box.appendChild(h('h3', { class: 'sub' }, '왜'));
      box.appendChild(h('ul', null, A.why.map((x) => h('li', null, x))));
      box.appendChild(h('h3', { class: 'sub' }, '면접에서 말로 하면'));
      if (r.draft) {
        box.appendChild(h('div', { class: 'cmp' }, h('div', null, h('div', { class: 'small muted' }, '내가 먼저 쓴 설계'), h('p', { class: 'draft-text' }, r.draft)), h('div', null, h('div', { class: 'small muted' }, '모범 답'), h('p', null, A.speak))));
        box.appendChild(
          h(
            'div',
            { class: 'row small' },
            h('span', { class: 'muted' }, '스스로 판정:'),
            ['다 들어감', '일부', '빠짐'].map((x) =>
              h(
                'button',
                {
                  class: `btn sm ${r.draftSelf === x ? 'primary' : 'ghost'}`,
                  type: 'button',
                  onclick: () => {
                    r.draftSelf = x;
                    save();
                    render();
                  },
                },
                x,
              ),
            ),
          ),
        );
      } else box.appendChild(h('p', { class: 'speak' }, A.speak));
      if (A.next && A.next.length) {
        box.appendChild(h('h3', { class: 'sub' }, '이어서 나올 꼬리질문'));
        box.appendChild(h('ul', null, A.next.map((x) => h('li', null, x))));
      }
      refs(A.refs, box);
    } else {
      if (L.kind === 'quant') box.appendChild(h('p', { class: 'muted small' }, '풀이 표는 위 문제 카드에 있다.'));
      if (L.kind === 'choice') box.appendChild(h('p', { class: 'muted small' }, '문항별 설명은 위에 열려 있다.'));
      refs(L.refs, box);
    }
    wrap.appendChild(box);
  }
  function refs(list, box) {
    if (!list || !list.length) return;
    box.appendChild(h('h3', { class: 'sub' }, '실무 사례'));
    box.appendChild(h('ul', null, list.map((x) => h('li', null, h('a', { href: x.url, target: '_blank', rel: 'noopener' }, x.title)))));
  }

  // ---------------------------------------------------------------- 시작
  if (settings().theme) document.documentElement.setAttribute('data-theme', settings().theme);
  save();
  render();
})();

</script>
</body>
</html>
