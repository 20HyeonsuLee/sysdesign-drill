        label: OP_LABEL[op],
        outcomes: [
          ['ok', '가격이 오면'],
          ['err', '오류면'],
          ['timeout', '타임아웃이면'],
        ],
        visLabels: { ok: '가격 받음', err: '오류 응답', timeout: '타임아웃' },
        faults: ['err', 'slow'],
        run({ st, key, a, fault }) {
          st.r = st.r || {};
          const rec = (st.r[key] = st.r[key] || { ms: 0, res: [] });
          // 한 검색 안에서 느린 항공사는 다시 불러도 느리다.
          const mode = fault || (rec.slow ? 'slow' : null) || downAt(st, a.params && a.params.now);
          let ms;
          let vis;
          let res;
          let note;
          if (mode === 'err') {
            ms = ERR_MS;
            vis = 'err';
            res = 'err';
            note = '바로 오류';
          } else if (mode === 'slow') {
            rec.slow = true;
            if (to == null) {
              ms = SLOW_MS;
              vis = 'ok';
              res = 'late';
              note = '30초 만에 응답';
            } else {
              ms = to;
              vis = 'timeout';
              res = 'timeout';
              note = `응답이 없어 ${sec(to)}에서 끊음`;
            }
          } else if (to != null && A.base > to) {
            ms = to;
            vis = 'timeout';
            res = 'cut';
            note = `평소 ${sec(A.base)} 걸리는데 ${sec(to)}에서 끊음`;
          } else {
            ms = A.base;
            vis = 'ok';
            res = 'ok';
            note = sec(A.base);
          }
          rec.ms += ms;
          rec.res.push(res);
          return { vis, note: rec.res.length > 1 ? `${note}, 이 검색에서 ${A.label}을 기다린 시간 ${sec(rec.ms)}` : note };
        },
      };
    }
    return {
      label: A.label,
      keyLabel: '검색',
      init: {},
      fmt: (st) =>
        Object.keys(st.r || {})
          .map((k) => `${k} ${recText(st.r[k])}`)
          .join(', ') || '-',
      ops,
    };
  }

  // ---------------------------------------------------------------- 블록 재료
  const INS = {
    ka: { label: '가람항공 가격 담기', table: 'res', key: ['$me', 'ka'], values: { search: '$me', air: 'ka' } },
    nb: { label: '누리항공 가격 담기', table: 'res', key: ['$me', 'nb'], values: { search: '$me', air: 'nb' } },
  };
  const COUNT = { label: '담은 가격 수 세기', table: 'res', where: [{ f: 'search', op: 'eq', v: '$me' }] };
  // 캐시 키는 항공사 이름 그대로 쓴다(반례에 "연속 실패 수 누리항공 1 증가"처럼 보인다).
  const CK = { ka: AIR.ka.label, nb: AIR.nb.label };
  const AIRKEYS = XS.map((x) => [CK[x], CK[x]]);
  const CALLS = XS.map((x) => ({ ext: x, ops: OPS, keys: [['$me', '이 검색']] }));
  const COND_N = { a: '$n.res', label: '담은 가격 수', ops: ['eq', 'gt'], b: [[0, '0']] };
  const COND_T = { a: '$p.now', label: '요청 시각', ops: ['lt', 'ge'], b: [['$c.mark', '캐시에서 읽은 시각']] };
  const COND_F = { a: '$c.fails', label: '캐시에서 읽은 연속 실패 수', ops: ['ge', 'lt'], b: [[FAILS, String(FAILS)]] };
  const RESPOND = [
    ['ok', '성공'],
    ['fail', '실패'],
  ];

  const call = (x, op, br) => Object.assign({ t: 'call', ext: x, op, key: '$me' }, br ? { br } : {});
  const put = (x) => Object.assign({ t: 'insert' }, clone(INS[x]));
  const OK = { t: 'respond', kind: 'ok' };
  const FAIL = { t: 'respond', kind: 'fail' };
  const COUNT_B = Object.assign({ t: 'count' }, clone(COUNT));
  const NONE_FAIL = { t: 'if', a: '$n.res', op: 'eq', b: 0, br: { yes: [FAIL] } };

  // L1 모범 답
  const L1_PARTIAL = [call('ka', 'q1', { ok: [put('ka')] }), call('nb', 'q2', { ok: [put('nb')] }), OK];

  // L2: 항공사마다 시각 기록을 보고 건너뛰거나 부른다
  const getMark = (x) => ({ t: 'cget', cache: 'mark', key: CK[x] });
  const getFails = (x) => ({ t: 'cget', cache: 'fails', key: CK[x] });
  const incr = (x) => ({ t: 'cincr', cache: 'fails', key: CK[x], by: 1 });
  const resetFails = (x) => ({ t: 'cset', cache: 'fails', key: CK[x], v: 0, cond: 'always' });
  const markReopen = (x) => ({ t: 'cset', cache: 'mark', key: CK[x], v: '$p.reopen', cond: 'always' });
  const onFail = (x) => [incr(x), { t: 'if', a: '$c.fails', op: 'ge', b: FAILS, br: { yes: [markReopen(x)] } }];
  function guarded(x, op, o) {
    o = o || {};
    const body = call(x, op, {
      ok: o.noReset ? [put(x)] : [put(x), resetFails(x)],
      err: onFail(x),
      timeout: o.noTimeout ? [] : onFail(x),
    });
    return [getMark(x), { t: 'if', a: '$p.now', op: 'lt', b: '$c.mark', br: { no: [body] } }];
  }
  const L2_GUARD = [...guarded('ka', 'q1'), ...guarded('nb', 'q2'), OK];
  // 오답: 실패 수만 보고 끊고, 시간이 지나도 다시 부르지 않는다
  const forever = (x, op) => [getFails(x), { t: 'if', a: '$c.fails', op: 'ge', b: FAILS, br: { no: [call(x, op, { ok: [put(x), resetFails(x)], err: [incr(x)], timeout: [incr(x)] })] } }];

  // ---------------------------------------------------------------- 테스트 재료
  const FA = (x, list) => {
    const out = {};
    for (const op of OPS) out[`${x}.${op}`] = list;
    return out;
  };
  // 시각 순서대로 하나씩 들어오는 검색들
  const R = (times) => times.map((t, i) => Object.assign({ name: `R${i + 1}`, params: { now: t, reopen: t + WAIT } }, i ? { after: `R${i}` } : {}));
  const DOWN = (m) => {
    const out = {};
    for (const x of Object.keys(m)) out[x] = { down: m[x] };
    return out;
  };

  // ---------------------------------------------------------------- 불변식
  function invariants(f, level) {
    const out = [];
    const L2 = level.id === 'L2';
    const res = f.rows('res');
    const recOf = (x, u) => (f.ext[x] && f.ext[x].r && f.ext[x].r[u]) || null;
    const tagOf = (r) => (L2 ? `${r.name}(시각 ${r.params.now}초)` : r.name);
    for (const r of f.reqs) {
      if (r.st === 'crash' || !r.resp) continue;
      const tag = tagOf(r);
      let total = 0;
      let any = false;
      for (const x of XS) {
        const nm = AIR[x].label;
        const rec = recOf(x, r.user);
        const has = !!res[`${r.user}-${x}`];
        const got = !!rec && rec.res.some(isOk);
        if (rec) total += rec.ms;
        if (has) any = true;
        if (got && !has) out.push(`${tag}: ${nm}이 가격을 줬는데 응답 목록에 담지 않았다`);
        if (!got && has) out.push(`${tag}: ${nm} 가격을 받지 못했는데 응답 목록에 담았다`);
        if (rec && !got && rec.res.includes('cut')) out.push(`${tag}: ${nm}은 정상이었는데 평소 응답 시간(${sec(AIR[x].base)})보다 짧은 타임아웃에 끊겨 가격을 받지 못했다`);
        if (!L2 && !rec) out.push(`${tag}: ${nm}을 부르지 않았다`);
      }
      if (total > LIMIT_MS) out.push(`${tag}: 항공사를 기다린 시간이 모두 ${sec(total)}로 응답 한도 3초를 넘었다`);
      if (any && r.resp !== 'ok') out.push(`${tag}: 담은 가격이 있는데 실패로 응답했다`);
    }
    if (L2) {
      // 규칙대로라면 언제 불러야 하고 언제 건너뛰어야 하는지 시각 순서로 따라간다.
      const order = f.reqs.filter((r) => r.st !== 'crash').sort((a, b) => a.params.now - b.params.now);
      for (const x of XS) {
        const nm = AIR[x].label;
        let fails = 0;
        let until = -1;
        let at = null;
        let atN = 0;
        for (const r of order) {
          const now = r.params.now;
          const rec = recOf(x, r.user);
          const open = fails >= FAILS && now < until;
          const tag = tagOf(r);
          // 항공사마다 처음 어긋난 곳만 알린다(그 뒤는 어긋난 호출 결과에 따라 달라진다).
          if (rec && open) {
            out.push(`${tag}: ${nm}을 불렀다. 시각 ${at}초에 연달아 ${atN}번째로 실패해서 ${until}초까지는 부르지 않아야 한다`);
            break;
          }
          if (!rec && !open) {
            out.push(`${tag}: ${nm}을 건너뛰었다. ${fails >= FAILS ? `${until}초가 지났으니 다시 불러야 한다` : `연달아 실패한 횟수가 ${fails}번이라 불러야 한다`}`);
            break;
          }
          if (rec)
            for (const o of rec.res) {
              if (isOk(o)) fails = 0;
              else {
                fails += 1;
                if (fails >= FAILS) {
                  until = now + WAIT;
                  at = now;
                  atN = fails;
                }
              }
            }
        }
      }
    }
    return out;
  }

  function fmtWorld(s) {
    const out = [];
    const res = (s.db.main && s.db.main.res) || {};
    const by = {};
    for (const k of Object.keys(res)) {
      const r = res[k];
      (by[r.search] = by[r.search] || []).push(AIR[r.air] ? AIR[r.air].label : r.air);
    }
    for (const u of Object.keys(by)) out.push([`응답 목록 ${u}`, by[u].join(', ')]);
    for (const x of XS) {
      const st = s.ext[x] || {};
      for (const k of Object.keys(st.r || {})) out.push([`${AIR[x].label} ${k}`, recText(st.r[k])]);
    }
    const CL = { fails: '연속 실패 수', mark: '시각 기록' };
    for (const c of Object.keys(CL)) {
      const C = s.cache[c] || {};
      for (const k of Object.keys(C)) out.push([`${CL[c]} ${k}`, String(C[k])]);
    }
    return out;
  }

  // ---------------------------------------------------------------- 수치 단계 계산
  const LAT = { begin: 0, db: 0, commit: 0, rollback: 0, cache: 0 };
  const WORST = { begin: 0, db: 0, commit: 0, rollback: 0, cache: 0 };
  for (const x of XS) {
    for (const op of OPS) {
      const to = TO[op];
      LAT[`${x}.${op}`] = to != null && AIR[x].base > to ? to : AIR[x].base;
      WORST[`${x}.${op}`] = to == null ? SLOW_MS : to;
    }
  }
  const callsOf = (m, x) => Object.keys(m.n || {}).filter((k) => k.startsWith(`${x}.`));
  // 항공사 하나를 기다린 시간(그 항공사 호출을 모두 더함). table: LAT(정상) 또는 WORST(타임아웃까지)
  const waitOf = (m, x, table) => callsOf(m, x).reduce((a, k) => a + m.n[k] * table[k], 0);
  const firstTo = (m, x) => {
    const k = callsOf(m, x)[0];
    return k ? WORST[k] : 0;
  };
  const RPS = 200;
  const THREADS = 200;
  const PROFILE = { actors: [{ name: 'A', params: { now: 0, reopen: WAIT } }] };

  SD.problems.push({
    id: 'flight',
    order: 21,
    title: '항공권 가격 비교 검색',
    summary: '검색 하나가 항공사 두 곳에 가격을 묻고 모은다. 항공사가 오류를 내고, 느려지고, 한동안 죽어 있다.',
    types: ['느린 의존성이 전체 응답을 붙잡음'],
    context: [
      '항공권 가격 비교 서비스다. 사용자가 노선과 날짜로 검색하면 서버가 항공사 두 곳(가람항공, 누리항공)에 가격을 묻고 모아서 보여 준다.',
      '항공사 API는 우리 것이 아니다. 가람항공은 평소 0.3초, 누리항공은 평소 1.2초 걸린다. 가끔 바로 오류를 주거나, 30초가 넘도록 응답하지 않는다.',
      '검색 화면은 3초 안에 응답해야 한다. 답은 블록으로 쌓는다. 블록 하나가 면접에서 말로 하는 한 단계다.',
    ],
    model: [
      '항공사는 차례로 부른다. 동시에 부르는 경우는 L3에서 계산으로 본다.',

    ],
    world: {
      tables: { res: { label: '응답 목록', fields: { search: { label: '검색' }, air: { label: '항공사' } } } },
      rows: { res: {} },
      exts: { ka: airline('ka'), nb: airline('nb') },

    fmtWorld,

          { id: 'T1-2', name: '누리항공 오류', tags: ['외부 실패'], actors: ['A'], faults: FA('nb', ['err']), budget: 1, desc: '누리항공이 바로 오류를 준다.' },

          { id: 'T1-4', name: '누리항공 느림', tags: ['외부 지연'], actors: ['A'], faults: FA('nb', ['slow']), budget: 1, desc: '누리항공이 30초 넘게 응답하지 않는다.' },
          { id: 'T1-5', name: '가람항공 느림', tags: ['외부 지연'], actors: ['A'], faults: FA('ka', ['slow']), budget: 1, desc: '가람항공이 30초 넘게 응답하지 않는다.' },
          { id: 'T1-6', name: '가람 오류, 누리 느림', tags: ['외부 실패', '외부 지연'], actors: ['A'], faults: Object.assign(FA('ka', ['err']), FA('nb', ['slow'])), budget: 2, desc: '가람항공은 오류를 주고 누리항공은 느리다(둘 중 하나만 일어날 수도 있다).' },

          { id: 'T1-8', name: '검색 처리 중 서버 다운', tags: ['부분 실패'], actors: ['A'], crash: ['A'], budget: 1, desc: '검색을 처리하던 서버가 어느 단계 사이에서든 한 번 죽는다.' },

(function (root) {

  const newdb = {

          ['fail', '실패하면'],
          ['timeout', '타임아웃이면'],
        ],
        visLabels: { ok: '쓰임', fail: '실패', timeout: '타임아웃' },
        faults: W_FAULTS,

          return fault === 'timeout_applied' ? { vis: 'timeout', note: '실제로는 쓰임' } : { vis: 'ok' };
        },
      },
      setst: {
        label: '상태만 APPROVED로 바꾸기 (행이 있을 때만)',
        outcomes: [
          ['ok', '바뀌면'],
          ['zero', '행이 없으면'],
          ['fail', '실패하면'],
          ['timeout', '타임아웃이면'],
        ],
        visLabels: { ok: '바뀜', zero: '행 없음, 0건', fail: '실패', timeout: '타임아웃' },
        faults: W_FAULTS,
        run({ st, key, fault }) {
          const f = writeFault(fault);
          if (f) return f;
          const had = !!st.rows[key];
          if (had) st.rows[key] = Object.assign({}, st.rows[key], { st: 'APPROVED' });
          if (fault === 'timeout_applied') return { vis: 'timeout', note: had ? '실제로는 바뀜' : '실제로는 행이 없어 0건' };
          return { vis: had ? 'ok' : 'zero' };
        },
      },
      copy: {
        label: '읽은 행 쓰기 (있으면 덮어씀)',
        outcomes: [['ok', '쓰이면']],
        visLabels: { ok: '쓰임' },

      copyNew: {

        outcomes: [

  // ---------------------------------------------------------------- 블록

  function invariants(f) {

      if (rs.every((r) => r.resp === 'fail') && now.st !== init.st) out.push(`${k} 승인에 실패 응답만 나갔는데 옛 원장 ${k} 행은 ${now.st}다`);
      if (init.st === 'READY' && !oks.length && rs.every((r) => r.st !== 'crash')) out.push(`${k} 승인이 실패했다. 승인 서버가 죽지 않았으면 READY 결제의 승인은 성공해야 한다`);

      else if (n.st !== old[k].st || n.amt !== old[k].amt) out.push(`이관이 끝났는데 새 원장 ${k} 행은 ${n.st}, 옛 원장은 ${old[k].st}다`);
    }
    for (const k of Object.keys(nw).sort()) if (!old[k]) out.push(`새 원장에만 ${k} 행이 있다`);

      }
      if (MID(st)) out.push(`${level.id === 'L1' ? '' : '복구까지 끝났는데 '}${josa(name, '이', '가')} ${st} 상태로 남았다`);
    }

      const row = f.row('ord', r.params.order);
      const st = row ? row.st : null;
      if (r.resp === 'ok' && st !== 'DONE') out.push(`${r.name}는 성공 응답을 받았는데 주문이 완료되지 않았다`);

    }

    }

    }
    return out;
  }

    }

      const u = r.user;
      const pw = r.params.pw;
      const ok = r.resp === 'ok';
      const a = spec[r.name] || {};
      const prev = a.after ? byName[a.after] : null;
      const committed = new Set([init(u).pw, cur(u).pw, ...chgs.filter((c) => c.user === u && c.resp === 'ok').map((c) => c.params.npw)]);
      if (ok && !committed.has(pw)) out.push(`${r.name}: 원본에 들어간 적 없는 비밀번호 ${pw}로 로그인됐다`);
      if (ok && init(u).status === 'SUSPENDED') out.push(`${r.name}: 이미 정지된 계정으로 로그인됐다`);
      else if (ok && prev && prev.flow === 'sus' && prev.resp === 'ok' && prev.params.target === u) out.push(`${r.name}: ${u} 정지에 성공 응답이 나간 뒤 ${u}로 로그인됐다`);
      if (prev && prev.flow === 'chg' && prev.resp === 'ok' && prev.user === u) {
        const npw = prev.params.npw;
        if (pw === npw && !ok && !susTouched(u)) out.push(`${r.name}: 비밀번호를 ${npw}로 바꾼 뒤 새 비밀번호로 로그인했는데 실패했다`);
        if (pw !== npw && ok) out.push(`${r.name}: 비밀번호를 ${npw}로 바꾼 뒤 옛 비밀번호 ${pw}로 로그인됐다`);

    }

    // 원본 부하: 원본 읽기는 방금 바뀐 사용자의 로그인만, 한 건에 한 번

    }

      }
    }

  }

/* 문제: 오픈 API 키별 호출 한도
 * 유형: 호출 한도 초과 통과(L1, L2 흐름은 셈 경합, 구간 경계, 셈 저장소 장애만. 수치 비중이 크다)
 * 세계: 셈 저장소(Redis)를 외부 시스템으로 둔다. 명령마다 장애(응답 없음) 갈래가 있다.
 * 호출이 들어온 분은 요청 값($p.win)이다. 불변식은 (API 키, 분)마다 통과 수를 센다.
 */
(function (root) {
  'use strict';
  const SD = (root.SD = root.SD || {});
  SD.problems = SD.problems || [];

  const LIMIT = 2;

  // ---------------------------------------------------------------- 셈 저장소
  // 상태: { 셈 키: 값, $f: [장애를 겪은 호출 이름] }. 장애는 "응답 없음" 하나이고, 실제 반영 여부는 장애 이름이 정한다.
  const mark = (st, a) => {
    st.$f = (st.$f || []).filter((x) => x !== a.name).concat([a.name]);
  };
  const lost = (fault) => fault === 'err_lost' || fault === 'err';
  const rc = {
    label: '셈 저장소',
    keyLabel: '셈 키',
    init: {},
    fmt: (st) => {
      const ks = Object.keys(st).filter((k) => k[0] !== '$').sort();
      const body = ks.map((k) => `${k}=${st[k]}`).join(', ') || '비어 있음';
      return st.$f && st.$f.length ? `${body} (장애를 겪은 호출: ${st.$f.join(', ')})` : body;
    },
    ops: {
      get: {
        label: '읽기 (GET)',
        outcomes: [
          ['none', '키가 없으면'],
          ['under', '한도 아래면'],
          ['full', '한도에 찼으면'],
          ['err', '장애면'],
        ],
        visLabels: { none: '키 없음', under: '한도 아래', full: '한도 참', err: '응답 없음' },
        faults: ['err'],
        run({ st, key, a, fault }) {
          if (fault != null) {
            mark(st, a);
            return { vis: 'err' };
          }
          const v = st[key];
          if (v == null) return { vis: 'none' };
          return { vis: v < LIMIT ? 'under' : 'full', note: `값 ${v}` };
        },
      },
      incr: {
        label: '1 더하기 (INCR)',
        outcomes: [
          ['le', '더한 값이 한도 이하면'],
          ['gt', '더한 값이 한도를 넘으면'],
          ['err', '장애면'],
        ],
        visLabels: { le: '한도 이하', gt: '한도 넘음', err: '응답 없음' },
        faults: ['err_applied', 'err_lost'],
        run({ st, key, a, fault }) {
          if (fault != null) {
            mark(st, a);
            if (!lost(fault)) st[key] = (st[key] || 0) + 1;
            return { vis: 'err', note: lost(fault) ? '실제로는 안 더해짐' : `실제로는 더해짐, 값 ${st[key]}` };
          }
          const v = (st[key] || 0) + 1;
          st[key] = v;
          return { vis: v <= LIMIT ? 'le' : 'gt', note: `값 ${v}` };
        },
      },
      set1: {
        label: '1로 쓰기 (SET)',
        outcomes: [
          ['ok', '쓰이면'],
          ['err', '장애면'],
        ],
        visLabels: { ok: '씀', err: '응답 없음' },
        faults: ['err_applied', 'err_lost'],
        run({ st, key, a, fault }) {
          if (fault != null) mark(st, a);
          if (!lost(fault)) st[key] = 1;
          if (fault != null) return { vis: 'err', note: lost(fault) ? '실제로는 안 써짐' : '실제로는 써짐' };
          return { vis: 'ok', note: '값 1' };
        },
      },
      decr: {
        label: '1 빼기 (DECR)',
        outcomes: [
          ['ok', '빼지면'],
          ['err', '장애면'],
        ],
        visLabels: { ok: '뺌', err: '응답 없음' },
        faults: ['err_applied', 'err_lost'],
        run({ st, key, a, fault }) {
          if (fault != null) mark(st, a);
          if (!lost(fault)) st[key] = (st[key] || 0) - 1;
          if (fault != null) return { vis: 'err', note: lost(fault) ? '실제로는 안 빠짐' : '실제로는 빠짐' };
          return { vis: 'ok', note: `값 ${st[key]}` };
        },
      },
    },
  };

  // ---------------------------------------------------------------- 불변식
  function invariants(f, level, test) {
    const out = [];
    const st = f.ext.rc || {};
    const faulted = new Set(st.$f || []);
    const prior = test.prior || {};
    const groups = new Map();
    for (const r of f.reqs) {
      const k = r.params.key;
      const w = r.params.win || 0;
      const id = `${k}-${w}`;
      if (!groups.has(id)) groups.set(id, { k, w, ok: 0, okClean: 0, rej: [] });
      const G = groups.get(id);
      if (r.resp === 'ok') {
        G.ok += 1;
        if (!faulted.has(r.name)) G.okClean += 1;
      } else if (r.resp === 'fail') G.rej.push(r.name);
    }
    const when = (w) => (level.windows ? `${w}분에` : '같은 분에');
    for (const [id, G] of groups) {
      const p = prior[id] || 0;
      const n = p + G.okClean;
      const notes = [];
      if (p) notes.push(`앞서 쓴 ${p}번 포함`);
      if (level.windows && G.ok > G.okClean) notes.push('장애를 겪은 호출은 뺌');
      if (n > LIMIT) out.push(`${when(G.w)} ${G.k} 키가 ${n}번 통과했다 (한도 ${LIMIT}번${notes.length ? `, ${notes.join(', ')}` : ''})`);
      if (G.rej.length && p + G.ok < LIMIT) out.push(`${when(G.w)} ${G.k} 키는 ${p + G.ok}번만 통과했는데 ${G.rej.join(', ')}가 거절됐다 (한도 ${LIMIT}번${p ? `, 앞서 쓴 ${p}번 포함` : ''})`);
    }
    return out;
  }

  // ---------------------------------------------------------------- 블록
  const call = (op, key, br) => ({ t: 'call', ext: 'rc', op, key, br: br || {} });
  const pass = () => ({ t: 'respond', kind: 'ok' });
  const deny = () => ({ t: 'respond', kind: 'fail' });
  const K = '$p.key';
  const KW = ['$p.key', '$p.win'];
  const SK = ['$p.srv', '$p.key'];

  const KEYS1 = [
    [K, 'API 키'],
    [SK, '받은 서버 + API 키'],
  ];
  const KEYS2 = [
    [K, 'API 키'],
    [KW, 'API 키 + 들어온 분'],
    [SK, '받은 서버 + API 키'],
    [['$p.srv', '$p.key', '$p.win'], '받은 서버 + API 키 + 들어온 분'],
  ];
  const palette = (keys) => ({
    blocks: ['call', 'respond'],
    calls: [{ ext: 'rc', ops: ['get', 'incr', 'set1', 'decr'], keys }],
    respond: [
      ['ok', '통과'],
      ['fail', '거절 (429)'],
    ],
  });

  const L2_INCR = [call('incr', KW, { le: [pass()], gt: [deny()], err: [pass()] })];
  const L2_INCR_DECR = [call('incr', KW, { le: [pass()], gt: [call('decr', KW, { ok: [deny()], err: [deny()] })], err: [pass()] })];

  // ---------------------------------------------------------------- 테스트 재료
  const R = (name, o) => {
    const x = Object.assign({ srv: 'S1', win: 0, key: 'K1' }, o || {});
    const a = { name, params: { key: x.key, srv: x.srv, win: x.win } };
    if (x.after) a.after = x.after;
    return a;
  };
  const store1 = (n) => ({ rc: n == null ? {} : { K1: n } });
  // L2: 키 모양마다 그 설계가 남겼을 값을 함께 넣는다(API 키만 쓴 설계는 K1, 분을 넣은 설계는 K1-0).
  const store2 = (n) => ({ rc: n ? { K1: n, 'K1-0': n } : {} });
  const BOTH = ['err_applied', 'err_lost'];

  SD.problems.push({
    id: 'ratelimit',
    title: '오픈 API 키별 호출 한도',
    summary: '서버 여러 대가 같은 API 키의 호출 수를 함께 센다. 분이 바뀌고, 셈 저장소가 응답하지 않는다.',
    order: 20,
    types: ['호출 한도 초과 통과'],
    context: [
      '공공 데이터 오픈 API 서비스다. 개발자는 API 키를 발급받아 호출한다. 키마다 1분에 호출할 수 있는 횟수가 정해져 있다(문제에서는 2번).',
      'API 서버는 여러 대이고, 앞단 로드 밸런서가 요청을 아무 서버에나 보낸다. 셈은 모든 서버가 같이 쓰는 셈 저장소(Redis) 하나에 한다.',
      '한도를 넘은 호출은 거절(HTTP 429)한다. 답은 블록으로 쌓는다. 블록 하나가 면접에서 말로 하는 한 단계다.',
    ],
    model: [
      '셈 저장소의 명령 하나는 원자적이다. 장애는 "응답이 오지 않음" 하나로 보고, 명령이 실제로 반영됐는지는 알 수 없다.',
      '호출이 들어온 분은 요청 값으로 온다. 같은 분인지는 이 값으로 가른다. 셈 키는 만료되지 않는다고 본다(만료와 메모리는 L4).',
      '테스트가 "이번 분에 이미 n번 썼다"로 시작하면 셈 저장소에 그만큼 넣어 두고, 규칙도 그 n번을 센다.',
      '서버 메모리에서 세는 경우는 셈 키에 받은 서버를 넣는 것으로 나타낸다.',
    ],
    world: {
      tables: {},
      exts: { rc },
      params: { key: 'API 키', srv: '받은 서버', win: '들어온 분' },
    },
    respondLabels: { ok: '통과 응답', fail: '거절 응답 (429)' },
    invariants,
    levels: [
      // ---------------------------------------------------------------- L1
      {
        id: 'L1',
        kind: 'flow',
        title: '기본 설계',
        interviewer: '오픈 API에 키마다 분당 호출 한도를 걸려고 합니다. 서버가 여러 대인데 호출 수는 어떻게 세죠?',
        ask: [
          'API 키마다 1분에 2번까지만 통과시키고, 넘으면 거절(429)한다. 이 단계에서는 모든 호출이 같은 1분 안에 들어온다.',

        ],
        flows: [{ id: 'req', kind: 'req', label: '호출 흐름' }],
        palette: { req: palette(KEYS1) },

  // 요청 흐름은 좌석 S1, 복구 흐름은 지금 처리 중인 좌석($cur)을 다룬다.
  const W = (c) => Object.keys(c).map((f) => ({ f, op: 'eq', v: c[f] }));
  const mk = (key, me, zero) => ({
    begin: () => ({ t: 'begin' }),
    commit: () => ({ t: 'commit' }),
    read: (lock) => ({ t: 'read', table: 'seat', key, lock }),
    check: (field, op, value) => ({ t: 'check', a: `$r.seat.${field}`, op, b: value }),
    // 조건부 변경. 0건이면 요청은 실패 응답, 복구는 이 행 처리 끝(이전 엔진의 동작과 같다)

    call: (op, k, br) => ({ t: 'call', ext: 'pg', op, key: k === 'fresh' ? ['S1', me, '$new'] : ['S1', me], br }),
    respond: (kind) => ({ t: 'respond', kind }),

  const B = mk('S1', '$me', () => ({ t: 'respond', kind: 'fail' }));
  const R = mk('$cur', '$r.seat.holder', () => ({ t: 'stop' }));

  const SOLD_ME = { status: 'SOLD', holder: '$me' };
  const HELD_ME = { status: 'HELD', holder: '$me' };
  const FREE = { status: 'AVAILABLE', holder: null };

  const L2_REC = [

    if (row.status === 'AVAILABLE' && row.holder != null) out.push(`좌석이 AVAILABLE인데 주인(${row.holder})이 남았다`);
    if (row.status !== 'AVAILABLE' && row.holder == null) out.push(`좌석이 ${row.status}인데 주인이 없다`);
    if (initial.status === 'SOLD' && row.holder !== initial.holder) {

(function (root) {

  const clone = (o) => JSON.parse(JSON.stringify(o));

  const SST = [

  const STOP = () => ({ t: 'stop' });
  const BEGIN = () => ({ t: 'begin' });
  const COMMIT = () => ({ t: 'commit' });

  const RS = (lock) => ({ t: 'read', table: 'settle', key: SKEY, lock: lock || 'none' });
  const INS = (entry, br) => Object.assign({ t: 'insert' }, clone(entry), { br: br || {} });
  const SUB = () => ({ t: 'update', table: 'merchant', key: '$cur', set: { unpaid: { sub: '$r.merchant.unpaid' } }, where: [] });
  const ZERO = () => ({ t: 'update', table: 'merchant', key: '$cur', set: { unpaid: 0 }, where: [] });
  const SS = (status, from) => ({ t: 'update', table: 'settle', key: SKEY, set: { status }, where: from ? [{ f: 'status', op: 'eq', v: from }] : [], br: { zero: [STOP()] } });
  const IS = (status) => ({ t: 'check', a: '$r.settle.status', op: 'eq', b: status });
  const ABSENT = (yes) => ({ t: 'if', a: '$r.settle', op: 'absent', br: { yes } });
  const NONE = () => ({ t: 'check', a: '$r.settle', op: 'absent' });
  const XFER = (key, br) => ({ t: 'call', ext: 'bank', op: 'transfer', key, br });
  const QRY = (key, br) => ({ t: 'call', ext: 'bank', op: 'query', key, br });

  // 모범 답 A: 정산 결과(새 이체 번호)와 미정산 차감을 먼저 커밋, 정산 결과의 번호로 이체
  const ANS_A = [
    BEGIN(),
    RM('none'),
    INS(INS_READY, { ok: [SUB()] }),
    COMMIT(),
    RS(),

    XFER(TNO, { ok: [SS('PAID', 'READY')], timeout: [STOP()] }),

  const ANS_B = [
    BEGIN(),
    RM('update'),
    INS(INS_READY, { ok: [ZERO()] }),
    COMMIT(),
    RS(),
    IS('READY'),
    QRY(TNO, {
      done: [SS('PAID', 'READY')],
      none: [XFER(TNO, { ok: [SS('PAID', 'READY')], timeout: [STOP()] })],
      timeout: [STOP()],
    }),
  ];

  // 거래 승인 흐름(주어진 그대로): 가맹점 M1의 미정산 금액에 1만 원을 더한다
  const PAY = [{ t: 'update', table: 'merchant', key: 'M1', set: { unpaid: { add: 1 } }, where: [] }, { t: 'respond', kind: 'ok' }];

  // ---------------------------------------------------------------- 은행
  // 이체 번호별 이체 기록. 같은 번호는 같은 이체라 다시 받으면 처음 결과를 돌려준다.
  // 이체 금액: 읽은 정산 결과의 지급액, 정산 결과를 읽지 않았거나 없으면 읽은 미정산 금액.
  const amountOf = (a) => (a.reg.settle ? a.reg.settle.amount : a.reg.merchant ? a.reg.merchant.unpaid : null);
  const bank = {
    label: '은행',
    keyLabel: '이체 번호',
    init: {},
    fmt: (st) => Object.keys(st).map((k) => `${k}: ${st[k].m}에 ${won(st[k].amt)}`).join(', ') || '이체 없음',
    ops: {

  // ---------------------------------------------------------------- 규칙
  function invariants(f) {

    const bk = f.ext.bank;

      const p = paid[m] || [];
      if (p.length > 1) out.push(`${m}에 이체가 ${p.length}번 나갔다 (이중 지급)`);
      if (p.length && !st) out.push(`${m}에 ${won(p[0])}이 이체됐는데 정산 결과가 없다`);
      if (p.length && st && p[0] !== st.amount) out.push(`${m}에 ${won(p[0])}을 이체했는데 정산 결과의 지급액은 ${won(st.amount)}이다`);
      if (st && st.status === 'PAID' && !p.length) out.push(`${m} 정산 결과는 PAID인데 실제 이체가 없다`);
      if (st && st.status === 'FAILED' && p.length) out.push(`${m} 정산 결과는 FAILED인데 실제로는 이체됐다`);

    }

  const BATCH_PALETTE = {
    blocks: ['begin', 'commit', 'read', 'check', 'if', 'insert', 'update', 'call', 'stop'],
    tables: {
      merchant: { keys: [['$cur', '이 가맹점']], read: ['none', 'update'] },
      settle: { keys: [[SKEY, '이 가맹점의 오늘 정산']], read: ['none', 'update'] },

    '은행 이체: 같은 이체 번호를 다시 받으면 새로 보내지 않고 처음 결과를 돌려준다. 이체 금액은 읽은 정산 결과의 지급액이다(정산 결과를 읽지 않았거나 없으면 읽은 미정산 금액).',
    '은행 이체 결과 조회: 이체 번호로 은행에 이체 기록이 있는지 알려 준다. 기록이 없으면 이체되지 않은 것이다.',

  SD.problems.push({

/* 문제: 숙소 예약 결제 대기 점유

 * 유형: 배타적 상태 전이가 둘 다 일어남(L1 만료와 확정 동시, L2 결제 결과 모름과 늦은 승인)

(function (root) {
  'use strict';
  const SD = (root.SD = root.SD || {});
  SD.problems = SD.problems || [];

  // ---------------------------------------------------------------- PG
  const holdOf = (a) => (a.kind === 'req' ? a.params.hold : a.cur);

    label: 'PG',
    keyLabel: '결제 요청 번호',
    init: {},
    fmt: (st) => Object.keys(st).map((k) => `${k}:${st[k].st === 'APPROVED' ? '승인' : '취소'}`).join(', ') || '-',
    ops: {
      approve: {
        label: '결제 승인',
        outcomes: [
          ['ok', '승인되면'],
          ['declined', '거절되면'],
          ['timeout', '타임아웃이면'],
        ],
        visLabels: { ok: '승인', declined: '거절', timeout: '타임아웃' },
        faults: ['declined', 'timeout_applied', 'timeout_lost'],
        run({ st, key, a, fault }) {
          const p = st[key];
          if (fault === 'declined') return { vis: 'declined' };
          if (fault === 'timeout_lost') return { vis: 'timeout', note: '실제로는 도착 안 함' };
          let r = 'ok';
          let note;
          if (!p) st[key] = { hold: holdOf(a), st: 'APPROVED' };
          else if (p.st === 'APPROVED') note = '같은 요청 번호라 기존 승인을 돌려줌';
          else {
            r = 'declined';
            note = '취소된 요청 번호는 다시 승인하지 않음';
          }
          if (fault === 'timeout_applied') return { vis: 'timeout', note: r === 'ok' ? '실제로는 승인됨' : '실제로는 거절됨' };
          return { vis: r, note };
        },
      },
      query: {
        label: '결제 조회',
        outcomes: [
          ['approved', '승인이 있으면'],
          ['none', '없으면'],
          ['timeout', '타임아웃이면'],
        ],
        visLabels: { approved: '승인 있음', none: '승인 없음', timeout: '타임아웃' },
        faults: ['timeout'],
        run({ st, key, fault }) {
          if (fault != null) return { vis: 'timeout' };
          return { vis: st[key] && st[key].st === 'APPROVED' ? 'approved' : 'none' };
        },
      },
      cancel: {
        label: '결제 취소',
        outcomes: [
          ['ok', '취소되면'],
          ['timeout', '타임아웃이면'],
        ],
        visLabels: { ok: '처리됨', timeout: '타임아웃' },
        faults: ['timeout_applied', 'timeout_lost'],
        run({ st, key, fault }) {
          if (fault === 'timeout_lost') return { vis: 'timeout', note: '실제로는 도착 안 함' };
          const p = st[key];
          const hit = p && p.st === 'APPROVED';
          if (hit) p.st = 'CANCELLED';
          const note = hit ? '승인 취소(환불)' : '취소할 승인이 없어 그대로';
          if (fault === 'timeout_applied') return { vis: 'timeout', note: `실제로는 ${note}` };

    },
  };

  // ---------------------------------------------------------------- 블록 만들기
  const W_HELD = { f: 'st', op: 'eq', v: 'HELD' };
  const W_PAYING = { f: 'st', op: 'eq', v: 'PAYING' };
  const W_DUE = { f: 'exp', op: 'le', v: '$r.clock.now' };
  function mk(role) {
    const key = role === 'req' ? '$p.hold' : '$cur';
    return {
      begin: () => ({ t: 'begin' }),
      commit: () => ({ t: 'commit' }),
      readHold: (lock) => ({ t: 'read', table: 'hold', key, lock: lock || 'none' }),
      readClock: () => ({ t: 'read', table: 'clock', key: 'now', lock: 'none' }),
      isSt: (op, v) => ({ t: 'check', a: '$r.hold.st', op, b: v }),
      isDue: () => ({ t: 'check', a: '$r.hold.exp', op: 'le', b: '$r.clock.now' }),
      ifDue: (yes, no) => ({ t: 'if', a: '$r.hold.exp', op: 'le', b: '$r.clock.now', br: { yes, no } }),

  // ---------------------------------------------------------------- L1 답
  const L1_REQ = [P.upd('CONFIRMED', [W_HELD], { zero: [P.fail()] }), P.ok()];
  const L1_EXP = [X.readClock(), X.begin(), X.upd('EXPIRED', [W_HELD, W_DUE], { zero: [X.stop()] }), X.roomUp(), X.commit()];
  const L1_REQ_LOCK = [P.begin(), P.readHold('update'), P.isSt('eq', 'HELD'), P.upd('CONFIRMED'), P.commit(), P.ok()];

  // ---------------------------------------------------------------- L2 답
  // 경합 허용: 승인 뒤 조건부 확정, 0건이면 환불. 복구는 확정 안 된 점유의 결제를 조회해 확정하거나 환불한다.
  function req2(o = {}) {
    const k = o.newKey ? 'new' : undefined;
    return [
      P.readHold(),

      P.call(
        'approve',
        {

          declined: [P.fail()],
          timeout: o.timeoutFail ? [P.fail()] : [P.pending()],

  }
  function rec2(o = {}) {

  const L2_REC = rec2();

  // 결제 중 표시: 만료 흐름은 HELD만 풀고, 복구가 PAYING을 결제 조회로 정리한다
  const L2_REQ_PAYING = [

  const LIVE = { HELD: 1, PAYING: 1, CONFIRMED: 1 };

    if (left + live < ROOMS) out.push(`점유가 ${st}인데 판매 가능이 ${left}개다 (풀린 객실이 판매로 돌아오지 않았다)`);

  // ---------------------------------------------------------------- 수치 단계
  // 구독 하나 처리 = 청구 작업 첫 회차. 정상 경로 반례표에서 첫 회차 줄만 더한다.
  function firstRound(m) {
    const rows = (m.trace && m.trace.rows) || [];
    if (!rows.length) return { T: m.T || 0, C: m.C || 0, pg: 0 };
    const who = rows[0].who;
    let T = 0;
    let C = 0;
    let pgN = 0;
    for (const r of rows) {
      if (r.who !== who) break;
      T += r.ms || 0;
      if (r.conn) C += r.ms || 0;
      if (/^PG /.test(r.text || '')) pgN += 1;
    }
    return { T, C, pg: pgN };
  }

    read: '행 하나를 읽는다 (일반, FOR UPDATE, 복제본)',
    count: '조건에 맞는 행 수를 센다',
    check: '값을 비교하고, 다르면 실패로 끝낸다',
    if: '조건에 따라 갈래를 나눈다',
    update: 'UPDATE 한 문장 (1건, 0건 갈래)',
    delete: 'DELETE 한 문장 (1건, 0건 갈래)',
    insert: 'INSERT 한 문장 (들어감, 중복 갈래)',
    call: '외부 시스템을 부른다 (결과별 갈래)',
    publish: '메시지를 토픽에 쓴다 (성공, 실패, 타임아웃 갈래)',
    ack: '지금 메시지까지 처리했다고 알린다',
    cget: '캐시 값을 읽는다 (있음, 없음 갈래)',
    cset: '캐시에 쓴다 (항상, 없을 때만, 버전이 클 때만)',
    cdel: '캐시 키를 지운다',
    cincr: '캐시 숫자를 원자적으로 더한다',
    respond: '요청에 응답하고 흐름을 끝낸다',
    stop: '이번 행이나 메시지 처리를 마친다',
  };
  const READ_MODE = { none: '일반 읽기', update: 'FOR UPDATE (쓰기 잠금)', replica: '복제본에서 읽기' };
  const CSET_COND = { always: '항상', absent: '없을 때만', newer: '버전이 더 클 때만' };
  const RESP = { ok: '성공', fail: '실패', pending: '처리 중' };

  // 재료 합치기: 중급 모드는 그 문제의 모든 흐름 단계 재료를 합쳐 보여 준다(재료 목록이 힌트가 되지 않게).
  const pairsUnion = (a, b) => {
    const out = (a || []).slice();
    for (const x of b || []) if (!out.some((y) => enc(y[0]) === enc(x[0]))) out.push(x);
    return out;
  };
  const byUnion = (a, b, key) => {
    const out = (a || []).slice();
    for (const x of b || []) if (!out.some((y) => key(y) === key(x))) out.push(x);
    return out;
  };
  const setUnion = (a, b) => [...new Set([...(a || []), ...(b || [])])];
  function mergePal(a, b) {
    const m = clone(a || {});
    b = b || {};
    m.blocks = setUnion(m.blocks, b.blocks);
    m.tables = m.tables || {};
    for (const t of Object.keys(b.tables || {})) {
      const had = (a && a.tables && a.tables[t]) || null;
      const x = m.tables[t] || (m.tables[t] = {});
      x.keys = pairsUnion(x.keys, b.tables[t].keys);
      x.read = setUnion(had ? readModes({ tables: { [t]: had } }, t) : [], readModes(b, t));
      delete x.lock;
    }
    m.conds = m.conds || [];
    for (const c of b.conds || []) {
      const x = m.conds.find((y) => enc(y.a) === enc(c.a));
      if (!x) m.conds.push(clone(c));
      else {
        x.ops = setUnion(x.ops || ['eq'], c.ops || ['eq']);
        x.b = pairsUnion(x.b, c.b);
      }
    }
    for (const k of ['set', 'where']) {
      m[k] = m[k] || {};
      for (const t of Object.keys(b[k] || {})) {
        m[k][t] = m[k][t] || {};
        for (const f of Object.keys(b[k][t])) {
          if (k === 'set') m.set[t][f] = pairsUnion(m.set[t][f], b.set[t][f]);
          else {
            const x = m.where[t][f] || (m.where[t][f] = { v: [] });
            x.ops = setUnion(x.ops || ['eq'], b.where[t][f].ops || ['eq']);
            x.v = pairsUnion(x.v, b.where[t][f].v);
          }
        }
      }
    }
    m.deletes = setUnion(m.deletes, b.deletes);
    for (const k of ['inserts', 'counts', 'publishes']) m[k] = byUnion(m[k], b[k], (x) => x.label);
    m.calls = m.calls || [];
    for (const c of b.calls || []) {
      const x = m.calls.find((y) => y.ext === c.ext);
      if (!x) m.calls.push(clone(c));
      else {
        x.ops = setUnion(x.ops, c.ops);
        x.keys = pairsUnion(x.keys, c.keys);
      }
    }
    if (b.caches) {
      m.caches = m.caches || {};
      for (const c of Object.keys(b.caches)) {
        const x = m.caches[c] || (m.caches[c] = {});
        const y = b.caches[c];
        x.keys = pairsUnion(x.keys, y.keys);
        x.values = pairsUnion(x.values, y.values);
        x.by = y.by || x.by ? pairsUnion(x.by, y.by) : undefined;
        x.conds = setUnion(x.conds, y.conds);
      }
    }
    m.respond = pairsUnion(m.respond, b.respond);
    if (m.respondValues || b.respondValues) m.respondValues = pairsUnion(m.respondValues, b.respondValues);
    return m;
  }
  const palCache = new Map();
  function allPal(P, L, role) {
    const key = `${P.id}/${L.id}/${role}/all`;
    if (!palCache.has(key)) {
      let m = (L.palette && L.palette[role]) || {};
      for (const X of P.levels) if (X !== L && X.kind === 'flow' && X.palette && X.palette[role]) m = mergePal(m, X.palette[role]);
      palCache.set(key, m);
    }
    return palCache.get(key);
  }
  const palFor = (P, L, role) => (hidden() ? allPal(P, L, role) : (L.palette && L.palette[role]) || {});

  function flowSpec(L, id) {
    return L.flows.find((f) => f.id === id);
  }
  function failText(L, id) {
    const f = flowSpec(L, id);
    if (!f || f.kind === 'req') return '실패 응답';
    if (f.kind === 'consumer') return '이 메시지 처리 끝';
    return f.each ? '이 행 처리 끝' : '이번 회차 끝';
  }
  const tl = (P, t) => E.tLabel(P, t);
  // 팔레트의 [값, 이름] 목록에서 이름을 찾고, 없으면 엔진의 기본 이름을 쓴다.
  function nameIn(P, L, list, v) {
    const hit = (list || []).find((o) => enc(o[0]) === enc(v));
    if (hit && hit[1]) return hit[1];
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      if (v.add != null) return `+ ${E.tokText(P, L, v.add)}`;
      if (v.sub != null) return `- ${E.tokText(P, L, v.sub)}`;
    }
    return E.tokText(P, L, v);
  }
  const opts = (P, L, list) => (list || []).map((o) => [o[0], o[1] || nameIn(P, L, [], o[0])]);
  const keyOpts = (P, L, pal, t) => opts(P, L, (pal.tables && pal.tables[t] && pal.tables[t].keys) || []);
  function callEntry(pal, ext) {
    return (pal.calls || []).find((c) => c.ext === ext);
  }
  function condEntry(pal, a) {
    return (pal.conds || []).find((c) => enc(c.a) === enc(a));
  }

  function describe(P, L, role, b) {
    const pal = allPal(P, L, role);
    const keyName = (t, k) => nameIn(P, L, pal.tables && pal.tables[t] && pal.tables[t].keys, k);
    // 행 이름에 테이블 이름이 들어 있으면 그대로, 아니면 테이블 이름을 앞에 붙인다.
    const place = (t, k) => {
      const kn = keyName(t, k);
      return String(kn).includes(tl(P, t)) ? kn : `${tl(P, t)} ${kn}`;
    };
    switch (b.t) {
      case 'begin':
      case 'commit':
      case 'ack':
        return BLOCK_NAME[b.t] + (b.t === 'ack' ? ' (오프셋 커밋)' : '');
      case 'read':
        return `${place(b.table, b.key)} 읽기 (${b.src === 'replica' ? '복제본' : b.lock === 'update' ? 'FOR UPDATE' : '일반'})`;
      case 'count':
        return b.label || `${tl(P, b.table)} 개수 세기`;
      case 'check':
      case 'if': {
        const c = condEntry(pal, b.a);
        const an = (c && c.label) || E.tokText(P, L, b.a);
        const bn = E.UNARY[b.op] ? '' : ` ${nameIn(P, L, c && c.b, b.b)}`;
        return b.t === 'check' ? `확인: ${an} ${E.OP_TEXT[b.op] || '?'}${bn} (아니면 ${failText(L, role)})` : `조건: ${an} ${E.OP_TEXT[b.op] || '?'}${bn}`;
      }
      case 'update':
      case 'delete': {
        const sets = [];
        const S = (pal.set && pal.set[b.table]) || {};
        for (const f of Object.keys(b.set || {})) {
          if (b.set[f] === '*' || b.set[f] === undefined) continue;
          sets.push(`${E.fieldLabel(P, b.table, f)} → ${nameIn(P, L, S[f], b.set[f])}`);
        }
        const Wh = (pal.where && pal.where[b.table]) || {};
        const ws = (b.where || []).filter((c) => c.v !== '*').map((c) => `${E.fieldLabel(P, b.table, c.f)} ${E.OP_TEXT[c.op || 'eq']}${E.UNARY[c.op] ? '' : ` ${nameIn(P, L, Wh[c.f] && Wh[c.f].v, c.v)}`}`);
        const head = `${place(b.table, b.key)} ${b.t === 'update' ? '변경' : '삭제'}`;
        return `${head}${sets.length ? `: ${sets.join(', ')}` : ''} (${ws.length ? `조건 ${ws.join(', ')}` : '조건 없음'})`;
      }
      case 'insert':
        return b.label || `${tl(P, b.table)} 넣기`;
      case 'call': {
        const X = P.world.exts && P.world.exts[b.ext];
        const op = X && X.ops[b.op];
        const ce = callEntry(pal, b.ext);
        return `${X ? X.label : '외부'} ${op ? op.label : '?'} (${(X && X.keyLabel) || '요청 번호'}: ${b.key === undefined ? '?' : nameIn(P, L, ce && ce.keys, b.key)})`;
      }
      case 'publish': {
        const pe = (pal.publishes || []).find((x) => x.label === b.label);
        const kn = b.pkey === undefined ? '?' : nameIn(P, L, pe && pe.pkeys, b.pkey);
        return `${b.label || '메시지'} 발행 (파티션 키: ${kn})`;
      }
      case 'cget':
      case 'cdel': {
        const C = (P.world.caches || {})[b.cache];
        const ck = pal.caches && pal.caches[b.cache];
        return `${C ? C.label : '캐시'} ${b.t === 'cget' ? '읽기' : '삭제'}: ${nameIn(P, L, ck && ck.keys, b.key)}`;
      }
      case 'cset': {
        const C = (P.world.caches || {})[b.cache];
        const ck = pal.caches && pal.caches[b.cache];
        return `${C ? C.label : '캐시'} 쓰기: ${nameIn(P, L, ck && ck.keys, b.key)} ← ${nameIn(P, L, ck && ck.values, b.v)} (${CSET_COND[b.cond] || '?'})`;
      }
      case 'cincr': {
        const C = (P.world.caches || {})[b.cache];
        const ck = pal.caches && pal.caches[b.cache];
        const by = b.by === undefined ? 1 : b.by;
        return `${C ? C.label : '캐시'} ${nameIn(P, L, ck && ck.keys, b.key)} ${nameIn(P, L, ck && ck.by, by)}`;
      }
      case 'respond': {
        const rn = nameIn(P, L, pal.respond, b.kind);
        return `${rn} 응답${b.v !== undefined ? ` (${nameIn(P, L, pal.respondValues, b.v)})` : ''}`;
      }
      case 'stop':
        return `여기서 끝 (${failText(L, role) === '실패 응답' ? '' : failText(L, role)})`.replace(' ()', '');
      default:
        return b.t;
    }
  }

  function flowText(P, L, flow, role) {
    const lines = [];
    const walk = (list, depth) => {
      for (const b of list || []) {
        lines.push(h('div', { class: `ft d${Math.min(depth, 4)} k-${b.t}` }, describe(P, L, role, b)));
        // 빈 갈래(다음 블록으로 넘어가는 갈래)는 적지 않는다.
        for (const br of E.branchesOf(P, b)) {
          const sub = (b.br && b.br[br.n]) || [];
          if (!sub.length) continue;
          lines.push(h('div', { class: `ft br d${Math.min(depth + 1, 4)}` }, br.label));
          walk(sub, depth + 2);
        }
      }
    };
    walk(flow, 0);
    if (!lines.length) lines.push(h('div', { class: 'ft muted' }, '(비어 있음)'));
    return h('div', { class: 'flowtext' }, lines);
  }

  // ---------------------------------------------------------------- 블록 편집기
  function withIds(flow) {
    return (flow || []).map((b) => {
      const c = clone(b);
      c.id = uid();
      if (b.br) {
        c.br = {};
        for (const k of Object.keys(b.br)) c.br[k] = withIds(b.br[k]);
      }
      return c;
    });
  }
  function getList(root, path) {
    let list = root;
    for (let k = 0; k < path.length; k += 2) {
      const b = list[path[k]];
      b.br = b.br || {};
      list = b.br[path[k + 1]] || (b.br[path[k + 1]] = []);
    }
    return list;
  }
  const only1 = (list) => (list && list.length === 1 ? list[0][0] : undefined);
  function readModes(pal, t) {
    const T = (pal.tables && pal.tables[t]) || {};
    if (T.read) return T.read;
    return T.lock ? ['none', 'update'] : ['none'];
  }
  function newBlock(P, L, t, pal) {
    const tables = Object.keys(pal.tables || {});
    const t0 = tables.length === 1 ? tables[0] : undefined;
    const key0 = (tt) => (tt ? only1((pal.tables[tt] || {}).keys) : undefined);
    switch (t) {
      case 'read': {
        const m = t0 ? readModes(pal, t0) : [];
        const b = { t, table: t0, key: key0(t0) };
        if (m.length === 1) {
          if (m[0] === 'replica') b.src = 'replica';
          else b.lock = m[0];
        }
        return b;
      }
      case 'check':
      case 'if': {
        const c = pal.conds && pal.conds.length === 1 ? pal.conds[0] : null;
        return { t, a: c ? c.a : undefined, op: c && c.ops && c.ops.length === 1 ? c.ops[0] : c ? 'eq' : undefined, b: undefined };
      }
      case 'update':
      case 'delete': {
        const ts = Object.keys(pal.set || pal.tables || {});
        const tt = ts.length === 1 ? ts[0] : undefined;
        return Object.assign({ t, table: tt, key: key0(tt), where: [] }, t === 'update' ? { set: {} } : {});
      }
      case 'insert':
      case 'count':
        return pal[t === 'insert' ? 'inserts' : 'counts'] && pal[t === 'insert' ? 'inserts' : 'counts'].length === 1 ? Object.assign({ t }, clone(pal[t === 'insert' ? 'inserts' : 'counts'][0])) : { t };
      case 'call': {
        const c = pal.calls && pal.calls.length === 1 ? pal.calls[0] : null;
        return { t, ext: c ? c.ext : undefined, op: c && c.ops.length === 1 ? c.ops[0] : undefined, key: c ? only1(c.keys) : undefined, br: {} };
      }
      case 'publish': {
        const p = pal.publishes && pal.publishes.length === 1 ? pal.publishes[0] : null;
        if (!p) return { t, br: {} };
        return { t, label: p.label, topic: p.topic, payload: clone(p.payload), pkey: p.pkeys ? only1(p.pkeys) : null, br: {} };
      }
      case 'cget':
      case 'cset':
      case 'cdel':
      case 'cincr': {
        const cs = Object.keys(pal.caches || {});
        const c = cs.length === 1 ? cs[0] : undefined;
        const C = c ? pal.caches[c] : {};
        const b = { t, cache: c, key: only1(C.keys) };
        if (t === 'cincr') b.by = C.by ? only1(C.by) : 1;
        if (t === 'cset') {
          b.v = only1(C.values);
          b.cond = C.conds && C.conds.length === 1 ? C.conds[0] : undefined;
        }
        return b;
      }
      case 'respond':
        return { t, kind: only1(pal.respond) };
      default:
        return { t };
    }
  }

  // 복사하거나 잘라낸 블록. 같은 화면 안에서 다른 갈래, 다른 흐름에 붙여 넣는다.
  let clip = null;
  const strip = (b) => {
    const c = clone(b);
    const drop = (x) => {
      delete x.id;
      for (const k of Object.keys(x.br || {})) x.br[k].forEach(drop);
    };
    drop(c);
    return c;
  };

  function editor(P, L, flow, role, pal, onChange) {
    const root = h('div', { class: 'editor' });
    const rerender = () => {
      root.replaceChildren(renderList([], 0));
      onChange();
    };
    const tableOpts = (list) => list.map((t) => [t, tl(P, t)]);
    const fixed = (x) => h('span', { class: 'fx' }, x);
    const word = (x) => h('span', { class: 'w' }, x);
    const T = (x) => h('b', null, x);

    function body(b) {
      const set = (k) => (v) => {
        b[k] = v;
        rerender();
      };
      switch (b.t) {
        case 'begin':
        case 'commit':
          return [T(BLOCK_NAME[b.t])];
        case 'ack':
          return [T('소비 확인'), word('(오프셋 커밋)')];
        case 'stop': {
          const f = failText(L, role);
          return [T('여기서 끝'), f === '실패 응답' ? null : word(`(${f})`)];
        }
        case 'read': {
          const ts = Object.keys(pal.tables || {});
          const out = [];
          if (ts.length > 1)
            out.push(
              chip('읽을 테이블', tableOpts(ts), b.table, (v) => {
                b.table = v;
                b.key = only1((pal.tables[v] || {}).keys);
                delete b.lock;
                delete b.src;
                rerender();
              }),
            );
          if (b.table) {
            const ko = keyOpts(P, L, pal, b.table);
            if (ts.length <= 1 && !ko.some(([, l]) => String(l).includes(tl(P, b.table)))) out.push(fixed(tl(P, b.table)));
            out.push(ko.length > 1 || b.key === undefined ? chip('읽을 행', ko, b.key, set('key')) : fixed(ko[0] ? ko[0][1] : ''));
          }
          out.push(T('읽기'));
          if (b.table) {
            const modes = readModes(pal, b.table);
            if (modes.length > 1)
              out.push(
                chip(
                  '읽기 방식',
                  modes.map((m) => [m, READ_MODE[m]]),
                  b.src === 'replica' ? 'replica' : b.lock,
                  (v) => {
                    if (v === 'replica') {
                      b.src = 'replica';
                      delete b.lock;
                    } else {
                      delete b.src;
                      b.lock = v;
                    }
                    rerender();
                  },
                ),
              );
          }
          return out;
        }
        case 'count':
        case 'insert': {
          const list = pal[b.t === 'insert' ? 'inserts' : 'counts'] || [];
          const k = list.findIndex((x) => x.label === b.label);
          return [
            T(BLOCK_NAME[b.t]),
            chip(
              b.t === 'insert' ? '넣을 행' : '셀 것',
              list.map((x, i) => [i, x.label]),
              k >= 0 ? k : undefined,
              (i) => {
                const keep = { id: b.id, t: b.t, br: b.br };
                for (const x of Object.keys(b)) delete b[x];
                Object.assign(b, keep, clone(list[i]));
                rerender();
              },
            ),
          ];
        }
        case 'check':
        case 'if': {
          const cs = pal.conds || [];
          const c = condEntry(pal, b.a);
          const out = [
            T(b.t === 'check' ? '확인' : '조건'),
            chip(
              '비교할 값',
              cs.map((x) => [x.a, x.label || E.tokText(P, L, x.a)]),
              b.a,
              (v) => {
                b.a = v;
                const nc = condEntry(pal, v);
                b.op = nc && nc.ops && nc.ops.length === 1 ? nc.ops[0] : 'eq';
                b.b = undefined;
                rerender();
              },
            ),
          ];
          if (c) {
            const ops = c.ops || ['eq'];
            out.push(ops.length > 1 ? chip('비교', ops.map((o) => [o, E.OP_TEXT[o]]), b.op, set('op'), 'op') : fixed(E.OP_TEXT[ops[0]]));
            if (!E.UNARY[b.op]) out.push(chip('비교 대상', opts(P, L, c.b), b.b, set('b')));
          }
          if (b.t === 'check') out.push(word(`아니면 ${failText(L, role)}`));
          return out;
        }
        case 'update':
        case 'delete':
          return writeBody(b, set);
        case 'call': {
          const choices = [];
          for (const c of pal.calls || []) {
            const X = P.world.exts[c.ext];
            for (const op of c.ops) choices.push([`${c.ext}.${op}`, `${X.label} ${X.ops[op].label}`]);
          }
          const ce = callEntry(pal, b.ext);
          const X = b.ext && P.world.exts[b.ext];
          const cur = b.ext && b.op ? `${b.ext}.${b.op}` : undefined;
          const out = [
            choices.length > 1 || cur === undefined
              ? chip('호출할 연산', choices, cur, (v) => {
                  const [ext, op] = v.split('.');
                  if (ext !== b.ext) b.key = only1((callEntry(pal, ext) || {}).keys);
                  b.ext = ext;
                  b.op = op;
                  b.br = {};
                  rerender();
                })
              : fixed(choices[0][1]),
            T('호출'),
          ];
          if (X && ce) {
            const ko = opts(P, L, ce.keys);
            out.push(word(X.keyLabel || '요청 번호'));
            out.push(ko.length > 1 || b.key === undefined ? chip(X.keyLabel || '요청 번호', ko, b.key, set('key')) : fixed(ko[0] ? ko[0][1] : ''));
          }
          return out;
        }
        case 'publish': {
          const list = pal.publishes || [];
          const pe = list.find((x) => x.label === b.label);
          const out = [
            T('발행'),
            list.length > 1 || !pe
              ? chip(
                  '보낼 메시지',
                  list.map((x, i) => [i, x.label]),
                  pe ? list.indexOf(pe) : undefined,
                  (i) => {
                    const p = list[i];
                    b.label = p.label;
                    b.topic = p.topic;
                    b.payload = clone(p.payload);
                    b.pkey = p.pkeys ? only1(p.pkeys) : null;
                    rerender();
                  },
                )
              : fixed(pe.label),
          ];
          if (pe && pe.pkeys) out.push(word('파티션 키'), chip('파티션 키', opts(P, L, pe.pkeys), b.pkey, set('pkey')));
          return out;
        }
        case 'cget':
        case 'cset':
        case 'cdel':
        case 'cincr': {
          const cs = Object.keys(pal.caches || {});
          const C = (b.cache && pal.caches[b.cache]) || {};
          const out = [];
          out.push(
            cs.length > 1 || !b.cache
              ? chip(
                  '캐시',
                  cs.map((c) => [c, P.world.caches[c].label]),
                  b.cache,
                  (v) => {
                    b.cache = v;
                    const N = pal.caches[v] || {};
                    b.key = only1(N.keys);
                    if (b.t === 'cset') {
                      b.v = only1(N.values);
                      b.cond = N.conds && N.conds.length === 1 ? N.conds[0] : undefined;
                    }
                    rerender();
                  },
                )
              : fixed(P.world.caches[b.cache].label),
          );
          if (!b.cache) return out;
          const ko = opts(P, L, C.keys);
          out.push(ko.length > 1 || b.key === undefined ? chip('캐시 키', ko, b.key, set('key')) : fixed(ko[0] ? ko[0][1] : ''));
          if (b.t === 'cget') out.push(T('읽기'));
          if (b.t === 'cdel') out.push(T('삭제'));
          if (b.t === 'cincr') {
            const by = C.by ? opts(P, L, C.by) : [[1, '1 증가']];
            out.push(by.length > 1 ? chip('얼마나', by, b.by, set('by')) : T(by[0][1]));
          }
          if (b.t === 'cset') {
            out.push(T('쓰기'), word('←'), chip('쓸 값', opts(P, L, C.values), b.v, set('v')));
            const conds = C.conds || ['always'];
            if (conds.length > 1)
              out.push(
                chip(
                  '쓰기 조건',
                  conds.map((c) => [c, CSET_COND[c]]),
                  b.cond,
                  (v) => {
                    b.cond = v;
                    b.br = {};
                    rerender();
                  },
                ),
              );
          }
          return out;
        }
        case 'respond': {
          const ro = opts(P, L, pal.respond);
          const out = [ro.length > 1 || b.kind === undefined ? chip('응답 종류', ro, b.kind, set('kind')) : fixed(ro[0][1]), T('응답')];
          if (pal.respondValues)
            out.push(
              word('값'),
              chip('응답에 담을 값', [['__none', '없음'], ...opts(P, L, pal.respondValues)], b.v === undefined ? '__none' : b.v, (v) => {
                if (v === '__none') delete b.v;
                else b.v = v;
                rerender();
              }),
            );
          return out;
        }
        default:
          return [b.t];
      }
    }

    // 변경, 삭제: 바꿀 값과 조건은 고른 것만 보이고, 더할 때는 "＋"로 고른다.
    function writeBody(b, set) {
      const ts = Object.keys(b.t === 'update' ? pal.set || {} : pal.tables || {}).filter((t) => b.t === 'update' || (pal.deletes || []).includes(t));
      const out = [];
      if (ts.length > 1 || !b.table)
        out.push(
          chip(b.t === 'update' ? '바꿀 테이블' : '지울 테이블', tableOpts(ts), b.table, (v) => {
            b.table = v;
            b.key = only1((pal.tables[v] || {}).keys);
            b.set = {};
            b.where = [];
            rerender();
          }),
        );
      if (b.table) {
        const ko = keyOpts(P, L, pal, b.table);
        if (!(ts.length > 1) && !ko.some(([, l]) => String(l).includes(tl(P, b.table)))) out.push(fixed(tl(P, b.table)));
        out.push(ko.length > 1 || b.key === undefined ? chip('행', ko, b.key, set('key')) : fixed(ko[0] ? ko[0][1] : ''));
      }
      out.push(T(b.t === 'update' ? '변경' : '삭제'));
      if (!b.table) return out;
      const F = (f) => E.fieldLabel(P, b.table, f);
      if (b.t === 'update') {
        const S = (pal.set && pal.set[b.table]) || {};
        b.set = b.set || {};
        const on = Object.keys(S).filter((f) => b.set[f] !== undefined && b.set[f] !== '*');
        const line = h('span', { class: 'clause' });
        for (const f of on)
          line.append(
            word(`${F(f)} →`),
            chip(`${F(f)} 바꿀 값`, [['*', '바꾸지 않음'], ...opts(P, L, S[f])], b.set[f], (v) => {
              b.set[f] = v;
              rerender();
            }),
          );
        const rest = Object.keys(S).filter((f) => !on.includes(f));
        if (rest.length)
          line.append(
            h(
              'button',
              {
                class: 'chip add',
                type: 'button',
                onclick: () =>
                  openSheet(
                    '바꿀 필드',
                    rest.map((f) => ({
                      label: F(f),
                      onClick: () =>
                        openSheet(
                          `${F(f)} 바꿀 값`,
                          opts(P, L, S[f]).map(([v, l]) => ({
                            label: l,
                            onClick: () => {
                              b.set[f] = clone(v);
                              rerender();
                            },
                          })),
                        ),
                    })),
                  ),
              },
              '＋ 바꿀 값',
            ),
          );
        out.push(line);
      }
      const Wh = (pal.where && pal.where[b.table]) || {};
      if (Object.keys(Wh).length) {
        b.where = b.where || [];
        const line = h('span', { class: 'clause' }, word('조건'));
        const conds = b.where.filter((x) => x.v !== '*');
        if (!conds.length) line.append(word('없음'));
        for (const c of conds) {
          const spec = Wh[c.f] || { v: [] };
          const ops = spec.ops || ['eq'];
          const setCond = (op, v) => {
            b.where = b.where.filter((x) => x.f !== c.f);
            if (v !== '*') b.where.push({ f: c.f, op, v });
            rerender();
          };
          line.append(word(F(c.f)));
          line.append(ops.length > 1 ? chip('비교', ops.map((o) => [o, E.OP_TEXT[o]]), c.op, (op) => setCond(op, E.UNARY[op] ? null : c.v), 'op') : fixed(E.OP_TEXT[ops[0]]));
          if (E.UNARY[c.op]) line.append(h('button', { class: 'chip', type: 'button', onclick: () => setCond(c.op, '*') }, '조건 빼기'));
          else line.append(chip(`${F(c.f)} 조건 값`, [['*', '조건 빼기'], ...opts(P, L, spec.v)], c.v, (v) => setCond(c.op, v)));
        }
        const restW = Object.keys(Wh).filter((f) => !b.where.some((x) => x.f === f));
        const addCond = (f) => {
          const spec = Wh[f];
          const ops = spec.ops || ['eq'];
          const pickVal = (op) => {
            if (E.UNARY[op]) {
              b.where.push({ f, op, v: null });
              rerender();
              return;
            }
            openSheet(
              `${F(f)} 조건 값`,
              opts(P, L, spec.v).map(([v, l]) => ({
                label: l,
                onClick: () => {
                  b.where.push({ f, op, v: clone(v) });
                  rerender();
                },
              })),
            );
          };
          if (ops.length > 1) openSheet('비교', ops.map((o) => ({ label: E.OP_TEXT[o], onClick: () => pickVal(o) })));
          else pickVal(ops[0]);
        };
        if (restW.length) line.append(h('button', { class: 'chip add', type: 'button', onclick: () => openSheet('조건 필드', restW.map((f) => ({ label: F(f), onClick: () => addCond(f) }))) }, '＋ 조건'));
        out.push(line);
      }
      return out;
    }

    function renderList(path, depth) {
      const list = getList(flow, path);

        const item = h('div', { class: 'item' }, row);

            if (!sub.length) box.appendChild(h('div', { class: 'branch empty' }, h('span', { class: 'brlabel' }, br.label), h('span', { class: 'muted small' }, '다음 블록으로'), addButtons(sub, true)));
            else box.appendChild(h('div', { class: 'branch' }, h('div', { class: 'brlabel' }, br.label), renderList([...path, i, br.n], depth + 1)));
          }
          item.appendChild(box);

      });
      // 안쪽 갈래는 블록 메뉴의 "아래에 블록 넣기"로 더한다. 맨 바깥 목록에만 추가 줄을 둔다.

  function lint(P, L, flow, role, out) {
    const name = (b) => BLOCK_NAME[b.t];
    for (const b of flow || []) {
      const need = (cond, what) => {
        if (cond) out.push(`${name(b)}: ${what}을(를) 고르세요.`.replace('을(를)', '을'));
      };
      switch (b.t) {
        case 'read':
          need(!b.table || b.key === undefined, '테이블과 행');
          need(b.table && !b.src && !b.lock, '읽기 방식(일반, FOR UPDATE)');
          break;
        case 'count':
        case 'insert':
          need(!b.table, '무엇을');
          break;
        case 'check':
        case 'if':
          need(b.a === undefined || !b.op, '비교할 값');
          need(b.op && !E.UNARY[b.op] && b.b === undefined, '비교 대상');
          break;
        case 'update':
          need(!b.table || b.key === undefined, '테이블과 행');
          if (b.table && !Object.keys(b.set || {}).some((f) => b.set[f] !== '*' && b.set[f] !== undefined)) out.push('변경: 바꿀 값을 하나 이상 고르세요.');
          break;
        case 'delete':
          need(!b.table || b.key === undefined, '테이블과 행');
          break;
        case 'call':
          need(!b.ext || !b.op, '호출할 연산');
          need(b.ext && b.key === undefined, (P.world.exts[b.ext] && P.world.exts[b.ext].keyLabel) || '요청 번호');
          break;
        case 'publish':
          need(!b.topic, '보낼 메시지');
          need(b.topic && b.pkey === undefined, '파티션 키');
          break;
        case 'cget':
        case 'cdel':
        case 'cincr':
          need(!b.cache || b.key === undefined, '캐시 키');
          break;
        case 'cset':
          need(!b.cache || b.key === undefined, '캐시 키');
          need(b.v === undefined, '쓸 값');
          need(!b.cond, '쓰기 조건');
          break;
        case 'respond':
          need(!b.kind, '응답 종류');
          break;
        default:
      }
      for (const br of E.branchesOf(P, b)) lint(P, L, b.br && b.br[br.n], role, out);
    }
    return out;
  }

  // ---------------------------------------------------------------- 반례 표
  // 배경 흐름이 같은 일을 되풀이한 회차는 한 줄로 접는다.
  function collapseRuns(rows) {
    const out = [];
    let prevSig = null;
    let cur = null;
    const flush = () => {
      if (!cur) return;
      const sig = cur.rows.map((r) => r.text + JSON.stringify(r.chg)).join('|');
      if (prevSig === sig) out.push({ who: cur.who, text: '앞 회차와 같음', same: true, chg: [] });
      else out.push(...cur.rows);
      prevSig = sig;
      cur = null;
    };
    for (const r of rows) {
      if (r.bg) {
        if (!cur || cur.who !== r.who) {
          flush();
          cur = { who: r.who, rows: [] };
        }
        cur.rows.push(r);
      } else {
        flush();
        prevSig = null;
        out.push(r);
      }
    }
    flush();
    return out;
  }

  function stateList(entries) {
    return h('div', { class: 'chg' }, entries.map(([k, v]) => h('div', null, h('span', { class: 'muted' }, `${k} `), h('span', { class: 'mono' }, v))));
  }

  // 같은 표 안에서 행위자가 처음 나온 순서대로 색을 붙인다. 배경 흐름 회차는 같은 색이다.
  const whoBase = (w) => String(w).replace(/ \d+회차$| \(.*\)$/, '');
  function traceTable(trace, o) {
    o = o || {};
    const rows = collapseRuns(trace.rows);
    const colors = new Map();
    const colorOf = (w) => {
      const k = whoBase(w);
      if (!colors.has(k)) colors.set(k, colors.size % 6);
      return colors.get(k);
    };
    let tT = 0;
    let tC = 0;
    const table = h(
      'table',
      { class: `trace${o.timing ? ' timing' : ''}` },
      h('thead', null, h('tr', null, h('th', null, '#'), h('th', null, '누가'), h('th', null, o.timing ? '한 일' : '한 일 (바뀐 상태)'), o.timing ? [h('th', null, '시간'), h('th', null, '커넥션')] : null)),
      h(
        'tbody',
        null,
        rows.map((r, i) => {
          if (o.timing) {
            tT += r.ms || 0;
            if (r.conn) tC += r.ms || 0;
          }
          return h(
            'tr',
            { class: [r.fault ? 'fault' : '', r.crash ? 'crash' : '', r.error || r.deadlock ? 'err' : '', r.same ? 'same' : ''].join(' ') },
            h('td', { class: 'n' }, i + 1),
            h('td', { class: 'who' }, h('span', { class: `whob c${colorOf(r.who)}` }, r.who)),
            h('td', null, r.text, !o.timing && r.chg && r.chg.length ? stateList(r.chg) : null),
            o.timing ? [h('td', { class: 'num' }, `${r.ms || 0}ms`), h('td', { class: 'num' }, r.conn ? '쥠' : '')] : null,
          );
        }),
      ),
      o.timing ? h('tfoot', null, h('tr', null, h('td', { colspan: 3 }, '합계'), h('td', { class: 'num' }, `${tT}ms`), h('td', { class: 'num' }, `${tC}ms`))) : null,
    );
    const box = h('div', null);
    if (!o.timing && trace.start && trace.start.length) box.appendChild(h('details', { class: 'start small' }, h('summary', null, '처음 상태'), stateList(trace.start)));
    box.appendChild(h('div', { class: 'tscroll' }, table));
    return box;
  }
